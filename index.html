 com cores alternadas. Uma coluna vazia aceita qualquer carta.","Move-se uma carta de cada vez – ou uma sequência, por «supermovimento»: no máximo (células livres + 1) · 2^(colunas vazias) cartas (a coluna de destino vazia não conta).","As fundações crescem por naipe, do Ás ao Rei. Uma carta numa fundação não pode ser retirada.","Ganha-se quando todas as cartas estão nas fundações."],"scoring":"Não há pontuação oficial; a aplicação mostra o número de cartas nas fundações. O que conta são os movimentos e o tempo.","impl":"Completo. O supermovimento é opcional (caso contrário, uma carta de cada vez). Células: 3 / 4 / 5. «Tem solução?» usa um solucionador com limite de nós: resolúvel / não resolvido dentro do limite / desconhecido – sem pretensão de certeza. Sabe-se que o jogo #11982 não tem solução; o solucionador da aplicação esgota o seu espaço de estados sem a encontrar (ver o README)."},"spider":{"name":"Spider","origin":"Uma paciência de dois baralhos, conhecida sobretudo do Windows. Joga-se com 1, 2 ou 4 naipes; com um só naipe é muito mais fácil.","desc":"Dez colunas, 104 cartas; o objetivo é formar oito sequências completas Rei → Ás de um mesmo naipe.","rules":["Dez colunas: quatro de 6 cartas e seis de 5 (só a de cima está virada para cima); o baralho tem 50 cartas (5 distribuições de 10).","Constrói-se em ordem decrescente independentemente do naipe, mas só as sequências decrescentes do MESMO naipe se movem em bloco.","Uma coluna vazia aceita qualquer carta.","Baralho: uma carta sobre cada coluna; não se pode distribuir enquanto houver uma coluna vazia.","Quando se forma uma sequência R–Ás de um só naipe, é retirada automaticamente. Oito sequências dão a vitória."],"scoring":"Estilo Windows: 500 pontos no início, −1 por movimento (e por distribuição), +100 por cada sequência completa retirada. Diferença em relação ao Windows: aqui Desfazer repõe exatamente a pontuação (no Windows custa 1 ponto).","impl":"Completo: 1, 2 ou 4 naipes (baralho de 104 cartas com repetições: 8×♠; 4×♠+4×♥; dois baralhos completos). A pesquisa de dicas está limitada a alguns segundos e pode ser fraca com 2/4 naipes."},"yukon":{"name":"Yukon","origin":"Um parente do Klondike sem baralho de reserva; o nome também evoca a corrida ao ouro (o rio Yukon).","desc":"Todas as cartas são distribuídas no início; pode mover-se qualquer carta visível juntamente com tudo o que está por cima, mesmo que o grupo não seja uma sequência.","rules":["Sete colunas: 1, 6, 7, 8, 9, 10, 11 cartas; a primeira mostra uma carta, as outras têm 1…6 cartas viradas para baixo e 5 viradas para cima.","Constrói-se em ordem decrescente com cores alternadas. Qualquer carta virada para cima pode ser movida com todas as cartas que a cobrem, desde que a primeira encaixe no destino.","Uma coluna vazia só aceita um Rei (com as suas cartas).","Fundações do Ás ao Rei por naipe; as cartas podem ser retiradas de uma fundação."],"scoring":"Sem pontuação oficial; a aplicação mostra as cartas nas fundações.","impl":"Completo. Sem baralho de reserva."},"pyramid":{"name":"Pirâmide","origin":"Uma paciência de eliminação de pares conhecida por vários nomes; joga-se com um só baralho.","desc":"Elimine pares de cartas cuja soma é 13. Um Rei (13) elimina-se sozinho.","rules":["28 cartas formam uma pirâmide de 7 filas; as outras 24 são o baralho.","Uma carta da pirâmide está disponível quando já nenhuma carta a cobre.","Elimine duas cartas disponíveis cuja soma é 13 (Ás=1, Valete=11, Dama=12): Ás+Dama, 2+Valete, 3+10, 4+9, 5+8, 6+7. Um Rei sai sozinho.","Cartas disponíveis: as cartas livres da pirâmide, a de cima do descarte e a de cima do baralho. As cartas compram-se uma a uma do baralho para o descarte.","Redistribuições do baralho: 0, 1 ou 2 (2 por predefinição, como em «Par Pyramid»)."],"scoring":"Não há pontuação padrão: a aplicação conta as cartas eliminadas.","impl":"⚠ Regras controversas, escolhidas e documentadas: (1) a carta de cima do baralho está disponível para formar pares (como descreve a Wikipédia); (2) as redistribuições são 2 por predefinição (a regra base não tem nenhuma); (3) vitória por predefinição = pirâmide limpa (opcional: as 52 cartas). Pontuação própria (cartas eliminadas)."},"tripeaks":{"name":"TriPeaks","origin":"Também escrito Tri Peaks; uma paciência do tipo Golf com três pirâmides sobrepostas, muito comum em jogos digitais.","desc":"Limpe os três picos jogando cartas no descarte quando o seu valor é um acima ou um abaixo da carta de cima.","rules":["28 cartas formam três picos (filas de 3, 6, 9 e 10 cartas); uma carta é jogável quando está livre. A fila de baixo é visível; as restantes viram-se à medida que ficam livres.","Uma carta livre pode ser jogada no descarte se o seu valor diferir exatamente de 1 do da carta de cima do descarte (para cima ou para baixo). Opcional: Ás e Rei são adjacentes (por predefinição: não).","Se não tiver jogadas, compre uma carta do baralho para o descarte. Não há redistribuição.","Ganha-se quando as 28 cartas estão eliminadas."],"scoring":"⚠ Convenção própria (não existe um padrão único): cada carta de uma sequência ininterrupta de jogadas vale 1, 2, 3 … pontos; comprar do baralho reinicia a sequência; limpar um pico: +15 (os dois primeiros), +30 (o terceiro).","impl":"⚠ Pontuação própria; adjacência Ás–Rei opcional. As regras de jogo são as padrão."},"golf":{"name":"Golf","origin":"Uma paciência rápida; o nome vem da pontuação ao estilo do golfe (quanto menos cartas restarem, melhor).","desc":"Sete colunas de 5 cartas, todas visíveis. Jogue a carta de cima de uma coluna no descarte se o seu valor diferir de 1.","rules":["Sete colunas de 5 cartas viradas para cima; uma carta vai para o descarte; as outras 16 formam o baralho.","Só a carta de cima de uma coluna pode ser jogada, se o seu valor diferir exatamente de 1 do da carta de cima do descarte (para cima ou para baixo). Regra tradicional: sem passagem do Rei para o Ás, e nada (nem sequer uma Dama) pode ser jogado sobre um Rei – opções: permitir a Dama, ou a passagem completa R↔Ás.","Sem jogadas? Compre uma carta do baralho. Sem redistribuição.","Ganha-se se todas as colunas forem limpas; caso contrário, conta quantas cartas restam."],"scoring":"⚠ Pontuação própria: o número de cartas retiradas das colunas (máximo 35). A forma clássica conta as cartas que sobram.","impl":"⚠ Pontuação própria. As regras de jogo são as tradicionais (uma só passagem, Rei sem saída, sem passagem circular), com opções."},"scorpion":{"name":"Scorpion","origin":"Uma paciência em que as sequências se constroem por naipe e qualquer carta visível pode ser movida juntamente com as que estão por cima.","desc":"Sete colunas de 7 cartas e 3 cartas de reserva; o objetivo: quatro sequências completas Rei → Ás, uma por naipe.","rules":["As primeiras quatro colunas têm as 3 primeiras cartas viradas para baixo e 4 viradas para cima; as últimas três são totalmente visíveis. Ficam 3 cartas como baralho.","Constrói-se em ordem decrescente no MESMO naipe. Qualquer carta visível pode ser movida com tudo o que está por cima, se a primeira encaixar no destino. Nada vai sobre um Ás.","Uma coluna vazia só aceita um Rei (com o seu grupo).","Quando não tem jogadas, as 3 cartas do baralho são colocadas nas três primeiras colunas.","Ganha-se com quatro sequências R→Ás por naipe (ficam nas colunas)."],"scoring":"Sem pontuação oficial; a aplicação mostra 13 pontos por cada sequência completa.","impl":"Completo. Distribuir o baralho é permitido a qualquer momento (não só quando está bloqueado)."},"canfield":{"name":"Canfield","origin":"Diz-se que vem de um casino americano onde o jogador comprava o baralho e era pago por cada carta nas fundações; também chamado «Demon» (a reserva).","desc":"Uma reserva de 13 cartas, quatro colunas e uma carta base que define o valor inicial das fundações.","rules":["Reserva: 13 cartas (só a de cima é visível). A primeira carta de fundação define o valor base das quatro fundações. Quatro colunas de uma carta. O resto é o baralho (34).","Colunas: decrescentes, cores alternadas, «contornando a esquina» (um Ás pode ficar sobre um 2; um Rei sobre um Ás). Fundações: em ordem crescente por naipe a partir do valor base, passando de R para Ás.","Movimentos entre colunas: uma carta ou a coluna inteira (estrito; opcionalmente também sequências parciais).","Os espaços vazios TÊM de ser preenchidos a partir da reserva; quando a reserva está vazia, só a partir do descarte.","Baralho: 3 cartas de cada vez (opcionalmente 1); passagens ilimitadas / 1 / 3."],"scoring":"O padrão não tem pontuação (a versão de casino pagava 5 $ por carta). A aplicação mostra as cartas nas fundações.","impl":"⚠ Escolhas de regra: preencher espaços com cartas de outras colunas não é permitido; sem movimento fundação → coluna; movimento estrito (uma carta ou a coluna inteira) por predefinição."},"forty":{"name":"Quarenta ladrões","origin":"Uma paciência clássica de dois baralhos. Muito difícil: ganham-se relativamente poucos jogos.","desc":"Dez colunas de 4 cartas visíveis, oito fundações e um baralho de 64 cartas que se percorre uma só vez.","rules":["Dois baralhos (104 cartas): dez colunas de 4 cartas viradas para cima, 8 fundações do Ás ao Rei por naipe, 64 cartas no baralho.","Colunas: decrescentes, no MESMO naipe; só se move a carta de cima (uma de cada vez).","Uma coluna vazia aceita qualquer carta.","Baralho: uma carta de cada vez para o descarte; uma só passagem. A carta de cima do descarte é jogável.","Não se retiram cartas das fundações. Ganha-se quando as 104 cartas estão nas fundações."],"scoring":"Sem pontuação oficial; a aplicação mostra as cartas nas fundações.","impl":"Completo."},"clock":{"name":"Relógio","origin":"Um puro jogo de sorte, sem qualquer decisão; adequado para crianças.","desc":"Treze pilhas dispostas como o mostrador de um relógio. Não toma nenhuma decisão: vira as cartas e vê se chega ao fim (probabilidade ≈ 1/13).","rules":["As 52 cartas são distribuídas em 13 pilhas viradas para baixo, de 4: 12 à volta do mostrador (Ás=1 … Dama=12) e uma ao centro (os Reis).","Vire a carta de cima da pilha central e coloque-a virada para cima por baixo da pilha correspondente ao seu valor (Rei = centro). Depois pegue na carta de cima dessa pilha e repita.","Ganha-se se todas as cartas acabarem viradas para cima. Perde-se se o quarto Rei aparecer primeiro (a pilha atual já não tem cartas viradas para baixo)."],"scoring":"Sem pontuação; a aplicação conta as cartas viradas. A probabilidade teórica de vitória é 1/13 ≈ 7,7 %.","impl":"Completo. A jogada é obrigatória (um único botão «Virar a carta seguinte» / «Executar até ao fim»). Desfazer funciona."},"bakers":{"name":"Dúzia do padeiro","origin":"Uma paciência com 13 colunas de 4 cartas (uma «dúzia do padeiro»); os Reis são passados para o fundo das suas colunas.","desc":"Todas as cartas são visíveis; a construção ignora a cor, mas não há células e as colunas esvaziadas não podem voltar a ser preenchidas.","rules":["Treze colunas de 4 cartas. Antes de jogar, os Reis são passados para o fundo das suas colunas (mantendo a ordem).","As colunas constroem-se em ordem decrescente independentemente do naipe; move-se uma carta (a de cima) de cada vez.","Uma coluna esvaziada nunca pode voltar a ser preenchida.","Quatro fundações, Ás → Rei por naipe. Ganha-se quando todas as cartas estão nas fundações."],"scoring":"Sem pontuação oficial; a aplicação mostra as cartas nas fundações.","impl":"Completo. No telemóvel a mesa (13 colunas) desloca-se na horizontal com cartas ≥ 44 px (botões ◀ ▶); a opção «Mostrar a mesa toda» reduz as cartas para caberem."},"eightoff":{"name":"Eight Off","origin":"Um parente do FreeCell, com oito células e construção no mesmo naipe.","desc":"Oito colunas de 6 cartas visíveis, oito células (quatro ocupadas no início) e quatro fundações.","rules":["Oito colunas de 6 cartas viradas para cima; as outras 4 cartas são colocadas nas primeiras quatro das oito células.","As colunas constroem-se em ordem decrescente no MESMO naipe; só se move uma carta de cada vez (as células não aumentam o comprimento de um movimento).","Uma coluna vazia aceita (por predefinição) só um Rei, como na regra tradicional; opcionalmente qualquer carta.","Fundações: Ás → Rei por naipe. Ganha-se quando todas as cartas estão nas fundações."],"scoring":"Sem pontuação oficial; a aplicação mostra as cartas nas fundações.","impl":"Completo (Rei / qualquer carta numa coluna vazia, à escolha)."},"spiderette":{"name":"Spiderette","origin":"A versão de um só baralho do Spider.","desc":"Sete colunas (1…7 cartas, como no Klondike) e um baralho distribuído sete cartas de cada vez; constrói-se em ordem decrescente independentemente do naipe, só se movem sequências do mesmo naipe.","rules":["Um baralho de 52 cartas, 7 colunas escalonadas, 24 cartas no baralho.","Objetivo: quatro sequências completas R→Ás por naipe."],"scoring":"","impl":"Só atlas – não implementado (pode jogar Spider em vez disso)."},"seahaven":{"name":"Seahaven Towers","origin":"Um parente do FreeCell; construção no naipe.","desc":"Dez colunas de 5 cartas, quatro células (duas ocupadas no início), uma carta de cada vez.","rules":["Constrói-se em ordem decrescente no mesmo naipe.","Uma coluna vazia só aceita um Rei.","Fundações Ás → Rei por naipe."],"scoring":"","impl":"Só atlas – não implementado (Eight Off é o jogo mais próximo na aplicação)."},"beleaguered":{"name":"Beleaguered Castle","origin":"Uma paciência com todas as cartas visíveis e sem células.","desc":"Os Ases começam nas fundações; oito colunas de 6 cartas.","rules":["Constrói-se em ordem decrescente independentemente do naipe, uma carta de cada vez.","Uma coluna vazia aceita qualquer carta.","Fundações Ás → Rei por naipe."],"scoring":"","impl":"Só atlas – não implementado."},"calculation":{"name":"Calculation","origin":"Uma paciência aritmética com quatro fundações que crescem em passos diferentes.","desc":"As fundações sobem de 1 em 1 (Ás,2,3…), de 2 em 2 (2,4,6…), de 3 em 3 e de 4 em 4, ciclicamente módulo 13; as cartas do baralho vão para quatro pilhas de espera.","rules":["Objetivo: todas as cartas nas fundações, cada uma até ao Rei.","Cada carta do baralho pode ir para qualquer uma das quatro pilhas de espera."],"scoring":"","impl":"Só atlas – não implementado."},"accordion":{"name":"Acordeão","origin":"Uma paciência compacta disposta numa única linha de cartas.","desc":"As cartas são colocadas em fila; uma carta pode ser movida para cima da vizinha da esquerda ou da terceira carta à sua esquerda se coincidirem no naipe ou no valor.","rules":["Objetivo: uma única pilha no fim."],"scoring":"","impl":"Só atlas – não implementado."},"acesup":{"name":"Aces Up","origin":"Uma paciência curta em quatro colunas.","desc":"Distribua uma carta por cada uma de quatro colunas; retire uma carta se noutra coluna estiver visível uma carta mais alta do mesmo naipe (o Ás é a mais alta).","rules":["Uma coluna vazia aceita qualquer carta visível de outra.","Objetivo: ficam só os quatro Ases."],"scoring":"","impl":"Só atlas – não implementado."},"russian":{"name":"Paciência russa","origin":"Uma variante do Yukon em que se constrói no mesmo naipe.","desc":"Como o Yukon (qualquer carta visível move-se com as que estão por cima), mas as colunas constroem-se em ordem decrescente no mesmo naipe.","rules":["Uma coluna vazia só aceita um Rei."],"scoring":"","impl":"Só atlas – não implementado (o Yukon é jogável)."}},"de":{"klondike":{"name":"Klondike","origin":"Die bekannteste Patience. Der Name verweist auf den Goldrausch am Klondike; die modernen Regeln haben sich vor allem durch Windows (1990) weit verbreitet. Der genaue Ursprung ist ungewiss.","desc":"Sieben Spalten mit verdeckten Karten, ein Stapel, von dem man 1 oder 3 Karten zieht, und vier Ablagen. Eine Mischung aus Glück (was verdeckt liegt) und Planung.","rules":["Die Spalten enthalten 1, 2, … 7 Karten; nur die oberste liegt offen.","Die Spalten werden absteigend mit abwechselnden Farben aufgebaut (Rot auf Schwarz). Jede gültige Folge offener Karten kann verschoben werden.","Eine leere Spalte nimmt nur einen König (mit seiner Folge) auf.","Die Ablagen werden je Farbe aufsteigend vom Ass bis zum König aufgebaut. Karten dürfen von einer Ablage zurückgenommen werden.","Stapel: Man zieht 1 oder 3 Karten auf den Abwurf; die oberste ist spielbar. Ist der Stapel aufgebraucht, wird der Abwurf erneut umgedreht (Anzahl der Durchgänge wählbar: unbegrenzt / 1 / 3).","Man gewinnt, wenn alle 52 Karten auf den Ablagen liegen."],"scoring":"Standard (Windows-Stil): Abwurf → Spalte +5, Abwurf → Ablage +10, Spalte → Ablage +10, Karte aufgedeckt +5, Ablage → Spalte −15. Abwurf neu aufnehmen: bei Ziehen von 1 jedes Mal −100; bei Ziehen von 3 −20 ab dem 4. Durchgang (der Wert −20 wird von zwei Sekundärquellen bestätigt — rarepike.com und solitairecat.com —, nicht aber von Wikipedia, das nur −100 für Ziehen von 1 nennt; die ursprünglichen Windows-Regeln wurden nicht direkt eingesehen). Die Punktzahl sinkt nie unter 0; kein Zeitbonus. Vegas: −52 zu Beginn, +5 je Karte auf einer Ablage (ein „Dollar“-Betrag); üblicherweise 1 Durchgang bei Ziehen von 1 und 3 Durchgänge bei Ziehen von 3 (die Zahl der Durchgänge stellt man selbst ein). „Zurück“ stellt auch die Punktzahl genau wieder her.","impl":"Vollständig: Ziehen 1/3, Durchgänge unbegrenzt/1/3, Wertung Standard/Vegas/keine. Kein Zeitbonus. Tipp und „Automatisch lösen“ sehen auch die verdeckten Karten."},"freecell":{"name":"FreeCell","origin":"1978 auf dem Lernsystem PLATO entstanden und in den 1990er-Jahren durch Windows bekannt geworden. Die Spielnummern #1–#32000 in dieser App entsprechen denen der Microsoft-Version (öffentlich dokumentierter LCG-Algorithmus).","desc":"Alle Karten sind von Anfang an sichtbar; vier freie Zwischenfelder helfen beim Rangieren. Fast jedes Spiel ist lösbar.","rules":["Acht Spalten (4×7 + 4×6 Karten), alle offen; vier Zwischenfelder, die je eine Karte aufnehmen; vier Ablagen.","Die Spalten werden absteigend mit abwechselnden Farben aufgebaut. Eine leere Spalte nimmt jede Karte auf.","Man bewegt eine Karte nach der anderen – oder eine Folge per „Supermove“: höchstens (freie Zwischenfelder + 1) · 2^(leere Spalten) Karten (eine leere Zielspalte wird nicht mitgezählt).","Die Ablagen wachsen je Farbe vom Ass bis zum König. Eine Karte auf einer Ablage kann nicht zurückgenommen werden.","Man gewinnt, wenn alle Karten auf den Ablagen liegen."],"scoring":"Es gibt keine offizielle Wertung; die App zeigt die Zahl der Karten auf den Ablagen. Zählen tun Züge und Zeit.","impl":"Vollständig. Der Supermove ist optional (sonst jeweils eine Karte). Zwischenfelder: 3 / 4 / 5. „Ist es lösbar?“ nutzt einen Löser mit Knotenlimit: lösbar / innerhalb des Limits nicht gelöst / unbekannt – ohne Anspruch auf Gewissheit. Das Spiel #11982 ist bekanntermaßen unlösbar; der Löser der App erschöpft seinen Zustandsraum ohne Lösung (siehe README)."},"spider":{"name":"Spider","origin":"Eine Patience mit zwei Kartenspielen, vor allem aus Windows bekannt. Gespielt wird mit 1, 2 oder 4 Farben; mit einer Farbe ist sie deutlich leichter.","desc":"Zehn Spalten, 104 Karten; Ziel ist es, acht vollständige Folgen König → Ass in einer Farbe zu bilden.","rules":["Zehn Spalten: vier mit 6 Karten und sechs mit 5 (nur die oberste liegt offen); der Stapel enthält 50 Karten (5 Austeilungen zu je 10).","Man baut absteigend unabhängig von der Farbe auf, aber nur absteigende Folgen DERSELBEN Farbe lassen sich als Gruppe bewegen.","Eine leere Spalte nimmt jede Karte auf.","Stapel: eine Karte auf jede Spalte; solange eine Spalte leer ist, darf nicht ausgeteilt werden.","Bildet sich eine K–A-Folge einer Farbe, wird sie automatisch entfernt. Acht Folgen bedeuten den Sieg."],"scoring":"Windows-Stil: 500 Punkte zu Beginn, −1 je Zug (und je Austeilung), +100 für jede entfernte vollständige Folge. Unterschied zu Windows: Hier stellt „Zurück“ die Punktzahl genau wieder her (in Windows kostet es 1 Punkt).","impl":"Vollständig: 1, 2 oder 4 Farben (104-Karten-Deck mit Wiederholungen: 8×♠; 4×♠+4×♥; zwei volle Decks). Die Tipp-Suche ist auf wenige Sekunden begrenzt und kann bei 2/4 Farben schwach sein."},"yukon":{"name":"Yukon","origin":"Ein Verwandter des Klondike ohne Stapel; auch der Name erinnert an den Goldrausch (der Fluss Yukon).","desc":"Alle Karten werden zu Beginn ausgeteilt; man darf jede offene Karte samt allem, was darauf liegt, verschieben, auch wenn die Gruppe keine Folge ist.","rules":["Sieben Spalten: 1, 6, 7, 8, 9, 10, 11 Karten; die erste zeigt eine Karte, die anderen haben 1…6 verdeckte und 5 offene Karten.","Man baut absteigend mit abwechselnden Farben auf. Jede offene Karte kann mit allen Karten darüber verschoben werden, sofern die erste auf das Ziel passt.","Eine leere Spalte nimmt nur einen König (mit seinen Karten) auf.","Ablagen vom Ass bis zum König je Farbe; Karten dürfen von einer Ablage zurückgenommen werden."],"scoring":"Keine offizielle Wertung; die App zeigt die Karten auf den Ablagen.","impl":"Vollständig. Kein Stapel."},"pyramid":{"name":"Pyramide","origin":"Eine Paar-Patience, die unter mehreren Namen bekannt ist; gespielt wird mit einem einzigen Deck.","desc":"Entferne Kartenpaare, deren Summe 13 ergibt. Ein König (13) wird allein entfernt.","rules":["28 Karten bilden eine Pyramide aus 7 Reihen; die übrigen 24 sind der Stapel.","Eine Karte der Pyramide ist verfügbar, wenn keine Karte sie mehr verdeckt.","Entferne zwei verfügbare Karten mit der Summe 13 (Ass=1, Bube=11, Dame=12): A+D, 2+B, 3+10, 4+9, 5+8, 6+7. Ein König geht allein.","Verfügbare Karten: die freien Karten der Pyramide, die oberste Karte des Abwurfs und die oberste Karte des Stapels. Vom Stapel zieht man die Karten einzeln auf den Abwurf.","Neue Durchgänge des Stapels: 0, 1 oder 2 (standardmäßig 2, wie bei „Par Pyramid“)."],"scoring":"Es gibt keine Standardwertung: Die App zählt die entfernten Karten.","impl":"⚠ Umstrittene Regeln, gewählt und dokumentiert: (1) Die oberste Karte des Stapels ist für Paare verfügbar (wie Wikipedia es beschreibt); (2) Neu-Durchgänge standardmäßig 2 (die Grundregel kennt keine); (3) Standard-Sieg = Pyramide abgeräumt (optional: alle 52 Karten). Eigene Wertung (entfernte Karten)."},"tripeaks":{"name":"TriPeaks","origin":"Auch Tri Peaks geschrieben; eine Golf-artige Patience mit drei überlappenden Pyramiden, in digitalen Spielen sehr verbreitet.","desc":"Räume die drei Gipfel ab, indem du Karten auf den Abwurf spielst, deren Wert um eins höher oder niedriger ist als der der obersten Karte.","rules":["28 Karten bilden drei Gipfel (Reihen zu 3, 6, 9 und 10 Karten); eine Karte ist spielbar, wenn sie frei liegt. Die unterste Reihe ist sichtbar, die übrigen werden aufgedeckt, sobald sie frei werden.","Eine freie Karte darf auf den Abwurf gespielt werden, wenn ihr Wert genau um 1 von der obersten Abwurfkarte abweicht (aufwärts oder abwärts). Optional: Ass und König sind benachbart (Standard: nein).","Hast du keinen Zug, ziehe eine Karte vom Stapel auf den Abwurf. Es gibt keinen neuen Durchgang.","Man gewinnt, wenn alle 28 Karten abgeräumt sind."],"scoring":"⚠ Eigene Konvention (es gibt keinen einheitlichen Standard): Jede Karte einer ununterbrochenen Spielserie zählt 1, 2, 3 … Punkte; Ziehen vom Stapel setzt die Serie zurück; Gipfel abgeräumt: +15 (die ersten beiden), +30 (der dritte).","impl":"⚠ Eigene Wertung; Nachbarschaft A–K optional. Die Spielregeln sind die üblichen."},"golf":{"name":"Golf","origin":"Eine schnelle Patience; der Name stammt von der Wertung nach Golf-Art (je weniger Karten übrig, desto besser).","desc":"Sieben Spalten zu je 5 Karten, alle sichtbar. Spiele die oberste Karte einer Spalte auf den Abwurf, wenn ihr Wert um 1 abweicht.","rules":["Sieben Spalten mit je 5 offenen Karten; eine Karte kommt auf den Abwurf; die übrigen 16 bilden den Stapel.","Nur die oberste Karte einer Spalte kann gespielt werden, wenn ihr Wert genau um 1 von der obersten Abwurfkarte abweicht (aufwärts oder abwärts). Traditionelle Regel: kein Übergang vom König zum Ass, und auf einen König darf nichts (auch keine Dame) gespielt werden – Optionen: Dame erlauben oder vollständiger Übergang K↔A.","Kein Zug möglich? Ziehe eine Karte vom Stapel. Kein neuer Durchgang.","Man gewinnt, wenn alle Spalten abgeräumt sind; sonst zählt, wie viele Karten übrig bleiben."],"scoring":"⚠ Eigene Wertung: die Zahl der aus den Spalten abgeräumten Karten (höchstens 35). Die klassische Methode zählt die übrig gebliebenen Karten.","impl":"⚠ Eigene Wertung. Die Spielregeln sind die traditionellen (ein Durchgang, König als Sackgasse, kein Übergang), mit Optionen."},"scorpion":{"name":"Scorpion","origin":"Eine Patience, in der Folgen nach Farbe aufgebaut werden und jede sichtbare Karte samt den darauf liegenden verschoben werden darf.","desc":"Sieben Spalten zu je 7 Karten und 3 Reservekarten; Ziel: vier vollständige Folgen König → Ass, eine je Farbe.","rules":["Die ersten vier Spalten haben ihre ersten 3 Karten verdeckt und 4 offen; die letzten drei sind ganz sichtbar. 3 Karten bleiben als Stapel.","Man baut absteigend in DERSELBEN Farbe auf. Jede sichtbare Karte kann mit allem, was darauf liegt, verschoben werden, wenn die erste aufs Ziel passt. Auf ein Ass kommt nichts.","Eine leere Spalte nimmt nur einen König (mit seiner Gruppe) auf.","Hast du keine Züge mehr, werden die 3 Stapelkarten auf die ersten drei Spalten gelegt.","Man gewinnt mit vier K→A-Folgen je Farbe (sie bleiben in den Spalten)."],"scoring":"Keine offizielle Wertung; die App zeigt 13 Punkte für jede vollständige Folge.","impl":"Vollständig. Das Austeilen des Stapels ist jederzeit erlaubt (nicht nur, wenn man blockiert ist)."},"canfield":{"name":"Canfield","origin":"Soll aus einem amerikanischen Casino stammen, in dem der Spieler das Deck kaufte und für jede Karte auf den Ablagen bezahlt wurde; auch „Demon“ (die Reserve) genannt.","desc":"Eine Reserve aus 13 Karten, vier Spalten und eine Basiskarte, die den Startwert der Ablagen festlegt.","rules":["Reserve: 13 Karten (nur die oberste sichtbar). Die erste Ablagekarte legt den Basiswert für alle vier Ablagen fest. Vier Spalten mit je einer Karte. Der Rest ist der Stapel (34).","Spalten: absteigend, abwechselnde Farben, „um die Ecke“ (ein Ass darf auf einer 2 liegen; ein König auf einem Ass). Ablagen: aufwärts je Farbe ab dem Basiswert, mit Übergang K→A.","Züge zwischen Spalten: eine Karte oder die ganze Spalte (strikt; optional auch Teilfolgen).","Leere Plätze MÜSSEN aus der Reserve gefüllt werden; ist die Reserve leer, nur aus dem Abwurf.","Stapel: je 3 Karten (optional 1); Durchgänge unbegrenzt / 1 / 3."],"scoring":"Der Standard kennt keine Wertung (die Casino-Version zahlte 5 $ pro Karte). Die App zeigt die Karten auf den Ablagen.","impl":"⚠ Regelentscheidungen: Lücken mit Karten aus anderen Spalten zu füllen ist nicht erlaubt; kein Zug Ablage → Spalte; strikter Zug (eine Karte oder die ganze Spalte) als Standard."},"forty":{"name":"Vierzig Diebe","origin":"Eine klassische Patience mit zwei Decks. Sehr schwer: Verhältnismäßig wenige Spiele werden gewonnen.","desc":"Zehn Spalten zu je 4 sichtbaren Karten, acht Ablagen und ein Stapel aus 64 Karten, der nur einmal durchgegangen wird.","rules":["Zwei Decks (104 Karten): zehn Spalten zu je 4 offenen Karten, 8 Ablagen vom Ass zum König je Farbe, 64 Karten im Stapel.","Spalten: absteigend, in DERSELBEN Farbe; nur die oberste Karte wird bewegt (einzeln).","Eine leere Spalte nimmt jede Karte auf.","Stapel: jeweils eine Karte auf den Abwurf; ein einziger Durchgang. Die oberste Abwurfkarte ist spielbar.","Von den Ablagen werden keine Karten zurückgenommen. Man gewinnt, wenn alle 104 Karten auf den Ablagen liegen."],"scoring":"Keine offizielle Wertung; die App zeigt die Karten auf den Ablagen.","impl":"Vollständig."},"clock":{"name":"Uhr","origin":"Ein reines Glücksspiel ganz ohne Entscheidungen; auch für Kinder geeignet.","desc":"Dreizehn Stapel, wie ein Zifferblatt angeordnet. Du triffst keine Entscheidungen: Du drehst Karten um und siehst, ob du bis zum Ende kommst (Chance ≈ 1/13).","rules":["Die 52 Karten werden auf 13 verdeckte Stapel zu je 4 verteilt: 12 rund um das Zifferblatt (Ass=1 … Dame=12) und einer in der Mitte (die Könige).","Drehe die oberste Karte des Mittelstapels um und lege sie offen unter den Stapel, der ihrem Wert entspricht (König = Mitte). Nimm dann die oberste Karte dieses Stapels und wiederhole.","Man gewinnt, wenn am Ende alle Karten offen liegen. Man verliert, wenn zuerst der vierte König erscheint (der aktuelle Stapel hat keine verdeckten Karten mehr)."],"scoring":"Keine Wertung; die App zählt die aufgedeckten Karten. Die theoretische Gewinnchance beträgt 1/13 ≈ 7,7 %.","impl":"Vollständig. Der Zug ist zwangsläufig (eine einzige Schaltfläche „Nächste Karte aufdecken“ / „Bis zum Ende ausführen“). „Zurück“ funktioniert."},"bakers":{"name":"Bäckerdutzend","origin":"Eine Patience mit 13 Spalten zu je 4 Karten (ein „Bäckerdutzend“); die Könige werden ans untere Ende ihrer Spalten verschoben.","desc":"Alle Karten sind sichtbar; beim Aufbau spielt die Farbe keine Rolle, aber es gibt keine Zwischenfelder, und geleerte Spalten können nicht wieder gefüllt werden.","rules":["Dreizehn Spalten zu je 4 Karten. Vor dem Spiel werden die Könige ans untere Ende ihrer Spalten verschoben (in unveränderter Reihenfolge).","Die Spalten werden absteigend unabhängig von der Farbe aufgebaut; es wird jeweils eine Karte (die oberste) bewegt.","Eine geleerte Spalte kann nie wieder gefüllt werden.","Vier Ablagen, Ass → König je Farbe. Man gewinnt, wenn alle Karten auf den Ablagen liegen."],"scoring":"Keine offizielle Wertung; die App zeigt die Karten auf den Ablagen.","impl":"Vollständig. Auf dem Handy scrollt der Tisch (13 Spalten) waagerecht mit Karten ≥ 44 px (Tasten ◀ ▶); die Option „Ganzen Tisch zeigen“ verkleinert sie, damit alles passt."},"eightoff":{"name":"Eight Off","origin":"Ein Verwandter des FreeCell, mit acht Zwischenfeldern und Aufbau in derselben Farbe.","desc":"Acht Spalten zu je 6 sichtbaren Karten, acht Zwischenfelder (vier zu Beginn belegt) und vier Ablagen.","rules":["Acht Spalten zu je 6 offenen Karten; die übrigen 4 Karten kommen auf die ersten vier der acht Zwischenfelder.","Die Spalten werden absteigend in DERSELBEN Farbe aufgebaut; es wird nur eine Karte gleichzeitig bewegt (Zwischenfelder verlängern einen Zug nicht).","Eine leere Spalte nimmt (standardmäßig) nur einen König auf, wie in der traditionellen Regel; optional jede Karte.","Ablagen: Ass → König je Farbe. Man gewinnt, wenn alle Karten auf den Ablagen liegen."],"scoring":"Keine offizielle Wertung; die App zeigt die Karten auf den Ablagen.","impl":"Vollständig (König / jede Karte in eine leere Spalte, wählbar)."},"spiderette":{"name":"Spiderette","origin":"Die Version von Spider mit einem Deck.","desc":"Sieben Spalten (1…7 Karten, wie beim Klondike) und ein Stapel, der je sieben Karten austeilt; man baut absteigend unabhängig von der Farbe auf, bewegt aber nur Folgen derselben Farbe.","rules":["Ein Deck mit 52 Karten, 7 gestaffelte Spalten, 24 Karten im Stapel.","Ziel: vier vollständige K→A-Folgen je Farbe."],"scoring":"","impl":"Nur Atlas – nicht implementiert (stattdessen kannst du Spider spielen)."},"seahaven":{"name":"Seahaven Towers","origin":"Ein Verwandter des FreeCell; Aufbau in der Farbe.","desc":"Zehn Spalten zu je 5 Karten, vier Zwischenfelder (zwei zu Beginn belegt), eine Karte nach der anderen.","rules":["Man baut absteigend in derselben Farbe auf.","Eine leere Spalte nimmt nur einen König auf.","Ablagen Ass → König je Farbe."],"scoring":"","impl":"Nur Atlas – nicht implementiert (Eight Off ist das nächstliegende Spiel in der App)."},"beleaguered":{"name":"Beleaguered Castle","origin":"Eine Patience mit lauter sichtbaren Karten und ohne Zwischenfelder.","desc":"Die Asse liegen zu Beginn auf den Ablagen; acht Spalten zu je 6 Karten.","rules":["Man baut absteigend unabhängig von der Farbe auf, jeweils eine Karte.","Eine leere Spalte nimmt jede Karte auf.","Ablagen Ass → König je Farbe."],"scoring":"","impl":"Nur Atlas – nicht implementiert."},"calculation":{"name":"Calculation","origin":"Eine Rechen-Patience mit vier Ablagen, die in unterschiedlichen Schritten wachsen.","desc":"Die Ablagen steigen um 1 (A,2,3…), um 2 (2,4,6…), um 3 und um 4, zyklisch modulo 13; Stapelkarten kommen auf vier Wartestapel.","rules":["Ziel: alle Karten auf den Ablagen, jede bis zum König.","Jede Stapelkarte darf auf einen der vier Wartestapel gelegt werden."],"scoring":"","impl":"Nur Atlas – nicht implementiert."},"accordion":{"name":"Akkordeon","origin":"Eine kompakte Patience, die in einer einzigen Kartenreihe ausgelegt wird.","desc":"Die Karten liegen in einer Reihe; eine Karte darf auf ihre linke Nachbarkarte oder auf die dritte Karte links von ihr gelegt werden, wenn Farbe oder Wert übereinstimmen.","rules":["Ziel: am Ende ein einziger Stapel."],"scoring":"","impl":"Nur Atlas – nicht implementiert."},"acesup":{"name":"Aces Up","origin":"Eine kurze Patience mit vier Spalten.","desc":"Teile je eine Karte auf vier Spalten aus; entferne eine Karte, wenn auf einer anderen Spalte eine höhere Karte derselben Farbe sichtbar ist (das Ass ist die höchste).","rules":["Eine leere Spalte nimmt jede sichtbare Karte einer anderen auf.","Ziel: Nur die vier Asse bleiben übrig."],"scoring":"","impl":"Nur Atlas – nicht implementiert."},"russian":{"name":"Russische Patience","origin":"Eine Yukon-Variante, bei der in derselben Farbe aufgebaut wird.","desc":"Wie Yukon (jede sichtbare Karte wird mit den darauf liegenden bewegt), aber die Spalten werden absteigend in derselben Farbe aufgebaut.","rules":["Eine leere Spalte nimmt nur einen König auf."],"scoring":"","impl":"Nur Atlas – nicht implementiert (Yukon ist spielbar)."}},"hu":{"klondike":{"name":"Klondike","origin":"A legismertebb pasziánsz. A név a klondike-i aranyláznak szól; a modern szabályok a Windowson (1990) keresztül terjedtek el széles körben. A pontos eredet bizonytalan.","desc":"Hét oszlop lefordított lapokkal, egy pakli, amelyből 1 vagy 3 lapot húzol, és négy alapkupac. A szerencse (ami rejtve van) és a tervezés keveréke.","rules":["Az oszlopokban 1, 2, … 7 lap van; csak a legfelső néz felfelé.","Az oszlopokat csökkenő sorrendben, váltakozó színekkel építed (piros a feketére). Minden érvényes, felfordított lapokból álló sor mozgatható.","Az üres oszlopba csak király kerülhet (a hozzá tartozó sorral együtt).","Az alapkupacokat színenként növekvő sorrendben építed, ásztól a királyig. Az alapkupacról lapokat vissza lehet venni.","Pakli: 1 vagy 3 lapot húzol a dobópakliba; a legfelső játszható. Ha a pakli elfogy, a dobópaklit újra megfordítod (a körök száma választható: korlátlan / 1 / 3).","Akkor nyersz, ha mind az 52 lap az alapkupacokon van."],"scoring":"Szabványos (Windows-stílus): dobó → oszlop +5, dobó → alapkupac +10, oszlop → alapkupac +10, felfordított lap +5, alapkupac → oszlop −15. A dobópakli újrahasznosítása: 1 lapos húzásnál minden alkalommal −100; 3 lapos húzásnál −20 a 4. körtől kezdve (a −20-as értéket két másodlagos forrás – a rarepike.com és a solitairecat.com – megerősíti, a Wikipédia viszont nem, az csak az 1 lapos húzásra ad −100-at; az eredeti Windows-szabályokat közvetlenül nem néztük meg). A pontszám soha nem megy 0 alá; nincs időbónusz. Vegas: −52 az elején, +5 minden alapkupacra került lapért („dollár” összeg); általában 1 kör 1 lapos húzásnál és 3 kör 3 lapos húzásnál (a körök számát te állítod be). A visszavonás a pontszámot is pontosan visszaállítja.","impl":"Teljes: húzás 1/3, körök korlátlan/1/3, pontozás Szabványos/Vegas/nincs. Nincs időbónusz. A tipp és az „Automatikus megoldás” a lefordított lapokat is látja."},"freecell":{"name":"FreeCell","origin":"1978-ban hozták létre a PLATO oktatási rendszeren, és az 1990-es években a Windows tette népszerűvé. Az alkalmazás #1–#32000 közötti leosztásszámai megegyeznek a Microsoft-változatéval (nyilvánosan dokumentált LCG-algoritmus).","desc":"Minden lap kezdettől látható; négy szabad cella segíti a manőverezést. Szinte minden leosztás megoldható.","rules":["Nyolc oszlop (4×7 + 4×6 lap), mind felfelé fordítva; négy cella, mindegyik egy lapot tart; négy alapkupac.","Az oszlopokat csökkenő sorrendben, váltakozó színekkel építed. Az üres oszlopba bármelyik lap kerülhet.","Egyszerre egy lapot mozgatsz – vagy egy sort „szuper lépéssel”: legfeljebb (szabad cellák + 1) · 2^(üres oszlopok) lapot (az üres célozszlopot nem számoljuk).","Az alapkupacok színenként nőnek ásztól a királyig. Az alapkupacra tett lapot nem lehet visszavenni.","Akkor nyersz, ha minden lap az alapkupacokon van."],"scoring":"Nincs hivatalos pontozás; az alkalmazás az alapkupacokon lévő lapok számát mutatja. A lépések és az idő számítanak.","impl":"Teljes. A szuper lépés opcionális (egyébként egyszerre egy lap). Cellák: 3 / 4 / 5. A „Megoldható?” csomópontkorláttal dolgozó megoldót használ: megoldható / a korláton belül nem oldotta meg / ismeretlen – bizonyosság állítása nélkül. A #11982-es leosztásról köztudott, hogy megoldhatatlan; az alkalmazás megoldója megoldás nélkül meríti ki az állapotterét (lásd a README-t)."},"spider":{"name":"Spider","origin":"Két paklis pasziánsz, főleg a Windowsból ismert. 1, 2 vagy 4 színnel játsszák; egy színnel sokkal könnyebb.","desc":"Tíz oszlop, 104 lap; a cél nyolc teljes király → ász sor építése egy-egy színben.","rules":["Tíz oszlop: négy 6 lapos és hat 5 lapos (csak a legfelső lap néz felfelé); a pakli 50 lapot tartalmaz (5 osztás 10-esével).","Színtől függetlenül csökkenő sorrendben építesz, de csak az UGYANAZON színű csökkenő sorok mozognak egyben.","Az üres oszlopba bármelyik lap kerülhet.","Pakli: egy lap minden oszlopra; amíg van üres oszlop, nem lehet osztani.","Ha egy színben K–A sor áll össze, automatikusan lekerül. Nyolc sor a győzelem."],"scoring":"Windows-stílus: 500 pont az elején, −1 lépésenként (és osztásonként), +100 minden levett teljes sorért. Eltérés a Windowstól: itt a visszavonás pontosan visszaállítja a pontszámot (Windowson 1 pontba kerül).","impl":"Teljes: 1, 2 vagy 4 szín (104 lapos pakli ismétlésekkel: 8×♠; 4×♠+4×♥; két teljes pakli). A tippkeresés néhány másodpercre korlátozott, és 2/4 színnél gyenge lehet."},"yukon":{"name":"Yukon","origin":"A Klondike rokona pakli nélkül; a név szintén az aranyrohamra utal (a Yukon folyó).","desc":"Minden lapot az elején kiosztanak; bármelyik látható lapot mozgathatod a rajta lévő összes lappal együtt, akkor is, ha a csoport nem sor.","rules":["Hét oszlop: 1, 6, 7, 8, 9, 10, 11 lap; az első egy lapot mutat, a többiben 1…6 lefordított és 5 felfordított lap van.","Csökkenő sorrendben, váltakozó színekkel építesz. Bármelyik felfordított lap mozgatható az összes rajta lévő lappal, ha az első illik a célra.","Az üres oszlopba csak király kerülhet (a lapjaival együtt).","Alapkupacok ásztól a királyig színenként; az alapkupacról lapokat vissza lehet venni."],"scoring":"Nincs hivatalos pontozás; az alkalmazás az alapkupacokon lévő lapokat mutatja.","impl":"Teljes. Nincs pakli."},"pyramid":{"name":"Piramis","origin":"Párkiszedő pasziánsz, több néven ismert; egyetlen paklival játsszák.","desc":"Vedd ki azokat a lappárokat, amelyek összege 13. A király (13) egyedül is kivehető.","rules":["28 lap alkot egy 7 soros piramist; a másik 24 a pakli.","A piramis egy lapja akkor érhető el, ha már nem takarja lap.","Vegyél ki két elérhető lapot, amelyek összege 13 (ász=1, bubi=11, dáma=12): A+D, 2+B, 3+10, 4+9, 5+8, 6+7. A király egyedül megy.","Elérhető lapok: a piramis szabad lapjai, a dobópakli teteje és a pakli teteje. A pakliból egyesével húzol a dobópaklira.","A pakli újraosztása: 0, 1 vagy 2 (alapértelmezés szerint 2, mint a „Par Pyramid”-ban)."],"scoring":"Nincs szabványos pontozás: az alkalmazás a kivett lapokat számolja.","impl":"⚠ Vitatott szabályok, kiválasztva és dokumentálva: (1) a pakli teteje elérhető a párokhoz (ahogy a Wikipédia leírja); (2) az újraosztások alapértelmezése 2 (az alapszabály nem ismer ilyet); (3) az alapértelmezett győzelem = a piramis lebontása (opcionális: mind az 52 lap). Egyéni pontozás (kivett lapok)."},"tripeaks":{"name":"TriPeaks","origin":"Tri Peaks néven is írják; Golf-típusú pasziánsz három egymást fedő piramissal, a digitális játékokban nagyon gyakori.","desc":"Bontsd le a három csúcsot úgy, hogy a dobópakliba olyan lapot játszol, amelynek értéke eggyel nagyobb vagy kisebb a felső lapnál.","rules":["28 lap alkot három csúcsot (3, 6, 9 és 10 lapos sorok); a lap akkor játszható, ha szabad. Az alsó sor látható, a többi akkor fordul fel, amikor szabaddá válik.","Egy szabad lapot a dobópakliba lehet játszani, ha az értéke pontosan 1-gyel tér el a dobópakli tetejétől (fölfelé vagy lefelé). Opcionális: az ász és a király szomszédos (alapértelmezés: nem).","Ha nincs lépésed, húzz egy lapot a pakliból a dobópakliba. Nincs újraosztás.","Akkor nyersz, ha mind a 28 lap lekerült."],"scoring":"⚠ Saját megállapodás (nincs egyetlen szabvány): a megszakítatlan lépéssorozat minden lapja 1, 2, 3 … pontot ér; a paklihúzás megszakítja a sorozatot; csúcs lebontása: +15 (az első kettő), +30 (a harmadik).","impl":"⚠ Egyéni pontozás; opcionális A–K szomszédság. A játékszabályok a szokásosak."},"golf":{"name":"Golf","origin":"Gyors pasziánsz; a név a golfszerű pontozásból ered (minél kevesebb lap marad, annál jobb).","desc":"Hét oszlop 5-5 lappal, mind látható. Játszd az oszlop felső lapját a dobópakliba, ha az értéke 1-gyel eltér.","rules":["Hét oszlop 5-5 felfelé fordított lappal; egy lap a dobópakliba kerül; a másik 16 alkotja a paklit.","Csak az oszlop felső lapja játszható, ha az értéke pontosan 1-gyel tér el a dobópakli tetejétől (fölfelé vagy lefelé). Hagyományos szabály: nincs átfordulás a királyról az ászra, és királyra semmi (még dáma sem) játszható – opciók: a dáma engedélyezése, vagy a teljes K↔A átfordulás.","Nincs lépés? Húzz egy lapot a pakliból. Nincs újraosztás.","Akkor nyersz, ha minden oszlop kiürül; különben az számít, hány lap marad."],"scoring":"⚠ Saját pontozás: az oszlopokból lebontott lapok száma (legfeljebb 35). A klasszikus mód a megmaradt lapokat számolja.","impl":"⚠ Egyéni pontozás. A játékszabályok a hagyományosak (egyetlen kör, a király zsákutca, nincs átfordulás), opciókkal."},"scorpion":{"name":"Scorpion","origin":"Pasziánsz, amelyben a sorokat színenként építed, és bármelyik látható lapot mozgathatod a rajta lévőkkel együtt.","desc":"Hét oszlop 7-7 lappal és 3 tartalék lap; a cél: négy teljes király → ász sor, színenként egy.","rules":["Az első négy oszlopban az első 3 lap lefordított, 4 felfordított; az utolsó három teljesen látható. 3 lap marad paklinak.","Csökkenő sorrendben építesz UGYANABBAN a színben. Bármelyik látható lap mozgatható az összes rajta lévővel, ha az első illik a célra. Ászra semmi nem kerülhet.","Az üres oszlopba csak király kerülhet (a csoportjával együtt).","Ha nincs több lépésed, a pakli 3 lapja az első három oszlopra kerül.","Négy K→A sorral nyersz, színenként egyet (ezek az oszlopokban maradnak)."],"scoring":"Nincs hivatalos pontozás; az alkalmazás minden teljes sorért 13 pontot mutat.","impl":"Teljes. A pakli osztása bármikor megengedett (nem csak elakadáskor)."},"canfield":{"name":"Canfield","origin":"Állítólag egy amerikai kaszinóból ered, ahol a játékos megvette a paklit, és az alapkupacokra tett lapokért fizettek neki; „Demon” (a tartalék) néven is ismert.","desc":"13 lapos tartalék, négy oszlop és egy alaplap, amely meghatározza az alapkupacok kezdőértékét.","rules":["Tartalék: 13 lap (csak a legfelső látható). Az első alapkupac-lap határozza meg mind a négy alapkupac alapértékét. Négy egylapos oszlop. A többi a pakli (34).","Oszlopok: csökkenő, váltakozó színek, „sarkon át” (az ász kerülhet 2-esre; a király ászra). Alapkupacok: színenként növekvően az alapértéktől, K→A átfordulással.","Oszlopok közti lépések: egy lap vagy az egész oszlop (szigorú; opcionálisan részsorok is).","Az üres helyeket KÖTELEZŐ a tartalékból feltölteni; ha a tartalék üres, csak a dobópaklából.","Pakli: egyszerre 3 lap (opcionálisan 1); körök: korlátlan / 1 / 3."],"scoring":"A szabványnak nincs pontozása (a kaszinóváltozat lapónként 5 $-t fizetett). Az alkalmazás az alapkupacokon lévő lapokat mutatja.","impl":"⚠ Szabályválasztások: a hézagok más oszlopok lapjaival való feltöltése nem megengedett; nincs alapkupac → oszlop lépés; alapértelmezés szerint szigorú lépés (egy lap vagy az egész oszlop)."},"forty":{"name":"Negyven rabló","origin":"Klasszikus két paklis pasziánsz. Nagyon nehéz: viszonylag kevés leosztást lehet megnyerni.","desc":"Tíz oszlop 4-4 látható lappal, nyolc alapkupac és egy 64 lapos pakli, amelyet csak egyszer lehet végigvenni.","rules":["Két pakli (104 lap): tíz oszlop 4-4 felfelé fordított lappal, 8 alapkupac ásztól a királyig színenként, 64 lap a pakliban.","Oszlopok: csökkenő, UGYANABBAN a színben; csak a felső lap mozog (egyesével).","Az üres oszlopba bármelyik lap kerülhet.","Pakli: egyszerre egy lap a dobópakliba; egyetlen kör. A dobópakli teteje játszható.","Az alapkupacokról nem veszel vissza lapot. Akkor nyersz, ha mind a 104 lap az alapkupacokon van."],"scoring":"Nincs hivatalos pontozás; az alkalmazás az alapkupacokon lévő lapokat mutatja.","impl":"Teljes."},"clock":{"name":"Óra","origin":"Tiszta szerencsejáték, döntések nélkül; gyerekeknek is való.","desc":"Tizenhárom kupac, óralapként elrendezve. Nem hozol döntéseket: fordítod a lapokat, és megnézed, eljutsz-e a végéig (esély ≈ 1/13).","rules":["Az 52 lapot 13 lefordított, 4 lapos kupacba osztják: 12 az óralap körül (ász=1 … dáma=12) és egy középen (a királyok).","Fordítsd fel a középső kupac legfelső lapját, és tedd felfordítva az értékének megfelelő kupac alá (király = közép). Ezután vedd el annak a kupacnak a legfelső lapját, és ismételd.","Akkor nyersz, ha végül minden lap felfordítva fekszik. Veszítesz, ha előbb jön elő a negyedik király (az aktuális kupacban nincs több lefordított lap)."],"scoring":"Nincs pontozás; az alkalmazás a felfordított lapokat számolja. Az elméleti nyerési esély 1/13 ≈ 7,7%.","impl":"Teljes. A lépés kényszerű (egyetlen „A következő lap felfordítása” / „Futtatás a végéig” gomb). A visszavonás működik."},"bakers":{"name":"Pékek tucatja","origin":"Pasziánsz 13 oszloppal, oszloponként 4 lappal („pékek tucatja”); a királyokat az oszlopok aljára teszik.","desc":"Minden lap látható; az építésnél a szín nem számít, de nincsenek cellák, és a kiürült oszlopokat nem lehet újratölteni.","rules":["Tizenhárom oszlop 4-4 lappal. Játék előtt a királyokat az oszlopok aljára teszik (a sorrendjük megmarad).","Az oszlopokat színtől függetlenül csökkenő sorrendben építed; egyszerre egy (a felső) lap mozog.","A kiürült oszlopot soha nem lehet újratölteni.","Négy alapkupac, ász → király színenként. Akkor nyersz, ha minden lap az alapkupacokon van."],"scoring":"Nincs hivatalos pontozás; az alkalmazás az alapkupacokon lévő lapokat mutatja.","impl":"Teljes. Telefonon az asztal (13 oszlop) vízszintesen görgethető ≥ 44 px-es lapokkal (◀ ▶ gombok); a „Teljes asztal ráillesztése” beállítás összezsugorítja a lapokat, hogy elférjenek."},"eightoff":{"name":"Eight Off","origin":"A FreeCell rokona, nyolc cellával és azonos színben történő építéssel.","desc":"Nyolc oszlop 6-6 látható lappal, nyolc cella (négy foglalt az elején) és négy alapkupac.","rules":["Nyolc oszlop 6-6 felfelé fordított lappal; a másik 4 lap a nyolc cella első négyébe kerül.","Az oszlopokat csökkenő sorrendben építed UGYANABBAN a színben; egyszerre csak egy lap mozog (a cellák nem növelik meg egy lépés hosszát).","Az üres oszlopba (alapértelmezés szerint) csak király kerülhet, mint a hagyományos szabályban; opcionálisan bármelyik lap.","Alapkupacok: ász → király színenként. Akkor nyersz, ha minden lap az alapkupacokon van."],"scoring":"Nincs hivatalos pontozás; az alkalmazás az alapkupacokon lévő lapokat mutatja.","impl":"Teljes (király / bármelyik lap az üres oszlopba, választható)."},"spiderette":{"name":"Spiderette","origin":"A Spider egy paklis változata.","desc":"Hét oszlop (1…7 lap, mint a Klondike-ban) és egy pakli, amelyből egyszerre hét lapot osztanak; színtől függetlenül csökkenő sorrendben építesz, de csak azonos színű sorokat mozgatsz.","rules":["Egy 52 lapos pakli, 7 lépcsőzetes oszlop, 24 lap a pakliban.","Cél: négy teljes K→A sor színenként."],"scoring":"","impl":"Csak atlasz – nincs megvalósítva (helyette játszhatsz Spidert)."},"seahaven":{"name":"Seahaven Towers","origin":"A FreeCell rokona; színben építés.","desc":"Tíz oszlop 5-5 lappal, négy cella (kettő foglalt az elején), egyszerre egy lap.","rules":["Azonos színben, csökkenő sorrendben építesz.","Az üres oszlopba csak király kerülhet.","Alapkupacok ász → király színenként."],"scoring":"","impl":"Csak atlasz – nincs megvalósítva (az Eight Off a legközelebbi játék az alkalmazásban)."},"beleaguered":{"name":"Beleaguered Castle","origin":"Pasziánsz, amelyben minden lap látható, és nincsenek cellák.","desc":"Az ászok az alapkupacokon indulnak; nyolc oszlop 6-6 lappal.","rules":["Színtől függetlenül csökkenő sorrendben építesz, egyszerre egy lapot.","Az üres oszlopba bármelyik lap kerülhet.","Alapkupacok ász → király színenként."],"scoring":"","impl":"Csak atlasz – nincs megvalósítva."},"calculation":{"name":"Calculation","origin":"Számtani pasziánsz négy alapkupaccal, amelyek különböző lépésközzel nőnek.","desc":"Az alapkupacok 1-esével (A,2,3…), 2-esével (2,4,6…), 3-asával és 4-esével emelkednek, ciklikusan 13-mal számolva; a pakli lapjai négy várakozó kupacra kerülnek.","rules":["Cél: minden lap az alapkupacokon, mindegyik a királyig.","A pakli minden lapja a négy várakozó kupac bármelyikére kerülhet."],"scoring":"","impl":"Csak atlasz – nincs megvalósítva."},"accordion":{"name":"Harmonika","origin":"Kompakt pasziánsz, amelyet egyetlen kártyasorban raknak ki.","desc":"A lapok egy sorban fekszenek; egy lapot a bal oldali szomszédjára vagy a tőle balra lévő harmadik lapra lehet tenni, ha színük vagy értékük megegyezik.","rules":["Cél: a végén egyetlen kupac."],"scoring":"","impl":"Csak atlasz – nincs megvalósítva."},"acesup":{"name":"Aces Up","origin":"Rövid pasziánsz négy oszloppal.","desc":"Osszunk egy-egy lapot négy oszlopra; vegyél le egy lapot, ha egy másik oszlopon ugyanabból a színből magasabb lap látszik (az ász a legmagasabb).","rules":["Az üres oszlopba egy másik oszlop bármelyik látható lapja kerülhet.","Cél: csak a négy ász marad."],"scoring":"","impl":"Csak atlasz – nincs megvalósítva."},"russian":{"name":"Orosz pasziánsz","origin":"A Yukon egy változata, amelyben azonos színben építesz.","desc":"Mint a Yukon (bármelyik látható lap a rajta lévőkkel együtt mozog), de az oszlopokat azonos színben, csökkenő sorrendben építed.","rules":["Az üres oszlopba csak király kerülhet."],"scoring":"","impl":"Csak atlasz – nincs megvalósítva (a Yukon játszható)."}}};

  var ABOUT = {
    ro: [
      ['Ce este', 'Un atlas de solitaire (pasiență) cu cărți, într-un singur fișier HTML, fără rețea, fără cont și fără telemetrie. Toate jocurile sunt pentru un singur jucător: nu există adversar AI. În locul lui: „Sugestie” (solver), „Rezolvă automat” (opțional) și, pentru FreeCell, „Se poate rezolva?”.'],
      ['Sugestii și solver – limite', 'Solverul este o căutare „best-first” cu euristică, cu limită de noduri și de timp. Folosește și cărțile întoarse (informație completă), deci este un ajutor, nu o simulare corectă. Dacă găsește un plan până la victorie, acesta este verificat prin reluare pe motorul de joc; dacă nu găsește, NU înseamnă că înțelegerea e nerezolvabilă. Pentru FreeCell, rezultatul este tri-stare: rezolvabil (plan verificat) / nerezolvat în limită / nu știu.'],
      ['Numere de înțelegere', 'Fiecare înțelegere are un număr reproductibil (generator PRNG determinist). „Înțelegere nouă” alege numărul cu crypto.getRandomValues (rejection sampling, fără bias). La FreeCell, numerotarea coincide cu înțelegerile Microsoft #1–#32000 (algoritm LCG public); compatibilitatea este doar algoritmică, fără legătură cu Microsoft.'],
      ['Confidențialitate', 'Nicio cerere de rețea, fără cookie-uri. Opțional se salvează în localStorage doar preferințele (limbă, opțiuni) și statisticile locale; dacă stocarea nu e disponibilă, aplicația funcționează la fel.'],
      ['Accesibilitate', 'Tastatură completă (săgeți + Enter/Spațiu), mesaje anunțate prin aria-live, contrast ridicat, ținte tactile mari, opțiune de 4 culori pentru daltonism, respectarea preferinței „mișcare redusă”.'],
      ['Mărci', 'Numele jocurilor sunt generice. „Microsoft”, „Windows” și „FreeCell” aparțin proprietarilor lor; aplicația nu este afiliată și nu folosește materiale ale acestora (cărțile sunt desenate aici).']
    ],
    en: [
      ['What it is', 'An atlas of solitaire (patience) card games in a single HTML file, with no network, no account and no telemetry. Every game is single-player: there is no AI opponent. Instead you get “Hint” (a solver), an optional “Auto-solve” and, for FreeCell, “Can it be solved?”.'],
      ['Hints and solver – limits', 'The solver is a heuristic best-first search with node and time limits. It also sees the face-down cards (perfect information), so it is a helper, not a fair simulation. When it finds a plan to victory the plan is verified by replaying it on the game engine; when it does not, that does NOT mean the deal is unsolvable. For FreeCell the answer is tri-state: solvable (verified plan) / not solved within the limit / unknown.'],
      ['Deal numbers', 'Every deal has a reproducible number (deterministic PRNG). “New deal” picks the number with crypto.getRandomValues (rejection sampling, no bias). For FreeCell the numbering matches the Microsoft deals #1–#32000 (public LCG algorithm); the compatibility is algorithmic only, with no link to Microsoft.'],
      ['Privacy', 'No network requests, no cookies. Optionally only preferences (language, options) and local statistics are saved in localStorage; if storage is unavailable the app works the same.'],
      ['Accessibility', 'Full keyboard play (arrows + Enter/Space), aria-live announcements, high contrast, large touch targets, a 4-colour option for colour blindness, reduced-motion support.'],
      ['Trademarks', 'Game names are generic. “Microsoft”, “Windows” and “FreeCell” belong to their owners; this app is not affiliated and uses none of their material (the cards are drawn here).']
    ],
    fr: [["Qu’est-ce que c’est", "Un atlas de jeux de patience (solitaire) avec cartes, dans un seul fichier HTML, sans réseau, sans compte et sans télémétrie. Tous les jeux se jouent seul : il n’y a pas d’adversaire IA. À la place, vous disposez d’un « Indice » (un solveur), d’une « Résolution auto » facultative et, pour le FreeCell, de « Est-ce résoluble ? »."], ["Indices et solveur – limites", "Le solveur est une recherche heuristique « meilleur d’abord » avec des limites de nœuds et de temps. Il voit aussi les cartes face cachée (information parfaite) : c’est donc une aide, pas une simulation équitable. Lorsqu’il trouve un plan menant à la victoire, ce plan est vérifié en le rejouant sur le moteur de jeu ; lorsqu’il n’en trouve pas, cela ne signifie PAS que la donne est irrésoluble. Pour le FreeCell, la réponse a trois états : résoluble (plan vérifié) / non résolu dans la limite / inconnu."], ["Numéros de donne", "Chaque donne a un numéro reproductible (PRNG déterministe). « Nouvelle donne » choisit le numéro avec crypto.getRandomValues (échantillonnage par rejet, sans biais). Pour le FreeCell, la numérotation correspond aux donnes Microsoft #1–#32000 (algorithme LCG public) ; la compatibilité est purement algorithmique, sans aucun lien avec Microsoft."], ["Confidentialité", "Aucune requête réseau, aucun cookie. Seuls les préférences (langue, options) et les statistiques locales sont éventuellement enregistrés dans localStorage ; si le stockage n’est pas disponible, l’application fonctionne de la même façon."], ["Accessibilité", "Jeu complet au clavier (flèches + Entrée/Espace), annonces par aria-live, contraste élevé, grandes cibles tactiles, option 4 couleurs pour le daltonisme, prise en charge de la préférence « réduire les animations »."], ["Marques", "Les noms des jeux sont génériques. « Microsoft », « Windows » et « FreeCell » appartiennent à leurs propriétaires ; cette application n’est pas affiliée à eux et n’utilise aucun de leurs contenus (les cartes sont dessinées ici)."]],
    it: [["Che cos’è", "Un atlante di solitari (pazienze) con carte, in un unico file HTML, senza rete, senza account e senza telemetria. Ogni gioco è per un solo giocatore: non c’è un avversario IA. Al suo posto hai il «Suggerimento» (un risolutore), un «Risolvi auto» facoltativo e, per il FreeCell, «È risolvibile?»."], ["Suggerimenti e risolutore – limiti", "Il risolutore è una ricerca euristica «best-first» con limiti di nodi e di tempo. Vede anche le carte coperte (informazione perfetta), quindi è un aiuto, non una simulazione equa. Quando trova un piano verso la vittoria, il piano viene verificato rigiocandolo sul motore di gioco; quando non lo trova, NON significa che la mano sia irrisolvibile. Per il FreeCell la risposta ha tre stati: risolvibile (piano verificato) / non risolto entro il limite / sconosciuto."], ["Numeri di mano", "Ogni mano ha un numero riproducibile (PRNG deterministico). «Nuova mano» sceglie il numero con crypto.getRandomValues (campionamento per scarto, senza distorsioni). Per il FreeCell la numerazione coincide con le mani Microsoft #1–#32000 (algoritmo LCG pubblico); la compatibilità è solo algoritmica, senza alcun legame con Microsoft."], ["Privacy", "Nessuna richiesta di rete, nessun cookie. Facoltativamente vengono salvati in localStorage solo le preferenze (lingua, opzioni) e le statistiche locali; se l’archiviazione non è disponibile, l’app funziona allo stesso modo."], ["Accessibilità", "Gioco completo da tastiera (frecce + Invio/Spazio), annunci tramite aria-live, contrasto elevato, ampie aree di tocco, un’opzione a 4 colori per il daltonismo, supporto alla preferenza «riduci movimento»."], ["Marchi", "I nomi dei giochi sono generici. «Microsoft», «Windows» e «FreeCell» appartengono ai rispettivi proprietari; questa app non è affiliata e non usa alcun loro materiale (le carte sono disegnate qui)."]],
    es: [["Qué es", "Un atlas de solitarios (paciencias) de cartas en un único archivo HTML, sin red, sin cuenta y sin telemetría. Todos los juegos son para un solo jugador: no hay adversario de IA. En su lugar tienes la «Pista» (un solucionador), un «Resolver auto» opcional y, para el FreeCell, «¿Tiene solución?»."], ["Pistas y solucionador – límites", "El solucionador es una búsqueda heurística «el mejor primero» con límites de nodos y de tiempo. También ve las cartas boca abajo (información perfecta), así que es una ayuda, no una simulación justa. Cuando encuentra un plan hacia la victoria, el plan se verifica reproduciéndolo en el motor de juego; cuando no lo encuentra, NO significa que el reparto no tenga solución. En el FreeCell la respuesta tiene tres estados: resoluble (plan verificado) / no resuelto dentro del límite / desconocido."], ["Números de reparto", "Cada reparto tiene un número reproducible (PRNG determinista). «Nuevo reparto» elige el número con crypto.getRandomValues (muestreo por rechazo, sin sesgo). En el FreeCell la numeración coincide con los repartos de Microsoft #1–#32000 (algoritmo LCG público); la compatibilidad es solo algorítmica, sin ningún vínculo con Microsoft."], ["Privacidad", "Ninguna petición de red, ninguna cookie. Opcionalmente solo se guardan en localStorage las preferencias (idioma, opciones) y las estadísticas locales; si el almacenamiento no está disponible, la aplicación funciona igual."], ["Accesibilidad", "Juego completo con teclado (flechas + Intro/Espacio), anuncios mediante aria-live, contraste alto, áreas táctiles grandes, una opción de 4 colores para el daltonismo y respeto de la preferencia de «movimiento reducido»."], ["Marcas", "Los nombres de los juegos son genéricos. «Microsoft», «Windows» y «FreeCell» pertenecen a sus propietarios; esta aplicación no está afiliada a ellos y no usa ningún material suyo (las cartas están dibujadas aquí)."]],
    pt: [["O que é", "Um atlas de paciências de cartas num único ficheiro HTML, sem rede, sem conta e sem telemetria. Todos os jogos são para um só jogador: não há adversário de IA. Em vez disso, tem a «Dica» (um solucionador), um «Resolver auto» opcional e, para o FreeCell, «Tem solução?»."], ["Dicas e solucionador – limites", "O solucionador é uma pesquisa heurística «melhor primeiro» com limites de nós e de tempo. Também vê as cartas viradas para baixo (informação perfeita), por isso é uma ajuda, não uma simulação justa. Quando encontra um plano para a vitória, o plano é verificado reproduzindo-o no motor de jogo; quando não encontra, isso NÃO significa que o jogo não tenha solução. No FreeCell a resposta tem três estados: resolúvel (plano verificado) / não resolvido dentro do limite / desconhecido."], ["Números de jogo", "Cada jogo tem um número reproduzível (PRNG determinístico). «Novo jogo» escolhe o número com crypto.getRandomValues (amostragem por rejeição, sem enviesamento). No FreeCell a numeração coincide com os jogos da Microsoft #1–#32000 (algoritmo LCG público); a compatibilidade é apenas algorítmica, sem qualquer ligação à Microsoft."], ["Privacidade", "Nenhum pedido de rede, nenhum cookie. Opcionalmente guardam-se no localStorage apenas as preferências (idioma, opções) e as estatísticas locais; se o armazenamento não estiver disponível, a aplicação funciona da mesma forma."], ["Acessibilidade", "Jogo completo com teclado (setas + Enter/Espaço), anúncios através de aria-live, contraste elevado, áreas de toque grandes, uma opção de 4 cores para o daltonismo e respeito pela preferência de «movimento reduzido»."], ["Marcas", "Os nomes dos jogos são genéricos. «Microsoft», «Windows» e «FreeCell» pertencem aos respetivos proprietários; esta aplicação não é afiliada a eles e não usa nenhum material seu (as cartas são desenhadas aqui)."]],
    de: [["Was es ist", "Ein Atlas von Patience-Kartenspielen in einer einzigen HTML-Datei, ohne Netzwerk, ohne Konto und ohne Telemetrie. Alle Spiele sind für eine Person: Es gibt keinen KI-Gegner. Stattdessen gibt es den „Tipp“ (einen Löser), ein optionales „Automatisch lösen“ und, für FreeCell, „Ist es lösbar?“."], ["Tipps und Löser – Grenzen", "Der Löser ist eine heuristische Best-First-Suche mit Knoten- und Zeitlimit. Er sieht auch die verdeckten Karten (vollständige Information), ist also eine Hilfe und keine faire Simulation. Findet er einen Plan zum Sieg, wird der Plan überprüft, indem er auf der Spiel-Engine abgespielt wird; findet er keinen, heißt das NICHT, dass das Spiel unlösbar ist. Bei FreeCell hat die Antwort drei Zustände: lösbar (geprüfter Plan) / innerhalb des Limits nicht gelöst / unbekannt."], ["Spielnummern", "Jedes Spiel hat eine reproduzierbare Nummer (deterministischer PRNG). „Neues Spiel“ wählt die Nummer mit crypto.getRandomValues (Rejection Sampling, ohne Verzerrung). Bei FreeCell stimmt die Nummerierung mit den Microsoft-Spielen #1–#32000 überein (öffentlicher LCG-Algorithmus); die Kompatibilität ist rein algorithmisch, ohne Verbindung zu Microsoft."], ["Datenschutz", "Keine Netzwerkanfragen, keine Cookies. Optional werden nur die Einstellungen (Sprache, Optionen) und lokale Statistiken im localStorage gespeichert; ist der Speicher nicht verfügbar, funktioniert die App genauso."], ["Barrierefreiheit", "Vollständige Tastaturbedienung (Pfeile + Eingabe/Leertaste), Ansagen über aria-live, hoher Kontrast, große Touch-Ziele, eine 4-Farben-Option bei Farbsehschwäche, Beachtung der Einstellung „reduzierte Bewegung“."], ["Marken", "Die Spielnamen sind generisch. „Microsoft“, „Windows“ und „FreeCell“ gehören ihren Inhabern; diese App ist nicht mit ihnen verbunden und verwendet kein Material von ihnen (die Karten sind hier gezeichnet)."]],
    hu: [["Mi ez", "Kártyás pasziánszok atlasza egyetlen HTML-fájlban, hálózat, fiók és telemetria nélkül. Minden játék egyszemélyes: nincs MI-ellenfél. Helyette kapsz „Tippet” (egy megoldót), egy opcionális „Automatikus megoldást”, a FreeCellhez pedig a „Megoldható?” funkciót."], ["Tippek és megoldó – korlátok", "A megoldó heurisztikus „legjobb először” keresés csomópont- és időkorláttal. A lefordított lapokat is látja (teljes információ), tehát segítség, nem tisztességes szimuláció. Ha győzelemhez vezető tervet talál, a tervet a játékmotoron való lejátszással ellenőrzi; ha nem talál, az NEM jelenti azt, hogy a leosztás megoldhatatlan. A FreeCellnél a válasz háromállapotú: megoldható (ellenőrzött terv) / a korláton belül nem oldotta meg / ismeretlen."], ["Leosztásszámok", "Minden leosztásnak reprodukálható száma van (determinisztikus PRNG). Az „Új leosztás” a számot a crypto.getRandomValues-szal választja (elutasításos mintavétel, torzítás nélkül). A FreeCellnél a számozás megegyezik a Microsoft #1–#32000 leosztásaival (nyilvános LCG-algoritmus); a kompatibilitás csak algoritmikus, a Microsofttal semmi köze."], ["Adatvédelem", "Nincs hálózati kérés, nincsenek sütik. Opcionálisan csak a beállítások (nyelv, opciók) és a helyi statisztikák kerülnek a localStorage-ba; ha a tárhely nem érhető el, az alkalmazás ugyanúgy működik."], ["Hozzáférhetőség", "Teljes billentyűzetes játék (nyilak + Enter/Szóköz), aria-live bejelentések, magas kontraszt, nagy érintési célpontok, 4 színű opció színtévesztőknek, a „csökkentett mozgás” beállítás tiszteletben tartása."], ["Védjegyek", "A játékok nevei általánosak. A „Microsoft”, a „Windows” és a „FreeCell” a tulajdonosaik védjegye; ez az alkalmazás nem áll kapcsolatban velük, és nem használ semmilyen anyagukat (a lapokat itt rajzoltuk)."]]
  };
  function buildAbout() {
    var p = $('paneAbout'); p.textContent = '';
    if (!ABOUT[lang]) p.appendChild(el('p', 'note', t('note_en')));
    (ABOUT[lang] || ABOUT.en).forEach(function (x) { p.appendChild(el('h2', '', x[0])); p.appendChild(el('p', '', x[1])); });
    p.appendChild(el('h2', '', t('lbl_scoring') + ' – Klondike'));
    var a = ATLAS[0]; p.appendChild(el('p', '', langEntry(a).scoring));
  }

  /* ---------- taburi ---------- */
  function showTab(name) {
    ['Atlas', 'Play', 'About'].forEach(function (n) {
      var on = n.toLowerCase() === name;
      $('tab' + n).setAttribute('aria-selected', on ? 'true' : 'false');
      $('pane' + n).hidden = !on;
    });
    if (name === 'play') { render(false); }
  }

  /* ---------- inițializare ---------- */
  function init() {
    lang = detectLang();
    prefs.four = !!prefs.four;
    var ls = $('langSel');
    LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l; o.textContent = LANG_NAMES[l]; ls.appendChild(o); });
    ls.value = lang;
    var gs = $('gameSel');
    SOL.GAMES.forEach(function (g) {
      var a = ATLAS.filter(function (x) { return x.id === g; })[0];
      var o = document.createElement('option'); o.value = g; o.textContent = a ? a.en.name.replace(/ \(.*/, '') : g; gs.appendChild(o);
    });
    $('fourChk').checked = !!prefs.four;
    prefs.fit = !!prefs.fit; $('fitChk').checked = prefs.fit;
    $('safeChk').checked = prefs.safe !== false;
    $('autoFinChk').checked = prefs.autofin !== false;
    $('ctlBox').open = window.innerWidth >= 700 && window.innerHeight >= 900;
    applyI18n(); buildAtlas(); buildAbout();
    ls.addEventListener('change', function () {
      lang = ls.value; prefs.lang = lang; savePrefs(); applyI18n(); updateCtlSummary(); buildAtlas(); buildAbout(); buildOptions(); buildHelp(); render(false); updateStatus();
    });
    $('tabAtlas').addEventListener('click', function () { showTab('atlas'); });
    $('tabPlay').addEventListener('click', function () { showTab('play'); });
    $('tabAbout').addEventListener('click', function () { showTab('about'); });
    $('q').addEventListener('input', buildAtlas);
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
      b.addEventListener('click', function () {
        atlasFilter = b.getAttribute('data-f');
        Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
        buildAtlas();
      });
    });
    gs.addEventListener('change', function () {
      var o = (prefs.opts && prefs.opts[gs.value]) || null; startGame(gs.value, o, randomDeal()); saveGamePrefs();
    });
    $('newBtn').addEventListener('click', function () { newDeal(randomDeal()); });
    $('dailyBtn').addEventListener('click', dailyDeal);
    $('solvChk').checked = !!prefs.solvOnly;
    $('solvChk').addEventListener('change', function () { prefs.solvOnly = $('solvChk').checked; savePrefs(); });
    $('sameBtn').addEventListener('click', function () { startGame(G.game, G.opts, G.seed); });
    $('goBtn').addEventListener('click', goSeed);
    $('seedIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') goSeed(); });
    function goSeed() {
      var raw = $('seedIn').value.trim(), v = /^\d{1,10}$/.test(raw) ? parseInt(raw, 10) : NaN;
      if (!(v >= 1 && v <= 2147483647)) { setMsg(t('bad_seed'), 'bad'); return; }
      startGame(G.game, G.opts, v);
    }
    $('undoBtn').addEventListener('click', undo);
    $('redoBtn').addEventListener('click', redo);
    $('hintBtn').addEventListener('click', doHint);
    $('finBtn').addEventListener('click', function () { if (G.finPlan) runPlan(G.finPlan, 'fin'); });
    $('solveBtn').addEventListener('click', doSolve);
    $('canBtn').addEventListener('click', doCanSolve);
    $('stopBtn').addEventListener('click', doStop);
    $('statsBtn').addEventListener('click', showStats);
    $('statsClose').addEventListener('click', function () { var d = $('statsDlg'); if (d.close) d.close(); else d.removeAttribute('open'); });
    $('statsReset').addEventListener('click', function () { store.del('sol.stats.v1'); showStats(); });
    $('clockBtn').addEventListener('click', function () { var m = SOL.moves(G.ses.st)[0]; if (m) doMove(m); });
    $('clockRunBtn').addEventListener('click', function () {
      var plan = [], cur = G.ses.st, m;
      while ((m = SOL.moves(cur)[0]) && plan.length < 80) { plan.push(m); cur = SOL.apply(cur, m); }
      runPlan(plan, 'clock');
    });
    $('fitChk').addEventListener('change', function () { prefs.fit = $('fitChk').checked; savePrefs(); render(false); });
    $('scrL').addEventListener('click', function () { board.scrollBy ? board.scrollBy({ left: -Math.round(board.clientWidth * 0.8), behavior: prefersReduced() ? 'auto' : 'smooth' }) : (board.scrollLeft -= board.clientWidth * 0.8); });
    $('scrR').addEventListener('click', function () { board.scrollBy ? board.scrollBy({ left: Math.round(board.clientWidth * 0.8), behavior: prefersReduced() ? 'auto' : 'smooth' }) : (board.scrollLeft += board.clientWidth * 0.8); });
    $('fourChk').addEventListener('change', function () { prefs.four = $('fourChk').checked; savePrefs(); render(false); });
    $('safeChk').addEventListener('change', function () { prefs.safe = $('safeChk').checked; savePrefs(); });
    $('autoFinChk').addEventListener('change', function () { prefs.autofin = $('autoFinChk').checked; savePrefs(); maybeAutoFinish(); });
    var rt = 0;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (!$('panePlay').hidden) render(false); }, 120); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { stopTimer(); } else if (G.started && !G.over) startTimer(); });
    var g0 = (prefs.game && SOL.GAMES.indexOf(prefs.game) >= 0) ? prefs.game : 'klondike';
    G.game = g0;
    G.opts = SOL.defaultOpts(g0); // inițial, pentru buildOptions
    startGame(g0, (prefs.opts && prefs.opts[g0]) || null, randomDeal());
    if (window.location.hash === '#play') showTab('play');
    window.__sol = { G: G, SOL: SOL, showTab: showTab, startGame: startGame, onTap: onTap, dailySeed: dailySeed, findSolvable: findSolvable, recStart: recStart, recWin: recWin, loadStats: loadStats, showStats: showStats };
  }
  init();
})();
/*APP-END*/

</script>
</body>
</html>
