  /** Chei cunoscute: fff.<slug>.*, cheile deja indexate în acest browser, cele declarate (fff-info storageKeys/bundleKeys, bundle.allow);

  function unknownKeys(keys) {
    var decl = declaredKeys(), idx = Object.create(null);

      if (k.indexOf(pfx) === 0 || idx[k] === 1) return false;
      if (F.store.appPrefix && k.indexOf(F.store.appPrefix) === 0) return false;   // modulul „store”: <slug>.*

        if (d.charAt(d.length - 1) === '*') return k.indexOf(d.slice(0, -1)) === 0;

    allow: function (list) { [].concat(list || []).forEach(function (x) { if (typeof x === 'string' && x) allowed.push(x); }); },
    build: function () { return plain(false); },

    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

              {label: T('sens_plain'), value: 'plain'},
              {label: T('sens_enc'), value: 'enc', primary: true}

    inspect: function (file, opt) {

          '\n\n' + T('import_keys', {list: keyList(keys)}) +
          (unknown.length ? '\n\n' + T('import_unknown', {n: unknown.length, list: keyList(unknown)}) : '');

          .then(function (ok) {

            try {

    wipe: function (opt) {
      opt = opt || {};
      var keys = F.store.indexKeys();
      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});

        if (!ok) return {keys: 0, cancelled: true};

        try { F.store.raw.remove(F.store.indexKey); } catch (e) { /* ignorat */ }

        F.bus.emit('bundle:wiped', {keys: keys.length});
        if (opt.reload === true) setTimeout(function () { location.reload(); }, opt.delay == null ? 900 : opt.delay);
        return {keys: keys.length, cancelled: false};
      });
    }

<style>
:root{--bg:#120d09;--bg2:#1d1610;--panel:#271c13;--panel2:#31241a;--line:#5a4426;--ink:#f1e6cc;--muted:#c4b393;--gold:#c8832a;--gold2:#e8c87a;--felt:#16271d;--felt2:#0e1a13;
--cardbg:#f6efdc;--cardline:#3b2f1c;--black:#1a1710;--red:#b3261e;--blue:#1c5aa6;--green:#1c7a3d;--sel:#ffd36b;--cur:#8ad1ff;--hintc:#7bf0a0;
--serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a2010 0%,#120d09 60%) fixed;color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.45;min-height:100vh}
a{color:var(--gold2)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:10px 10px 90px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 2px}
h1{font-size:clamp(1.35rem,4.6vw,2.1rem);margin:0;color:var(--gold2);letter-spacing:.01em;line-height:1.1}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.langbox{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
select,input[type=number],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;color:var(--ink)}
:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 12px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:10px 16px;min-height:44px;cursor:pointer;color:var(--muted);font-weight:700}
.tab[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--gold2)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;min-width:44px;cursor:pointer;color:var(--ink);font-weight:600}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1208}
.btn.pri:hover:not(:disabled){background:var(--gold2)}
[hidden]{display:none!important}
/* atlas */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--gold);color:#1a1208;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.gcard h2{margin:0;font-size:1.25rem;color:var(--gold2)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.badge.ok{color:#9fe3b0;border-color:#3d7a52}
.badge.warn{color:#ffd68a;border-color:#8a6420}
.badge.tag{color:var(--muted)}
.gcard p{margin:0;color:var(--ink)}
.gcard details{border-top:1px dashed var(--line);padding-top:8px}
.gcard summary{cursor:pointer;color:var(--gold2);min-height:30px}
.gcard h3{font-size:.95rem;margin:10px 0 2px;color:var(--gold2)}
.gcard ul{margin:4px 0 4px 18px;padding:0}
.gcard li{margin:3px 0}
.note{font-size:.85rem;color:var(--muted);font-style:italic}
.gcard .row{margin-top:auto;display:flex;gap:8px}
/* play */
.controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:8px}
.controls>summary{cursor:pointer;color:var(--gold2);min-height:34px;display:flex;align-items:center}
.controls>summary:after{content:"▾";margin-left:auto;padding-left:10px;font-size:1.1rem;transition:transform .15s}
.controls[open]>summary:after{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.controls>summary:after{transition:none}}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;padding:6px 0 4px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.fld select,.fld input{font-size:1rem}
.fld input[type=number]{width:11ch}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-family:var(--mono);font-size:.95rem;margin:6px 2px}
.status b{color:var(--gold2)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.toggles{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 2px;font-size:.88rem;color:var(--muted)}
.toggles label{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.toggles input{width:20px;height:20px}
#msg{min-height:1.6em;margin:4px 2px;color:var(--ink)}
#msg.good{color:#9fe3b0}
#msg.bad{color:#ffb4a8}
#board{position:relative;background:radial-gradient(900px 500px at 50% 0%,var(--felt) 0%,var(--felt2) 100%);border:1px solid #2b4332;border-radius:14px;overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none;min-height:300px}
#board:focus-visible{outline:3px solid var(--cur);outline-offset:3px}
.slot{position:absolute;border:2px dashed rgba(241,230,204,.28);border-radius:8px;display:flex;align-items:center;justify-content:center;color:rgba(241,230,204,.35)}
.slot svg{width:55%;height:55%;fill:currentColor}
.slot.tgt{border-color:var(--sel);box-shadow:0 0 0 2px rgba(255,211,107,.35)}
.slot.drop{border-color:var(--hintc)}
.slot.cur,.card.cur{outline:3px solid var(--cur);outline-offset:1px;z-index:900}
.slot.hint{border-color:var(--hintc);box-shadow:0 0 0 3px rgba(123,240,160,.5)}
.slot .badge2{position:absolute;bottom:3px;right:4px;font:700 .8rem var(--mono);color:#fff;background:rgba(0,0,0,.55);padding:0 5px;border-radius:6px}
.card{position:absolute;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.6);cursor:default}
.card.up{background:var(--cardbg);border:1px solid var(--cardline)}
.card.down{background:#5b1f24;border:1px solid #2a0c0f;background-image:repeating-linear-gradient(45deg,rgba(232,200,122,.35) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(232,200,122,.35) 0 2px,transparent 2px 9px);background-clip:padding-box}
.card.down::after{content:"";position:absolute;inset:12%;border:1px solid rgba(232,200,122,.55);border-radius:5px}
.card svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.card.mv{touch-action:none;cursor:grab}
.card.sel{outline:3px solid var(--sel);outline-offset:0;box-shadow:0 0 12px 2px rgba(255,211,107,.7);z-index:800}
.card.tgt{outline:3px solid var(--sel);outline-offset:0}
.card.hint{outline:3px solid var(--hintc);outline-offset:0;box-shadow:0 0 12px 3px rgba(123,240,160,.7);animation:pulse 1s ease-in-out infinite}
.card.dragging{opacity:.25}
.card.drop{outline:3px solid var(--hintc)}
.card.stack{box-shadow:0 1px 0 rgba(0,0,0,.7),0 2px 0 #3a2a1c,0 3px 0 rgba(0,0,0,.7)}
@keyframes pulse{50%{box-shadow:0 0 4px 1px rgba(123,240,160,.4)}}
.ghost{position:fixed;z-index:3000;pointer-events:none;left:0;top:0}
.ghost .card{box-shadow:0 8px 18px rgba(0,0,0,.6)}
.su0 .ink,.su0 use,.su0 text{fill:var(--black)}
.su1 use,.su1 text{fill:var(--red)}
.su2 use,.su2 text{fill:var(--red)}
.su3 use,.su3 text{fill:var(--black)}
.four .su2 use,.four .su2 text{fill:var(--blue)}
.four .su3 use,.four .su3 text{fill:var(--green)}
.card text{font-family:var(--serif);font-weight:700}
.clocklbl{position:absolute;font:700 .78rem var(--mono);color:#fff;background:rgba(0,0,0,.6);padding:0 4px;border-radius:5px;pointer-events:none;z-index:950}
.banner{background:linear-gradient(180deg,#2d3a22,#1d2917);border:1px solid #5a8a4a;border-radius:12px;padding:12px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner.lost{background:linear-gradient(180deg,#3a2622,#2a1a17);border-color:#8a4a3a}
.help{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.help summary{cursor:pointer;color:var(--gold2);min-height:34px}
.help ul{margin:4px 0 4px 18px;padding:0}
.kb{font-size:.82rem;color:var(--muted);margin:6px 2px}
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--gold);border-radius:14px;max-width:min(94vw,720px);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.65)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
th{color:var(--gold2)}
.about{max-width:800px}
.about h2{color:var(--gold2);font-size:1.15rem;margin:18px 0 4px}
.about p{margin:4px 0}
footer.f{margin-top:24px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){body{font-size:16px}.wrap{padding:6px 6px 80px}.tab{padding:8px 12px}.controls{padding:8px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card.hint{animation:none}}

#board.hscroll{overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y pinch-zoom;scrollbar-width:thin}
#scrollBar{display:flex;justify-content:space-between;gap:8px;margin:4px 0}

<script>

/* Motor Solitaire: funcții pure (stare -> mutări legale -> stare nouă). Fără DOM. */
var SOL = (function () {
  'use strict';

  /* ---------- cărți: id = copie*52 + culoare*13 + (rang-1); culori 0 ♠, 1 ♥, 2 ♦, 3 ♣ ---------- */
  function RK(id) { return id % 13 + 1; }
  function ST(id) { return ((id / 13) | 0) % 4; }
  function RED(id) { var s = ST(id); return s === 1 || s === 2; }

  /* ---------- PRNG reproductibil (mulberry32) + întreg fără bias (rejection sampling) ---------- */
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  function rngFor(seed, salt) {
    var h = (2166136261 ^ (salt | 0)) >>> 0;
    h = Math.imul(h ^ (seed >>> 0), 16777619) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0;
    return mulberry32((h ^ (h >>> 16)) >>> 0);
  }
  function rngInt(u32, n) { // uniform în [0,n) fără bias modulo
    var lim = Math.floor(4294967296 / n) * n, r;
    do { r = u32(); } while (r >= lim);
    return r % n;
  }
  function shuffle(arr, u32) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = rngInt(u32, i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  /* Înțelegere aleatorie: întreg în [1,n] cu crypto.getRandomValues + rejection sampling. */
  function secureSeed(n) {
    n = n || 1000000;
    var c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
    var u32 = function () {
      if (c) { var b = new Uint32Array(1); c.getRandomValues(b); return b[0]; }
      return (Math.random() * 4294967296) >>> 0; // doar fallback (teste vechi)
    };
    return 1 + rngInt(u32, n);
  }

  function msDeal(seed) {
    var s = seed >>> 0, deck = [], i;

      for (var i = 0; i < d[1]; i++) {
        var idx = L.length, m = { t: d[0], i: i };

      }
    });
    return { L: L, G: G };
  }
  var LAYOUT_CACHE = {};
  function fsuit(m, i) { m.suit = i % 4; }
  function layoutFor(g) {
    if (LAYOUT_CACHE[g]) return LAYOUT_CACHE[g];
    var d;
    switch (g) {

      case 'freecell': d = [['C', 4], ['F', 4, fsuit], ['T', 8]]; break;
      case 'freecell3': d = [['C', 3], ['F', 4, fsuit], ['T', 8]]; break;
      case 'freecell5': d = [['C', 5], ['F', 4, fsuit], ['T', 8]]; break;
      case 'spider': d = [['S', 1], ['F', 8], ['T', 10]]; break;
      case 'yukon': d = [['F', 4, fsuit], ['T', 7]]; break;
      case 'scorpion': d = [['S', 1], ['T', 7]]; break;
      case 'canfield': d = [['R', 1], ['S', 1], ['W', 1], ['F', 4, fsuit], ['T', 4]]; break;
      case 'forty': d = [['S', 1], ['W', 1], ['F', 8, fsuit], ['T', 10]]; break;
      case 'bakers': d = [['F', 4, fsuit], ['T', 13]]; break;
      case 'eightoff': d = [['C', 8], ['F', 4, fsuit], ['T', 8]]; break;
      case 'pyramid':
        d = [['S', 1], ['W', 1], ['D', 1], ['Y', 28, function (m, i) {
          var r = 0; while ((r + 1) * (r + 2) / 2 <= i) r++;
          var j = i - r * (r + 1) / 2; m.row = r; m.col = j; m.px = (6 - r) / 2 + j; m.py = r * 0.4;
        }]]; break;
      case 'tripeaks':
        d = [['S', 1], ['W', 1], ['Y', 28, function (m, i) {
          var r, j;
          if (i < 3) { r = 0; j = i; m.px = 3 * j + 1.5; }
          else if (i < 9) { r = 1; j = i - 3; m.px = 3 * (j >> 1) + 1 + (j & 1); }

    if (g === 'tripeaks') {
      lay.cov = [];
      for (var i = 0; i < 28; i++) {
        var ch;
        if (i < 3) ch = [3 + 2 * i, 4 + 2 * i];
        else if (i < 9) { var j = i - 3, p = j >> 1, jj = j & 1; ch = [9 + 3 * p + jj, 10 + 3 * p + jj]; }

  /* ---------- stare ---------- */
  function newState(g, o, lay, N) {
    var P = [];
    for (var i = 0; i < lay.L.length; i++) P.push({ c: [], f: 0 });
    return { g: g, o: o, L: lay.L, G: lay.G, cov: lay.cov || null, P: P, N: N, score: 0, moves: 0, x: {} };
  }
  function clone(st) {
    var P = new Array(st.P.length);

    var x = {}; for (var k in st.x) x[k] = st.x[k];
    return { g: st.g, o: st.o, L: st.L, G: st.G, cov: st.cov, P: P, N: st.N, score: st.score, moves: st.moves, x: x };
  }
  function hash(st) {
    var s = '';
    for (var i = 0; i < st.P.length; i++) s += st.P[i].f + ':' + st.P[i].c.join(',') + '|';
    return s + '#' + JSON.stringify(st.x) + '#' + st.score + '#' + st.moves;
  }
  function top(p) { return p.c[p.c.length - 1]; }
  function flipTop(p) { if (p.c.length && p.c.length === p.f) { p.f--; return true; } return false; }
  function countF(st) {

    if (st.G.D >= 0) n += st.P[st.G.D].c.length;

  function allCards(st) { // listă sortată a tuturor cărților din stare (pentru invariantul de pachet)
    var a = []; st.P.forEach(function (p) { for (var i = 0; i < p.c.length; i++) a.push(p.c[i]); });
    return a.sort(function (x, y) { return x - y; });

  /* ---------- reguli de construire ---------- */
  var altDown = function (a, b) { return RK(b) === RK(a) - 1 && RED(a) !== RED(b); };
  var altDownW = function (a, b) { return RK(b) === (RK(a) === 1 ? 13 : RK(a) - 1) && RED(a) !== RED(b); };
  var suitDown = function (a, b) { return RK(b) === RK(a) - 1 && ST(a) === ST(b); };
  var anyDown = function (a, b) { return RK(b) === RK(a) - 1; };

  function fAccept(st, fi, c) {
    var p = st.P[fi], m = st.L[fi];
    if (m.suit !== undefined && ST(c) !== m.suit) return false;
    if (!p.c.length) return RK(c) === (st.x.base || 1);
    if (p.c.length >= 13) return false;
    return RK(c) === RK(top(p)) % 13 + 1;

  function fFirst(st, c) {
    var F = st.G.F;

  /* ---------- specificații pe joc ---------- */

  /* generator standard pentru jocuri cu coloane */
  function genStd(st, out) {
    var sp = SPEC[st.g], P = st.P, G = st.G, i, s, d, c, f;
    var Ti = G.T, Ci = G.C, single = [];

    if (G.W >= 0 && P[G.W].c.length) single.push(G.W);
    if (G.R >= 0 && P[G.R].c.length) single.push(G.R);
    for (i = 0; i < Ci.length; i++) if (P[Ci[i]].c.length) single.push(Ci[i]);
    for (i = 0; i < Ti.length; i++) if (P[Ti[i]].c.length) single.push(Ti[i]);
    for (i = 0; i < single.length; i++) {
      s = single[i]; f = fFirst(st, top(P[s]));
      if (f >= 0) out.push({ k: 'm', a: s, n: 1, b: f });
    }
    // prima celulă liberă / prima coloană goală (echivalente)
    var freeCell = -1, freeCount = 0;
    for (i = 0; i < Ci.length; i++) if (!P[Ci[i]].c.length) { if (freeCell < 0) freeCell = Ci[i]; freeCount++; }
    var emptyT = -1, emptyCount = 0;
    for (i = 0; i < Ti.length; i++) if (!P[Ti[i]].c.length) { if (emptyT < 0) emptyT = Ti[i]; emptyCount++; }
    // celule/rezervă/talon -> coloane
    var srcs = [];
    if (G.W >= 0 && P[G.W].c.length) srcs.push(G.W);
    if (G.R >= 0 && P[G.R].c.length) srcs.push(G.R);
    for (i = 0; i < Ci.length; i++) if (P[Ci[i]].c.length) srcs.push(Ci[i]);
    for (i = 0; i < srcs.length; i++) {
      s = srcs[i]; c = top(P[s]);
      for (d = 0; d < Ti.length; d++) {
        var tp = P[Ti[d]];
        if (tp.c.length) { if (sp.fit(top(tp), c)) out.push({ k: 'm', a: s, n: 1, b: Ti[d] }); }
      }
      if (emptyT >= 0 && sp.empty(st, c, s)) out.push({ k: 'm', a: s, n: 1, b: emptyT });
    }
    // coloană -> coloană (secvențe)
    for (s = 0; s < Ti.length; s++) {
      var p = P[Ti[s]], len = p.c.length; if (!len) continue;
      var lo = len - 1;
      if (sp.single) lo = len - 1;
      else if (sp.runReq) { while (lo > p.f && sp.run(p.c[lo - 1], p.c[lo])) lo--; }
      else lo = p.f;
      for (i = len - 1; i >= lo; i--) {

        c = p.c[i];
        for (d = 0; d < Ti.length; d++) {
          if (d === s) continue;
          var q = P[Ti[d]];
          if (q.c.length) {
            if (!sp.fit(top(q), c)) continue;
            if (sp.cap && n > sp.cap(st, false, freeCount, emptyCount)) continue;
            out.push({ k: 'm', a: Ti[s], n: n, b: Ti[d] });
          }
        }
        if (emptyT >= 0 && sp.empty(st, c, Ti[s]) && !(sp.cap && n > sp.cap(st, true, freeCount, emptyCount))) {
          var mv = { k: 'm', a: Ti[s], n: n, b: emptyT };
          if (i === 0) mv.z = 1;
          out.push(mv);
        }
      }
      if (freeCell >= 0 && sp.toCell) out.push({ k: 'm', a: Ti[s], n: 1, b: freeCell });
    }
    // fundație -> coloană
    if (sp.fromF) {
      for (i = 0; i < G.F.length; i++) {
        var fp = P[G.F[i]]; if (!fp.c.length) continue;
        c = top(fp);
        for (d = 0; d < Ti.length; d++) {
          var q2 = P[Ti[d]];
          if (q2.c.length ? sp.fit(top(q2), c) : false) { var m2 = { k: 'm', a: G.F[i], n: 1, b: Ti[d] }; m2.z = 1; out.push(m2); }
        }
        if (emptyT >= 0 && sp.empty(st, c, G.F[i])) { var m3 = { k: 'm', a: G.F[i], n: 1, b: emptyT }; m3.z = 1; out.push(m3); }
      }
    }
  }

  function freeCap(st, destEmpty, freeCount, emptyCount) {

  function dealCols(st, deck, counts, downFn) { // counts[i] cărți pe coloană; downFn(i,count) -> nr. cărți cu fața în jos

    }

  }
  function restToStock(st, deck, k) {
    var S = st.P[st.G.S];
    for (var i = deck.length - 1; i >= k; i--) S.c.push(deck[i]); // vârful = ultimul
    // (ordinea: deck[k] la vârf)
  }

  /* --- Klondike --- */
  function drawKl(n) {
    var S = n.P[n.G.S], W = n.P[n.G.W], k = Math.min(n.o.draw, S.c.length);

    else if (W.c.length && (st.o.passes === 0 || st.x.pass < st.o.passes)) out.push({ k: 'r' });
  }

  SPEC.klondike = {
    T: 7, fit: altDown, run: altDown, runReq: true, empty: isKing, fromF: true,
    deck: function (o) { return seq52(1); },
    deal: function (st, deck) {
      var counts = [1, 2, 3, 4, 5, 6, 7], T = st.G.T, k = 0, r, c;
      for (r = 0; r < 7; r++) for (c = r; c < 7; c++) st.P[T[c]].c.push(deck[k++]);

    settle: function (n) {

      else if (n.o.scoring === 'none') n.score = countF(n);

    won: function (st) { return countF(st) === 52; }
  };

  }

  /* --- FreeCell (și variantele cu 3/5 celule) --- */
  SPEC.freecell = {
    fit: altDown, run: altDown, runReq: true, empty: function () { return true; }, toCell: true,
    cap: freeCap, safeAuto: true,
    deck: function (o, seed) { return msDeal(seed); },
    msDeck: true,
    deal: function (st, deck) {

    gen: function (st, out) { genStd(st, out); },
    exec: function () { },

  /* --- Spider --- */
  SPEC.spider = {
    noF: true,
    fit: anyDown, run: suitDown, runReq: true, empty: function () { return true; },
    deck: function (o) {

      else if (o.suits === 2) { for (k = 0; k < 4; k++) for (s = 0; s < 2; s++) for (r = 0; r < 13; r++) out.push(k * 52 + s * 13 + r); }

  /* --- Eight Off --- */
  SPEC.eightoff = {

var ATLAS_L10N = {"fr":{"klondike":{"name":"Klondike","origin":"Le jeu de patience le plus connu. Le nom renvoie à la ruée vers l’or du Klondike ; les règles modernes se sont largement diffusées grâce à Windows (1990). L’origine exacte est incertaine.","desc":"Sept colonnes avec des cartes face cachée, une pioche dont on tire 1 ou 3 cartes, et quatre fondations. Un mélange de chance (ce qui est caché) et de planification.","rules":["Les colonnes contiennent 1, 2, … 7 cartes ; seule celle du dessus est face visible.","On construit les colonnes en descendant, en alternant les couleurs (rouge sur noir). Toute suite valide de cartes visibles peut être déplacée.","Une colonne vide n’accepte qu’un Roi (avec sa suite).","Les fondations se construisent en montant, par enseigne, de l’As au Roi. On peut reprendre des cartes depuis une fondation.","Pioche : on tire 1 ou 3 cartes vers la défausse ; celle du dessus est jouable. Quand la pioche est épuisée, la défausse est retournée à nouveau (nombre de passages au choix : illimité / 1 / 3).","On gagne quand les 52 cartes sont sur les fondations."],"scoring":"Standard (style Windows) : défausse → colonne +5, défausse → fondation +10, colonne → fondation +10, carte retournée +5, fondation → colonne −15. Recyclage de la défausse : avec tirage de 1, −100 à chaque fois ; avec tirage de 3, −20 à partir du 4e passage (la valeur −20 est confirmée par deux sources secondaires — rarepike.com et solitairecat.com — mais pas par Wikipédia, qui ne donne que −100 pour le tirage de 1 ; les règles originales de Windows n’ont pas été consultées directement). Le score ne descend jamais sous 0 ; pas de bonus de temps. Vegas : −52 au départ, +5 par carte sur une fondation (un montant en « dollars ») ; en général 1 passage avec tirage de 1 et 3 passages avec tirage de 3 (vous réglez vous-même le nombre de passages). L’annulation rétablit aussi exactement le score.","impl":"Complet : tirage 1/3, passages illimités/1/3, score Standard/Vegas/aucun. Pas de bonus de temps. L’indice et « Résolution auto » voient aussi les cartes face cachée."},"freecell":{"name":"FreeCell","origin":"Créé en 1978 sur le système éducatif PLATO et popularisé par Windows dans les années 1990. Les numéros de donne #1–#32000 de cette application correspondent à ceux de la version Microsoft (algorithme LCG documenté publiquement).","desc":"Toutes les cartes sont visibles dès le départ ; quatre cellules libres aident aux manœuvres. Presque toutes les donnes sont résolubles.","rules":["Huit colonnes (4×7 + 4×6 cartes), toutes face visible ; quatre cellules contenant chacune une carte ; quatre fondations.","On construit les colonnes en descendant, en alternant les couleurs. Une colonne vide accepte n’importe quelle carte.","On déplace une carte à la fois – ou une suite, par « supermouvement » : au plus (cellules libres + 1) · 2^(colonnes vides) cartes (la colonne de destination vide n’est pas comptée).","Les fondations montent par enseigne de l’As au Roi. Une carte placée sur une fondation ne peut pas être reprise.","On gagne quand toutes les cartes sont sur les fondations."],"scoring":"Il n’y a pas de score officiel ; l’application affiche le nombre de cartes sur les fondations. Ce qui compte, ce sont les coups et le temps.","impl":"Complet. Le supermouvement est facultatif (sinon, une carte à la fois). Cellules : 3 / 4 / 5. « Est-ce résoluble ? » utilise un solveur à nombre de nœuds limité : résoluble / non résolu dans la limite / inconnu – aucune prétention de certitude. La donne #11982 est connue pour être irrésoluble ; le solveur de l’application épuise son espace d’états sans trouver de solution (voir le README)."},"spider":{"name":"Spider","origin":"Une patience à deux jeux, surtout connue grâce à Windows. Elle se joue avec 1, 2 ou 4 enseignes ; avec une seule enseigne, c’est beaucoup plus facile.","desc":"Dix colonnes, 104 cartes ; le but est de former huit suites complètes Roi → As d’une même enseigne.","rules":["Dix colonnes : quatre de 6 cartes et six de 5 (seule la carte du dessus est face visible) ; la pioche contient 50 cartes (5 distributions de 10).","On construit en descendant quelle que soit l’enseigne, mais seules les suites descendantes de la MÊME enseigne se déplacent en bloc.","Une colonne vide accepte n’importe quelle carte.","Pioche : une carte sur chaque colonne ; on ne peut pas distribuer tant qu’une colonne est vide.","Quand une suite R–A d’une même enseigne se forme, elle est retirée automatiquement. Huit suites donnent la victoire."],"scoring":"Style Windows : 500 points au départ, −1 par coup (et par distribution), +100 pour chaque suite complète retirée. Différence avec Windows : ici l’annulation rétablit exactement le score (dans Windows, elle coûte 1 point).","impl":"Complet : 1, 2 ou 4 enseignes (jeu de 104 cartes avec répétitions : 8×♠ ; 4×♠+4×♥ ; deux jeux complets). La recherche d’indices est limitée à quelques secondes et peut être faible à 2/4 enseignes."},"yukon":{"name":"Yukon","origin":"Un cousin du Klondike sans pioche ; le nom évoque lui aussi la ruée vers l’or (le fleuve Yukon).","desc":"Toutes les cartes sont distribuées dès le départ ; on peut déplacer n’importe quelle carte visible avec tout ce qui se trouve dessus, même si le groupe n’est pas une suite.","rules":["Sept colonnes : 1, 6, 7, 8, 9, 10, 11 cartes ; la première montre une carte, les autres ont 1…6 cartes face cachée et 5 face visible.","On construit en descendant, en alternant les couleurs. Toute carte face visible peut être déplacée avec toutes les cartes qui la recouvrent, pourvu que la première convienne à la destination.","Une colonne vide n’accepte qu’un Roi (avec ses cartes).","Fondations de l’As au Roi par enseigne ; on peut reprendre des cartes depuis une fondation."],"scoring":"Pas de score officiel ; l’application affiche les cartes sur les fondations.","impl":"Complet. Pas de pioche."},"pyramid":{"name":"Pyramide","origin":"Une patience d’élimination de paires connue sous plusieurs noms ; elle se joue avec un seul jeu.","desc":"Retirez des paires de cartes dont le total est 13. Un Roi (13) se retire seul.","rules":["28 cartes forment une pyramide de 7 rangées ; les 24 autres constituent la pioche.","Une carte de la pyramide est disponible quand plus aucune carte ne la recouvre.","Retirez deux cartes disponibles dont le total est 13 (As=1, Valet=11, Dame=12) : A+D, 2+V, 3+10, 4+9, 5+8, 6+7. Un Roi part seul.","Cartes disponibles : les cartes libres de la pyramide, le dessus de la défausse et le dessus de la pioche. On tire les cartes une à une de la pioche vers la défausse.","Redistributions de la pioche : 0, 1 ou 2 (2 par défaut, comme dans « Par Pyramid »)."],"scoring":"Il n’y a pas de score standard : l’application compte les cartes retirées.","impl":"⚠ Règles contestées, choisies et documentées : (1) le dessus de la pioche est disponible pour former des paires (comme le décrit Wikipédia) ; (2) les redistributions valent 2 par défaut (la règle de base n’en a aucune) ; (3) victoire par défaut = pyramide dégagée (en option : les 52 cartes). Score personnalisé (cartes retirées)."},"tripeaks":{"name":"TriPeaks","origin":"Aussi écrit Tri Peaks ; une patience de type Golf avec trois pyramides qui se chevauchent, très courante dans les jeux numériques.","desc":"Dégagez les trois sommets en jouant des cartes sur la défausse lorsque leur rang est supérieur ou inférieur d’un cran à la carte du dessus.","rules":["28 cartes forment trois sommets (rangées de 3, 6, 9 et 10 cartes) ; une carte est jouable quand elle est dégagée. La rangée du bas est visible, les autres se retournent au fur et à mesure qu’elles sont dégagées.","Une carte libre peut être jouée sur la défausse si son rang diffère d’exactement 1 de celui du dessus de la défausse (en montant ou en descendant). En option : l’As et le Roi sont adjacents (par défaut : non).","Si vous n’avez aucun coup, tirez une carte de la pioche vers la défausse. Il n’y a pas de redistribution.","On gagne quand les 28 cartes sont dégagées."],"scoring":"⚠ Convention propre (il n’existe pas de standard unique) : chaque carte d’une série ininterrompue de coups vaut 1, 2, 3 … points ; tirer dans la pioche remet la série à zéro ; dégager un sommet : +15 (les deux premiers), +30 (le troisième).","impl":"⚠ Score personnalisé ; adjacence A–R facultative. Les règles de jeu sont les règles standard."},"golf":{"name":"Golf","origin":"Une patience rapide ; le nom vient du décompte à la façon du golf (moins il reste de cartes, mieux c’est).","desc":"Sept colonnes de 5 cartes, toutes visibles. Jouez la carte du dessus d’une colonne sur la défausse si son rang diffère de 1.","rules":["Sept colonnes de 5 cartes face visible ; une carte va à la défausse ; les 16 autres forment la pioche.","Seule la carte du dessus d’une colonne peut être jouée, si son rang diffère d’exactement 1 de celui du dessus de la défausse (en montant ou en descendant). Règle traditionnelle : pas de passage du Roi à l’As, et rien (pas même une Dame) ne peut être joué sur un Roi – options : autoriser la Dame, ou le passage complet R↔A.","Aucun coup ? Tirez une carte de la pioche. Pas de redistribution.","On gagne si toutes les colonnes sont dégagées ; sinon, ce qui compte est le nombre de cartes restantes."],"scoring":"⚠ Score propre : le nombre de cartes retirées des colonnes (maximum 35). La méthode classique compte les cartes restantes.","impl":"⚠ Score personnalisé. Les règles de jeu sont les règles traditionnelles (un seul passage, Roi comme impasse, pas de passage circulaire), avec des options."},"scorpion":{"name":"Scorpion","origin":"Une patience où les suites se construisent par enseigne et où toute carte visible peut être déplacée avec celles qui la recouvrent.","desc":"Sept colonnes de 7 cartes et 3 cartes de réserve ; le but : quatre suites complètes Roi → As, une par enseigne.","rules":["Les quatre premières colonnes ont leurs 3 premières cartes face cachée et 4 face visible ; les trois dernières sont entièrement visibles. 3 cartes restent comme pioche.","On construit en descendant dans la MÊME enseigne. Toute carte visible peut être déplacée avec tout ce qui la recouvre, si la première convient à la destination. Rien ne se pose sur un As.","Une colonne vide n’accepte qu’un Roi (avec son groupe).","Quand vous n’avez plus de coups, les 3 cartes de la pioche sont placées sur les trois premières colonnes.","On gagne avec quatre suites R→A par enseigne (elles restent dans les colonnes)."],"scoring":"Pas de score officiel ; l’application affiche 13 points par suite complète.","impl":"Complet. La distribution de la pioche est permise à tout moment (pas seulement quand on est bloqué)."},"canfield":{"name":"Canfield","origin":"Il viendrait d’un casino américain où le joueur achetait le jeu et était payé selon le nombre de cartes sur les fondations ; aussi appelé « Demon » (la réserve).","desc":"Une réserve de 13 cartes, quatre colonnes et une carte de base qui fixe le rang de départ des fondations.","rules":["Réserve : 13 cartes (seule celle du dessus est visible). La première carte de fondation fixe le rang de base des quatre fondations. Quatre colonnes d’une carte. Le reste est la pioche (34).","Colonnes : en descendant, couleurs alternées, « en tournant le coin » (un As peut se poser sur un 2 ; un Roi sur un As). Fondations : en montant par enseigne à partir du rang de base, en passant de R à A.","Déplacements entre colonnes : une carte ou toute la colonne (strict ; en option, aussi des suites partielles).","Les emplacements vides DOIVENT être comblés depuis la réserve ; quand la réserve est vide, seulement depuis la défausse.","Pioche : 3 cartes à la fois (en option 1) ; passages illimités / 1 / 3."],"scoring":"Le standard n’a pas de score (la version de casino payait 5 $ par carte). L’application affiche les cartes sur les fondations.","impl":"⚠ Choix de règles : combler les vides avec des cartes d’autres colonnes n’est pas permis ; pas de déplacement fondation → colonne ; déplacement strict (une carte ou la colonne entière) par défaut."},"forty":{"name":"Quarante voleurs","origin":"Une patience classique à deux jeux. Très difficile : relativement peu de donnes sont gagnées.","desc":"Dix colonnes de 4 cartes visibles, huit fondations et une pioche de 64 cartes parcourue une seule fois.","rules":["Deux jeux (104 cartes) : dix colonnes de 4 cartes face visible, 8 fondations de l’As au Roi par enseigne, 64 cartes dans la pioche.","Colonnes : en descendant, dans la MÊME enseigne ; seule la carte du dessus se déplace (une à la fois).","Une colonne vide accepte n’importe quelle carte.","Pioche : une carte à la fois vers la défausse ; un seul passage. Le dessus de la défausse est jouable.","On ne reprend pas de cartes depuis les fondations. On gagne quand les 104 cartes sont sur les fondations."],"scoring":"Pas de score officiel ; l’application affiche les cartes sur les fondations.","impl":"Complet."},"clock":{"name":"Horloge","origin":"Un pur jeu de hasard sans aucune décision ; convient aux enfants.","desc":"Treize piles disposées comme un cadran d’horloge. Vous ne prenez aucune décision : retournez les cartes et voyez si vous arrivez au bout (chance ≈ 1/13).","rules":["Les 52 cartes sont distribuées en 13 piles de 4 cartes face cachée : 12 autour du cadran (As=1 … Dame=12) et une au centre (les Rois).","Retournez la carte du dessus de la pile centrale et placez-la face visible sous la pile correspondant à son rang (Roi = centre). Prenez ensuite la carte du dessus de cette pile et recommencez.","On gagne si toutes les cartes finissent face visible. On perd si le quatrième Roi apparaît en premier (la pile en cours n’a plus de carte face cachée)."],"scoring":"Pas de score ; l’application compte les cartes retournées. La probabilité théorique de victoire est de 1/13 ≈ 7,7 %.","impl":"Complet. Le coup est forcé (un seul bouton « Retourner la carte suivante » / « Jouer jusqu’au bout »). L’annulation fonctionne."},"bakers":{"name":"Douzaine du boulanger","origin":"Une patience à 13 colonnes de 4 cartes (une « douzaine du boulanger ») ; les Rois sont placés au bas de leurs colonnes.","desc":"Toutes les cartes sont visibles ; la construction ignore la couleur, mais il n’y a pas de cellules et les colonnes vidées ne peuvent pas être regarnies.","rules":["Treize colonnes de 4 cartes. Avant de jouer, les Rois sont déplacés au bas de leurs colonnes (en conservant leur ordre).","On construit les colonnes en descendant sans tenir compte de l’enseigne ; une carte (celle du dessus) à la fois.","Une colonne vidée ne peut jamais être regarnie.","Quatre fondations, As → Roi par enseigne. On gagne quand toutes les cartes sont sur les fondations."],"scoring":"Pas de score officiel ; l’application affiche les cartes sur les fondations.","impl":"Complet. Sur téléphone, la table (13 colonnes) défile horizontalement avec des cartes ≥ 44 px (boutons ◀ ▶) ; l’option « Tout afficher » les réduit pour tout faire tenir."},"eightoff":{"name":"Huit hors jeu","origin":"Un cousin du FreeCell, avec huit cellules et une construction dans la même enseigne.","desc":"Huit colonnes de 6 cartes visibles, huit cellules (quatre occupées au départ) et quatre fondations.","rules":["Huit colonnes de 6 cartes face visible ; les 4 autres cartes sont placées dans les quatre premières des huit cellules.","On construit les colonnes en descendant dans la MÊME enseigne ; une seule carte se déplace à la fois (les cellules n’allongent pas la longueur d’un déplacement).","Une colonne vide n’accepte (par défaut) qu’un Roi, comme dans la règle traditionnelle ; en option, n’importe quelle carte.","Fondations : As → Roi par enseigne. On gagne quand toutes les cartes sont sur les fondations."],"scoring":"Pas de score officiel ; l’application affiche les cartes sur les fondations.","impl":"Complet (Roi / n’importe quelle carte dans une colonne vide, au choix)."},"spiderette":{"name":"Spiderette","origin":"La version à un seul jeu du Spider.","desc":"Sept colonnes (1…7 cartes, comme au Klondike) et une pioche distribuée sept cartes à la fois ; on construit en descendant quelle que soit l’enseigne, on ne déplace que des suites de même enseigne.","rules":["Un jeu de 52 cartes, 7 colonnes en escalier, 24 cartes dans la pioche.","But : quatre suites complètes R→A par enseigne."],"scoring":"","impl":"Atlas seulement – non implémenté (vous pouvez jouer au Spider à la place)."},"seahaven":{"name":"Seahaven Towers","origin":"Un cousin du FreeCell ; construction dans l’enseigne.","desc":"Dix colonnes de 5 cartes, quatre cellules (deux occupées au départ), une carte à la fois.","rules":["On construit en descendant dans la même enseigne.","Une colonne vide n’accepte qu’un Roi.","Fondations As → Roi par enseigne."],"scoring":"","impl":"Atlas seulement – non implémenté (Huit hors jeu est le jeu le plus proche dans l’application)."},"beleaguered":{"name":"Beleaguered Castle","origin":"Une patience à cartes toutes visibles, sans cellules.","desc":"Les As démarrent sur les fondations ; huit colonnes de 6 cartes.","rules":["On construit en descendant quelle que soit l’enseigne, une carte à la fois.","Une colonne vide accepte n’importe quelle carte.","Fondations As → Roi par enseigne."],"scoring":"","impl":"Atlas seulement – non implémenté."},"calculation":{"name":"Calculation","origin":"Une patience arithmétique avec quatre fondations qui progressent par pas différents.","desc":"Les fondations montent de 1 (A,2,3…), de 2 (2,4,6…), de 3 et de 4, de façon cyclique modulo 13 ; les cartes de la pioche vont sur quatre piles d’attente.","rules":["But : toutes les cartes sur les fondations, chacune jusqu’au Roi.","Chaque carte de la pioche peut aller sur l’une des quatre piles d’attente."],"scoring":"","impl":"Atlas seulement – non implémenté."},"accordion":{"name":"Accordéon","origin":"Une patience compacte disposée en une seule ligne de cartes.","desc":"Les cartes sont posées en rang ; une carte peut être déplacée sur sa voisine de gauche ou sur la troisième carte à sa gauche si elles ont la même enseigne ou le même rang.","rules":["But : une seule pile à la fin."],"scoring":"","impl":"Atlas seulement – non implémenté."},"acesup":{"name":"Aces Up","origin":"Une patience courte sur quatre colonnes.","desc":"Distribuez une carte sur chacune de quatre colonnes ; retirez une carte si une carte plus haute de la même enseigne est visible sur une autre colonne (l’As est le plus haut).","rules":["Une colonne vide accepte n’importe quelle carte visible d’une autre.","But : il ne reste que les quatre As."],"scoring":"","impl":"Atlas seulement – non implémenté."},"russian":{"name":"Solitaire russe","origin":"Une variante du Yukon où la construction se fait dans la même enseigne.","desc":"Comme le Yukon (toute carte visible se déplace avec celles qui la recouvrent), mais les colonnes se construisent en descendant dans la même enseigne.","rules":["Une colonne vide n’accepte qu’un Roi."],"scoring":"","impl":"Atlas seulement – non implémenté (le Yukon est jouable)."}},"it":{"klondike":{"name":"Klondike","origin":"Il solitario più conosciuto. Il nome rimanda alla corsa all’oro del Klondike; le regole moderne si sono diffuse ampiamente tramite Windows (1990). L’origine esatta è incerta.","desc":"Sette colonne con carte coperte, un mazzo da cui si pescano 1 o 3 carte e quattro pile di fondazione. Un misto di fortuna (ciò che è nascosto) e pianificazione.","rules":["Le colonne contengono 1, 2, … 7 carte; solo quella in cima è scoperta.","Le colonne si costruiscono in ordine decrescente, con colori alternati (rosso su nero). Qualsiasi sequenza valida di carte scoperte può essere spostata.","Una colonna vuota accetta solo un Re (con la sua sequenza).","Le fondazioni si costruiscono in ordine crescente per seme, dall’Asso al Re. Le carte si possono riprendere dalla fondazione.","Mazzo: si pescano 1 o 3 carte negli scarti; quella in cima è giocabile. Quando il mazzo finisce, gli scarti vengono rigirati (numero di passaggi a scelta: illimitato / 1 / 3).","Si vince quando tutte le 52 carte sono sulle fondazioni."],"scoring":"Standard (stile Windows): scarti → colonna +5, scarti → fondazione +10, colonna → fondazione +10, carta girata +5, fondazione → colonna −15. Riciclo degli scarti: con pesca da 1, −100 ogni volta; con pesca da 3, −20 dal 4° passaggio in poi (il valore −20 è confermato da due fonti secondarie — rarepike.com e solitairecat.com — ma non da Wikipedia, che indica solo −100 per la pesca da 1; le regole originali di Windows non sono state consultate direttamente). Il punteggio non scende mai sotto 0; nessun bonus di tempo. Vegas: −52 all’inizio, +5 per ogni carta su una fondazione (un importo in «dollari»); di solito 1 passaggio con pesca da 1 e 3 passaggi con pesca da 3 (il numero di passaggi lo imposti tu). L’annullamento ripristina esattamente anche il punteggio.","impl":"Completo: pesca 1/3, passaggi illimitati/1/3, punteggio Standard/Vegas/nessuno. Nessun bonus di tempo. Il suggerimento e «Risolvi auto» vedono anche le carte coperte."},"freecell":{"name":"FreeCell","origin":"Creato nel 1978 sul sistema didattico PLATO e reso popolare da Windows negli anni ’90. I numeri di mano #1–#32000 di questa app corrispondono a quelli della versione Microsoft (algoritmo LCG documentato pubblicamente).","desc":"Tutte le carte sono visibili fin dall’inizio; quattro celle libere aiutano nelle manovre. Quasi tutte le mani sono risolvibili.","rules":["Otto colonne (4×7 + 4×6 carte), tutte scoperte; quattro celle che contengono una carta ciascuna; quattro fondazioni.","Le colonne si costruiscono in ordine decrescente con colori alternati. Una colonna vuota accetta qualsiasi carta.","Si sposta una carta alla volta – oppure una sequenza, con la «supermossa»: al massimo (celle libere + 1) · 2^(colonne vuote) carte (la colonna di destinazione vuota non conta).","Le fondazioni crescono per seme dall’Asso al Re. Una carta sulla fondazione non può essere ripresa.","Si vince quando tutte le carte sono sulle fondazioni."],"scoring":"Non esiste un punteggio ufficiale; l’app mostra il numero di carte sulle fondazioni. Contano mosse e tempo.","impl":"Completo. La supermossa è facoltativa (altrimenti una carta alla volta). Celle: 3 / 4 / 5. «È risolvibile?» usa un risolutore con limite di nodi: risolvibile / non risolto entro il limite / sconosciuto – nessuna pretesa di certezza. La mano #11982 è nota per essere irrisolvibile; il risolutore dell’app esaurisce il suo spazio degli stati senza trovare una soluzione (vedi il README)."},"spider":{"name":"Spider","origin":"Un solitario a due mazzi, noto soprattutto da Windows. Si gioca con 1, 2 o 4 semi; con un solo seme è molto più facile.","desc":"Dieci colonne, 104 carte; l’obiettivo è formare otto sequenze complete Re → Asso di un unico seme.","rules":["Dieci colonne: quattro da 6 carte e sei da 5 (solo la carta in cima è scoperta); il mazzo contiene 50 carte (5 distribuzioni da 10).","Si costruisce in ordine decrescente indipendentemente dal seme, ma solo le sequenze decrescenti dello STESSO seme si spostano in blocco.","Una colonna vuota accetta qualsiasi carta.","Mazzo: una carta su ogni colonna; non si può distribuire finché una colonna è vuota.","Quando si forma una sequenza R–A di un solo seme, viene rimossa automaticamente. Otto sequenze fanno vincere."],"scoring":"Stile Windows: 500 punti all’inizio, −1 per mossa (e per distribuzione), +100 per ogni sequenza completa rimossa. Differenza rispetto a Windows: qui l’annullamento ripristina esattamente il punteggio (in Windows costa 1 punto).","impl":"Completo: 1, 2 o 4 semi (mazzo da 104 carte con ripetizioni: 8×♠; 4×♠+4×♥; due mazzi completi). La ricerca dei suggerimenti è limitata a pochi secondi e può essere debole con 2/4 semi."},"yukon":{"name":"Yukon","origin":"Un parente del Klondike senza mazzo di riserva; anche il nome evoca la corsa all’oro (il fiume Yukon).","desc":"Tutte le carte sono distribuite all’inizio; si può spostare qualsiasi carta visibile insieme a tutto ciò che sta sopra, anche se il gruppo non è una sequenza.","rules":["Sette colonne: 1, 6, 7, 8, 9, 10, 11 carte; la prima mostra una carta, le altre hanno 1…6 carte coperte e 5 scoperte.","Si costruisce in ordine decrescente con colori alternati. Qualsiasi carta scoperta può essere spostata con tutte le carte che la ricoprono, purché la prima si adatti alla destinazione.","Una colonna vuota accetta solo un Re (con le sue carte).","Fondazioni dall’Asso al Re per seme; le carte si possono riprendere dalla fondazione."],"scoring":"Nessun punteggio ufficiale; l’app mostra le carte sulle fondazioni.","impl":"Completo. Nessun mazzo di riserva."},"pyramid":{"name":"Piramide","origin":"Un solitario di eliminazione di coppie noto con vari nomi; si gioca con un solo mazzo.","desc":"Elimina coppie di carte la cui somma è 13. Un Re (13) si elimina da solo.","rules":["28 carte formano una piramide di 7 file; le altre 24 costituiscono il mazzo.","Una carta della piramide è disponibile quando nessuna carta la ricopre più.","Elimina due carte disponibili la cui somma è 13 (Asso=1, Fante=11, Donna=12): A+D, 2+F, 3+10, 4+9, 5+8, 6+7. Un Re va via da solo.","Carte disponibili: le carte libere della piramide, la cima degli scarti e la cima del mazzo. Si pescano le carte una alla volta dal mazzo agli scarti.","Nuove distribuzioni del mazzo: 0, 1 o 2 (predefinito 2, come in «Par Pyramid»)."],"scoring":"Non esiste un punteggio standard: l’app conta le carte eliminate.","impl":"⚠ Regole controverse, scelte e documentate: (1) la cima del mazzo è disponibile per formare coppie (come descrive Wikipedia); (2) le ridistribuzioni sono 2 per impostazione predefinita (la regola base non ne prevede); (3) vittoria predefinita = piramide svuotata (opzionale: tutte le 52 carte). Punteggio personalizzato (carte eliminate)."},"tripeaks":{"name":"TriPeaks","origin":"Scritto anche Tri Peaks; un solitario di tipo Golf con tre piramidi sovrapposte, molto diffuso nei giochi digitali.","desc":"Libera le tre cime giocando le carte sugli scarti quando il loro valore è di uno superiore o inferiore alla carta in cima.","rules":["28 carte formano tre cime (file da 3, 6, 9 e 10 carte); una carta è giocabile quando è libera. La fila in basso è visibile, le altre si scoprono man mano che vengono liberate.","Una carta libera può essere giocata sugli scarti se il suo valore differisce esattamente di 1 da quello in cima agli scarti (in su o in giù). Opzionale: Asso e Re sono adiacenti (predefinito: no).","Se non hai mosse, pesca una carta dal mazzo agli scarti. Non c’è ridistribuzione.","Si vince quando tutte le 28 carte sono state eliminate."],"scoring":"⚠ Convenzione propria (non esiste un unico standard): ogni carta di una serie ininterrotta di giocate vale 1, 2, 3 … punti; pescare dal mazzo azzera la serie; liberare una cima: +15 (le prime due), +30 (la terza).","impl":"⚠ Punteggio personalizzato; adiacenza A–R opzionale. Le regole di gioco sono quelle standard."},"golf":{"name":"Golf","origin":"Un solitario veloce; il nome deriva dal punteggio in stile golf (meno carte restano, meglio è).","desc":"Sette colonne da 5 carte, tutte visibili. Gioca la carta in cima a una colonna sugli scarti se il suo valore differisce di 1.","rules":["Sette colonne di 5 carte scoperte; una carta va negli scarti; le altre 16 formano il mazzo.","Si può giocare solo la carta in cima a una colonna, se il suo valore differisce esattamente di 1 da quello in cima agli scarti (in su o in giù). Regola tradizionale: nessun passaggio dal Re all’Asso, e nulla (nemmeno una Donna) si può giocare su un Re – opzioni: consentire la Donna, oppure il passaggio completo R↔A.","Nessuna mossa? Pesca una carta dal mazzo. Nessuna ridistribuzione.","Si vince se tutte le colonne vengono svuotate; altrimenti conta quante carte restano."],"scoring":"⚠ Punteggio proprio: il numero di carte eliminate dalle colonne (massimo 35). Il metodo classico conta le carte rimaste.","impl":"⚠ Punteggio personalizzato. Le regole di gioco sono quelle tradizionali (un solo passaggio, Re come vicolo cieco, nessun passaggio circolare), con opzioni."},"scorpion":{"name":"Scorpion","origin":"Un solitario in cui le sequenze si costruiscono per seme e qualsiasi carta visibile si può spostare insieme a quelle che stanno sopra.","desc":"Sette colonne da 7 carte e 3 carte di riserva; l’obiettivo: quattro sequenze complete Re → Asso, una per seme.","rules":["Le prime quattro colonne hanno le prime 3 carte coperte e 4 scoperte; le ultime tre sono completamente visibili. 3 carte restano come mazzo.","Si costruisce in ordine decrescente nello STESSO seme. Qualsiasi carta visibile può essere spostata con tutto ciò che sta sopra, se la prima si adatta alla destinazione. Niente va sopra un Asso.","Una colonna vuota accetta solo un Re (con il suo gruppo).","Quando non hai più mosse, le 3 carte del mazzo vengono messe sulle prime tre colonne.","Si vince con quattro sequenze R→A per seme (restano nelle colonne)."],"scoring":"Nessun punteggio ufficiale; l’app mostra 13 punti per ogni sequenza completa.","impl":"Completo. La distribuzione del mazzo è consentita in qualsiasi momento (non solo quando si è bloccati)."},"canfield":{"name":"Canfield","origin":"Si dice provenga da un casinò americano in cui il giocatore comprava il mazzo e veniva pagato per ogni carta sulle fondazioni; chiamato anche «Demon» (la riserva).","desc":"Una riserva di 13 carte, quattro colonne e una carta base che stabilisce il valore di partenza delle fondazioni.","rules":["Riserva: 13 carte (solo quella in cima è visibile). La prima carta di fondazione stabilisce il valore base per tutte e quattro le fondazioni. Quattro colonne da una carta. Il resto è il mazzo (34).","Colonne: decrescenti, colori alternati, «girando l’angolo» (un Asso può stare su un 2; un Re su un Asso). Fondazioni: in ordine crescente per seme a partire dal valore base, passando da R ad A.","Spostamenti tra colonne: una carta o l’intera colonna (rigoroso; opzionalmente anche sequenze parziali).","I posti vuoti DEVONO essere riempiti dalla riserva; quando la riserva è vuota, solo dagli scarti.","Mazzo: 3 carte alla volta (opzionalmente 1); passaggi illimitati / 1 / 3."],"scoring":"Lo standard non prevede punteggio (la versione da casinò pagava 5 $ per carta). L’app mostra le carte sulle fondazioni.","impl":"⚠ Scelte di regola: riempire i vuoti con carte di altre colonne non è consentito; nessuno spostamento fondazione → colonna; spostamento rigoroso (una carta o l’intera colonna) per impostazione predefinita."},"forty":{"name":"Quaranta ladroni","origin":"Un solitario classico a due mazzi. Molto difficile: relativamente poche mani si vincono.","desc":"Dieci colonne da 4 carte visibili, otto fondazioni e un mazzo di 64 carte che si scorre una sola volta.","rules":["Due mazzi (104 carte): dieci colonne da 4 carte scoperte, 8 fondazioni dall’Asso al Re per seme, 64 carte nel mazzo.","Colonne: decrescenti, nello STESSO seme; si sposta solo la carta in cima (una alla volta).","Una colonna vuota accetta qualsiasi carta.","Mazzo: una carta alla volta negli scarti; un solo passaggio. La cima degli scarti è giocabile.","Le carte non si riprendono dalle fondazioni. Si vince quando tutte le 104 carte sono sulle fondazioni."],"scoring":"Nessun punteggio ufficiale; l’app mostra le carte sulle fondazioni.","impl":"Completo."},"clock":{"name":"Orologio","origin":"Un puro gioco di fortuna senza alcuna decisione; adatto ai bambini.","desc":"Tredici pile disposte come il quadrante di un orologio. Non prendi alcuna decisione: giri le carte e vedi se arrivi in fondo (probabilità ≈ 1/13).","rules":["Le 52 carte sono distribuite in 13 pile coperte da 4: 12 attorno al quadrante (Asso=1 … Donna=12) e una al centro (i Re).","Gira la carta in cima alla pila centrale e mettila scoperta sotto la pila corrispondente al suo valore (Re = centro). Poi prendi la carta in cima a quella pila e ripeti.","Si vince se tutte le carte finiscono scoperte. Si perde se compare prima il quarto Re (la pila corrente non ha più carte coperte)."],"scoring":"Nessun punteggio; l’app conta le carte girate. La probabilità teorica di vittoria è 1/13 ≈ 7,7%.","impl":"Completo. La mossa è obbligata (un solo pulsante «Gira la carta successiva» / «Esegui fino alla fine»). L’annullamento funziona."},"bakers":{"name":"Dozzina del fornaio","origin":"Un solitario con 13 colonne da 4 carte (una «dozzina del fornaio»); i Re vengono spostati in fondo alle loro colonne.","desc":"Tutte le carte sono visibili; la costruzione ignora il colore, ma non ci sono celle e le colonne svuotate non possono essere riempite di nuovo.","rules":["Tredici colonne da 4 carte. Prima di giocare, i Re vengono spostati in fondo alle loro colonne (mantenendo l’ordine).","Si costruiscono le colonne in ordine decrescente indipendentemente dal seme; si sposta una carta (quella in cima) alla volta.","Una colonna svuotata non può mai essere riempita di nuovo.","Quattro fondazioni, Asso → Re per seme. Si vince quando tutte le carte sono sulle fondazioni."],"scoring":"Nessun punteggio ufficiale; l’app mostra le carte sulle fondazioni.","impl":"Completo. Sul telefono il tavolo (13 colonne) scorre in orizzontale con carte ≥ 44 px (pulsanti ◀ ▶); l’opzione «Mostra tutto il tavolo» le rimpicciolisce per farle stare."},"eightoff":{"name":"Eight Off","origin":"Un parente del FreeCell, con otto celle e costruzione nello stesso seme.","desc":"Otto colonne da 6 carte visibili, otto celle (quattro occupate all’inizio) e quattro fondazioni.","rules":["Otto colonne da 6 carte scoperte; le altre 4 carte vengono messe nelle prime quattro delle otto celle.","Si costruiscono le colonne in ordine decrescente nello STESSO seme; si sposta una sola carta alla volta (le celle non allungano la lunghezza di una mossa).","Una colonna vuota accetta (per impostazione predefinita) solo un Re, come nella regola tradizionale; opzionalmente qualsiasi carta.","Fondazioni: Asso → Re per seme. Si vince quando tutte le carte sono sulle fondazioni."],"scoring":"Nessun punteggio ufficiale; l’app mostra le carte sulle fondazioni.","impl":"Completo (Re / qualsiasi carta in una colonna vuota, a scelta)."},"spiderette":{"name":"Spiderette","origin":"La versione a un solo mazzo dello Spider.","desc":"Sette colonne (1…7 carte, come nel Klondike) e un mazzo distribuito sette carte alla volta; si costruisce in ordine decrescente indipendentemente dal seme, si spostano solo sequenze dello stesso seme.","rules":["Un mazzo da 52 carte, 7 colonne a scala, 24 carte nel mazzo.","Obiettivo: quattro sequenze complete R→A per seme."],"scoring":"","impl":"Solo atlante – non implementato (puoi giocare a Spider al suo posto)."},"seahaven":{"name":"Seahaven Towers","origin":"Un parente del FreeCell; costruzione nel seme.","desc":"Dieci colonne da 5 carte, quattro celle (due occupate all’inizio), una carta alla volta.","rules":["Si costruisce in ordine decrescente nello stesso seme.","Una colonna vuota accetta solo un Re.","Fondazioni Asso → Re per seme."],"scoring":"","impl":"Solo atlante – non implementato (Eight Off è il gioco più vicino nell’app)."},"beleaguered":{"name":"Beleaguered Castle","origin":"Un solitario con tutte le carte visibili e senza celle.","desc":"Gli Assi partono sulle fondazioni; otto colonne da 6 carte.","rules":["Si costruisce in ordine decrescente indipendentemente dal seme, una carta alla volta.","Una colonna vuota accetta qualsiasi carta.","Fondazioni Asso → Re per seme."],"scoring":"","impl":"Solo atlante – non implementato."},"calculation":{"name":"Calculation","origin":"Un solitario aritmetico con quattro fondazioni che crescono con passi diversi.","desc":"Le fondazioni salgono di 1 (A,2,3…), di 2 (2,4,6…), di 3 e di 4, ciclicamente modulo 13; le carte del mazzo vanno su quattro pile d’attesa.","rules":["Obiettivo: tutte le carte sulle fondazioni, ciascuna fino al Re.","Ogni carta del mazzo può andare su una qualsiasi delle quattro pile d’attesa."],"scoring":"","impl":"Solo atlante – non implementato."},"accordion":{"name":"Fisarmonica","origin":"Un solitario compatto disposto in un’unica fila di carte.","desc":"Le carte sono disposte in fila; una carta può essere spostata sulla sua vicina di sinistra o sulla terza carta a sinistra se coincidono per seme o per valore.","rules":["Obiettivo: un’unica pila alla fine."],"scoring":"","impl":"Solo atlante – non implementato."},"acesup":{"name":"Aces Up","origin":"Un solitario breve su quattro colonne.","desc":"Distribuisci una carta su ciascuna di quattro colonne; elimina una carta se su un’altra colonna è visibile una carta più alta dello stesso seme (l’Asso è la più alta).","rules":["Una colonna vuota accetta qualsiasi carta visibile da un’altra.","Obiettivo: restano solo i quattro Assi."],"scoring":"","impl":"Solo atlante – non implementato."},"russian":{"name":"Solitario russo","origin":"Una variante dello Yukon in cui si costruisce nello stesso seme.","desc":"Come lo Yukon (qualsiasi carta visibile si sposta con quelle che stanno sopra), ma le colonne si costruiscono in ordine decrescente nello stesso seme.","rules":["Una colonna vuota accetta solo un Re."],"scoring":"","impl":"Solo atlante – non implementato (lo Yukon è giocabile)."}},"es":{"klondike":{"name":"Klondike","origin":"El solitario más conocido. El nombre alude a la fiebre del oro del Klondike; las reglas modernas se difundieron ampliamente a través de Windows (1990). El origen exacto es incierto.","desc":"Siete columnas con cartas boca abajo, un mazo del que se roban 1 o 3 cartas y cuatro fundaciones. Una mezcla de suerte (lo que está oculto) y planificación.","rules":["Las columnas tienen 1, 2, … 7 cartas; solo la de arriba está boca arriba.","Las columnas se construyen en orden descendente, alternando colores (rojo sobre negro). Se puede mover cualquier secuencia válida de cartas visibles.","Una columna vacía solo acepta un Rey (con su secuencia).","Las fundaciones se construyen en orden ascendente por palo, del As al Rey. Se pueden recuperar cartas de una fundación.","Mazo: se roban 1 o 3 cartas al descarte; la de arriba se puede jugar. Cuando el mazo se agota, el descarte se da la vuelta de nuevo (número de pasadas a elegir: ilimitado / 1 / 3).","Se gana cuando las 52 cartas están en las fundaciones."],"scoring":"Estándar (estilo Windows): descarte → columna +5, descarte → fundación +10, columna → fundación +10, carta descubierta +5, fundación → columna −15. Reciclaje del descarte: robando de 1 en 1, −100 cada vez; robando de 3 en 3, −20 a partir de la 4.ª pasada (el valor −20 lo confirman dos fuentes secundarias — rarepike.com y solitairecat.com — pero no Wikipedia, que solo da −100 para robar 1; no se consultaron directamente las reglas originales de Windows). La puntuación nunca baja de 0; sin bonificación de tiempo. Vegas: −52 al inicio, +5 por cada carta en una fundación (una cantidad en «dólares»); normalmente 1 pasada robando 1 y 3 pasadas robando 3 (tú fijas el número de pasadas). Deshacer restablece también la puntuación con exactitud.","impl":"Completo: robar 1/3, pasadas ilimitadas/1/3, puntuación Estándar/Vegas/ninguna. Sin bonificación de tiempo. La pista y «Resolver auto» también ven las cartas boca abajo."},"freecell":{"name":"FreeCell","origin":"Creado en 1978 en el sistema educativo PLATO y popularizado por Windows en los años 90. Los números de reparto #1–#32000 de esta aplicación coinciden con los de la versión de Microsoft (algoritmo LCG documentado públicamente).","desc":"Todas las cartas son visibles desde el principio; cuatro celdas libres ayudan a maniobrar. Casi todos los repartos tienen solución.","rules":["Ocho columnas (4×7 + 4×6 cartas), todas boca arriba; cuatro celdas que guardan una carta cada una; cuatro fundaciones.","Las columnas se construyen en orden descendente alternando colores. Una columna vacía acepta cualquier carta.","Se mueve una carta cada vez – o una secuencia, mediante «supermovimiento»: como máximo (celdas libres + 1) · 2^(columnas vacías) cartas (la columna de destino vacía no se cuenta).","Las fundaciones crecen por palo del As al Rey. Una carta en una fundación no se puede recuperar.","Se gana cuando todas las cartas están en las fundaciones."],"scoring":"No hay puntuación oficial; la aplicación muestra el número de cartas en las fundaciones. Lo que cuenta son los movimientos y el tiempo.","impl":"Completo. El supermovimiento es opcional (si no, una carta cada vez). Celdas: 3 / 4 / 5. «¿Tiene solución?» usa un solucionador con límite de nodos: resoluble / no resuelto dentro del límite / desconocido – sin pretensión de certeza. Se sabe que el reparto #11982 no tiene solución; el solucionador de la aplicación agota su espacio de estados sin hallarla (véase el README)."},"spider":{"name":"Spider","origin":"Un solitario de dos barajas, conocido sobre todo por Windows. Se juega con 1, 2 o 4 palos; con un solo palo es mucho más fácil.","desc":"Diez columnas, 104 cartas; el objetivo es formar ocho secuencias completas Rey → As de un mismo palo.","rules":["Diez columnas: cuatro de 6 cartas y seis de 5 (solo la de arriba está boca arriba); el mazo tiene 50 cartas (5 repartos de 10).","Se construye en orden descendente sin importar el palo, pero solo las secuencias descendentes del MISMO palo se mueven en bloque.","Una columna vacía acepta cualquier carta.","Mazo: una carta sobre cada columna; no se puede repartir mientras haya una columna vacía.","Cuando se forma una secuencia R–A de un solo palo, se retira automáticamente. Ocho secuencias dan la victoria."],"scoring":"Estilo Windows: 500 puntos al inicio, −1 por movimiento (y por reparto), +100 por cada secuencia completa retirada. Diferencia con Windows: aquí Deshacer restablece exactamente la puntuación (en Windows cuesta 1 punto).","impl":"Completo: 1, 2 o 4 palos (baraja de 104 cartas con repeticiones: 8×♠; 4×♠+4×♥; dos barajas completas). La búsqueda de pistas está limitada a unos segundos y puede ser débil con 2/4 palos."},"yukon":{"name":"Yukon","origin":"Un pariente del Klondike sin mazo de reserva; el nombre también evoca la fiebre del oro (el río Yukón).","desc":"Todas las cartas se reparten al principio; se puede mover cualquier carta visible junto con todo lo que tiene encima, aunque el grupo no sea una secuencia.","rules":["Siete columnas: 1, 6, 7, 8, 9, 10, 11 cartas; la primera muestra una carta, las demás tienen 1…6 cartas boca abajo y 5 boca arriba.","Se construye en orden descendente alternando colores. Cualquier carta boca arriba se puede mover con todas las cartas que tiene encima, siempre que la primera encaje en el destino.","Una columna vacía solo acepta un Rey (con sus cartas).","Fundaciones del As al Rey por palo; se pueden recuperar cartas de una fundación."],"scoring":"Sin puntuación oficial; la aplicación muestra las cartas en las fundaciones.","impl":"Completo. Sin mazo de reserva."},"pyramid":{"name":"Pirámide","origin":"Un solitario de eliminación de parejas conocido con varios nombres; se juega con una sola baraja.","desc":"Elimina parejas de cartas que sumen 13. Un Rey (13) se elimina solo.","rules":["28 cartas forman una pirámide de 7 filas; las otras 24 son el mazo.","Una carta de la pirámide está disponible cuando ya no la tapa ninguna carta.","Elimina dos cartas disponibles que sumen 13 (As=1, Jota=11, Reina=12): As+Reina, 2+Jota, 3+10, 4+9, 5+8, 6+7. Un Rey se va solo.","Cartas disponibles: las cartas libres de la pirámide, la de arriba del descarte y la de arriba del mazo. Se roban cartas de una en una del mazo al descarte.","Repartos de nuevo del mazo: 0, 1 o 2 (2 por defecto, como en «Par Pyramid»)."],"scoring":"No hay puntuación estándar: la aplicación cuenta las cartas eliminadas.","impl":"⚠ Reglas discutidas, elegidas y documentadas: (1) la carta de arriba del mazo está disponible para formar parejas (como describe Wikipedia); (2) las repeticiones del mazo son 2 por defecto (la regla básica no tiene ninguna); (3) victoria por defecto = pirámide despejada (opcional: las 52 cartas). Puntuación propia (cartas eliminadas)."},"tripeaks":{"name":"TriPeaks","origin":"También escrito Tri Peaks; un solitario de tipo Golf con tres pirámides superpuestas, muy habitual en los juegos digitales.","desc":"Despeja los tres picos jugando cartas al descarte cuando su valor es uno más o uno menos que la carta de arriba.","rules":["28 cartas forman tres picos (filas de 3, 6, 9 y 10 cartas); una carta se puede jugar cuando está despejada. La fila de abajo es visible; las demás se descubren a medida que se despejan.","Una carta libre se puede jugar al descarte si su valor difiere exactamente en 1 del de arriba del descarte (hacia arriba o hacia abajo). Opcional: As y Rey son adyacentes (por defecto: no).","Si no tienes jugadas, roba una carta del mazo al descarte. No hay nuevo reparto.","Se gana cuando se despejan las 28 cartas."],"scoring":"⚠ Convención propia (no hay un único estándar): cada carta de una racha ininterrumpida de jugadas vale 1, 2, 3 … puntos; robar del mazo reinicia la racha; despejar un pico: +15 (los dos primeros), +30 (el tercero).","impl":"⚠ Puntuación propia; adyacencia A–R opcional. Las reglas de juego son las estándar."},"golf":{"name":"Golf","origin":"Un solitario rápido; el nombre procede de la puntuación al estilo del golf (cuantas menos cartas queden, mejor).","desc":"Siete columnas de 5 cartas, todas visibles. Juega la carta de arriba de una columna al descarte si su valor difiere en 1.","rules":["Siete columnas de 5 cartas boca arriba; una carta va al descarte; las otras 16 forman el mazo.","Solo se puede jugar la carta de arriba de una columna, si su valor difiere exactamente en 1 del de arriba del descarte (hacia arriba o hacia abajo). Regla tradicional: sin paso del Rey al As, y nada (ni siquiera una Reina) se puede jugar sobre un Rey – opciones: permitir la Reina, o el paso completo R↔A.","¿Sin jugadas? Roba una carta del mazo. Sin nuevo reparto.","Se gana si se despejan todas las columnas; si no, lo que cuenta es cuántas cartas quedan."],"scoring":"⚠ Puntuación propia: el número de cartas retiradas de las columnas (máximo 35). La forma clásica cuenta las cartas que sobran.","impl":"⚠ Puntuación propia. Las reglas de juego son las tradicionales (una sola pasada, Rey sin salida, sin paso circular), con opciones."},"scorpion":{"name":"Scorpion","origin":"Un solitario en el que las secuencias se construyen por palo y cualquier carta visible se puede mover junto con las que tiene encima.","desc":"Siete columnas de 7 cartas y 3 cartas de reserva; el objetivo: cuatro secuencias completas Rey → As, una por palo.","rules":["Las cuatro primeras columnas tienen sus 3 primeras cartas boca abajo y 4 boca arriba; las tres últimas son totalmente visibles. Quedan 3 cartas como mazo.","Se construye en orden descendente en el MISMO palo. Cualquier carta visible se puede mover con todo lo que tiene encima, si la primera encaja en el destino. Nada va sobre un As.","Una columna vacía solo acepta un Rey (con su grupo).","Cuando no tienes jugadas, las 3 cartas del mazo se colocan sobre las tres primeras columnas.","Se gana con cuatro secuencias R→A por palo (se quedan en las columnas)."],"scoring":"Sin puntuación oficial; la aplicación muestra 13 puntos por cada secuencia completa.","impl":"Completo. Repartir el mazo se permite en cualquier momento (no solo cuando estás bloqueado)."},"canfield":{"name":"Canfield","origin":"Se dice que procede de un casino estadounidense donde el jugador compraba la baraja y cobraba por cada carta en las fundaciones; también llamado «Demon» (la reserva).","desc":"Una reserva de 13 cartas, cuatro columnas y una carta base que fija el valor de arranque de las fundaciones.","rules":["Reserva: 13 cartas (solo es visible la de arriba). La primera carta de fundación fija el valor base de las cuatro fundaciones. Cuatro columnas de una carta. El resto es el mazo (34).","Columnas: descendentes, colores alternos, «dando la vuelta a la esquina» (un As puede ir sobre un 2; un Rey sobre un As). Fundaciones: en orden ascendente por palo desde el valor base, pasando de R a A.","Movimientos entre columnas: una carta o la columna entera (estricto; opcionalmente también secuencias parciales).","Los huecos vacíos DEBEN llenarse desde la reserva; cuando la reserva está vacía, solo desde el descarte.","Mazo: 3 cartas cada vez (opcionalmente 1); pasadas ilimitadas / 1 / 3."],"scoring":"El estándar no tiene puntuación (la versión de casino pagaba 5 $ por carta). La aplicación muestra las cartas en las fundaciones.","impl":"⚠ Elecciones de regla: no se permite llenar huecos con cartas de otras columnas; no hay movimiento fundación → columna; movimiento estricto (una carta o la columna entera) por defecto."},"forty":{"name":"Los cuarenta ladrones","origin":"Un solitario clásico de dos barajas. Muy difícil: se ganan relativamente pocos repartos.","desc":"Diez columnas de 4 cartas visibles, ocho fundaciones y un mazo de 64 cartas que se recorre una sola vez.","rules":["Dos barajas (104 cartas): diez columnas de 4 cartas boca arriba, 8 fundaciones del As al Rey por palo, 64 cartas en el mazo.","Columnas: descendentes, en el MISMO palo; solo se mueve la carta de arriba (de una en una).","Una columna vacía acepta cualquier carta.","Mazo: una carta cada vez al descarte; una sola pasada. La carta de arriba del descarte se puede jugar.","No se recuperan cartas de las fundaciones. Se gana cuando las 104 cartas están en las fundaciones."],"scoring":"Sin puntuación oficial; la aplicación muestra las cartas en las fundaciones.","impl":"Completo."},"clock":{"name":"Reloj","origin":"Un juego de azar puro, sin ninguna decisión; apto para niños.","desc":"Trece montones dispuestos como la esfera de un reloj. No tomas ninguna decisión: das la vuelta a las cartas y ves si llegas al final (probabilidad ≈ 1/13).","rules":["Las 52 cartas se reparten en 13 montones boca abajo de 4: 12 alrededor de la esfera (As=1 … Reina=12) y uno en el centro (los Reyes).","Da la vuelta a la carta de arriba del montón central y colócala boca arriba debajo del montón que corresponda a su valor (Rey = centro). Luego toma la carta de arriba de ese montón y repite.","Se gana si todas las cartas acaban boca arriba. Se pierde si aparece primero el cuarto Rey (el montón actual ya no tiene cartas boca abajo)."],"scoring":"Sin puntuación; la aplicación cuenta las cartas volteadas. La probabilidad teórica de ganar es 1/13 ≈ 7,7 %.","impl":"Completo. La jugada es forzada (un único botón «Dar la vuelta a la siguiente carta» / «Ejecutar hasta el final»). Deshacer funciona."},"bakers":{"name":"Docena del panadero","origin":"Un solitario con 13 columnas de 4 cartas (una «docena del panadero»); los Reyes se pasan al fondo de sus columnas.","desc":"Todas las cartas son visibles; la construcción ignora el color, pero no hay celdas y las columnas vaciadas no se pueden volver a llenar.","rules":["Trece columnas de 4 cartas. Antes de jugar, los Reyes se pasan al fondo de sus columnas (conservando su orden).","Las columnas se construyen en orden descendente sin importar el palo; se mueve una carta (la de arriba) cada vez.","Una columna vaciada no se puede volver a llenar nunca.","Cuatro fundaciones, As → Rey por palo. Se gana cuando todas las cartas están en las fundaciones."],"scoring":"Sin puntuación oficial; la aplicación muestra las cartas en las fundaciones.","impl":"Completo. En el móvil la mesa (13 columnas) se desplaza horizontalmente con cartas ≥ 44 px (botones ◀ ▶); la opción «Ver toda la mesa» las reduce para que quepan."},"eightoff":{"name":"Eight Off","origin":"Un pariente del FreeCell, con ocho celdas y construcción en el mismo palo.","desc":"Ocho columnas de 6 cartas visibles, ocho celdas (cuatro ocupadas al inicio) y cuatro fundaciones.","rules":["Ocho columnas de 6 cartas boca arriba; las otras 4 cartas se colocan en las cuatro primeras de las ocho celdas.","Las columnas se construyen en orden descendente en el MISMO palo; solo se mueve una carta cada vez (las celdas no alargan la longitud de un movimiento).","Una columna vacía acepta (por defecto) solo un Rey, como en la regla tradicional; opcionalmente cualquier carta.","Fundaciones: As → Rey por palo. Se gana cuando todas las cartas están en las fundaciones."],"scoring":"Sin puntuación oficial; la aplicación muestra las cartas en las fundaciones.","impl":"Completo (Rey / cualquier carta en una columna vacía, a elegir)."},"spiderette":{"name":"Spiderette","origin":"La versión de una sola baraja del Spider.","desc":"Siete columnas (1…7 cartas, como en el Klondike) y un mazo que se reparte de siete en siete; se construye en orden descendente sin importar el palo, solo se mueven secuencias del mismo palo.","rules":["Una baraja de 52 cartas, 7 columnas escalonadas, 24 cartas en el mazo.","Objetivo: cuatro secuencias completas R→A por palo."],"scoring":"","impl":"Solo atlas – no implementado (puedes jugar al Spider en su lugar)."},"seahaven":{"name":"Seahaven Towers","origin":"Un pariente del FreeCell; construcción en el palo.","desc":"Diez columnas de 5 cartas, cuatro celdas (dos ocupadas al inicio), una carta cada vez.","rules":["Se construye en orden descendente en el mismo palo.","Una columna vacía solo acepta un Rey.","Fundaciones As → Rey por palo."],"scoring":"","impl":"Solo atlas – no implementado (Eight Off es el juego más cercano de la aplicación)."},"beleaguered":{"name":"Beleaguered Castle","origin":"Un solitario con todas las cartas visibles y sin celdas.","desc":"Los Ases empiezan en las fundaciones; ocho columnas de 6 cartas.","rules":["Se construye en orden descendente sin importar el palo, una carta cada vez.","Una columna vacía acepta cualquier carta.","Fundaciones As → Rey por palo."],"scoring":"","impl":"Solo atlas – no implementado."},"calculation":{"name":"Calculation","origin":"Un solitario aritmético con cuatro fundaciones que crecen con pasos distintos.","desc":"Las fundaciones suben de 1 en 1 (A,2,3…), de 2 en 2 (2,4,6…), de 3 en 3 y de 4 en 4, de forma cíclica módulo 13; las cartas del mazo van a cuatro montones de espera.","rules":["Objetivo: todas las cartas en las fundaciones, cada una hasta el Rey.","Cada carta del mazo puede ir a cualquiera de los cuatro montones de espera."],"scoring":"","impl":"Solo atlas – no implementado."},"accordion":{"name":"Acordeón","origin":"Un solitario compacto dispuesto en una sola línea de cartas.","desc":"Las cartas se colocan en fila; una carta puede moverse sobre su vecina de la izquierda o sobre la tercera carta a su izquierda si coinciden en palo o en valor.","rules":["Objetivo: un único montón al final."],"scoring":"","impl":"Solo atlas – no implementado."},"acesup":{"name":"Aces Up","origin":"Un solitario corto en cuatro columnas.","desc":"Reparte una carta en cada una de cuatro columnas; retira una carta si en otra columna se ve una carta más alta del mismo palo (el As es el más alto).","rules":["Una columna vacía acepta cualquier carta visible de otra.","Objetivo: solo quedan los cuatro Ases."],"scoring":"","impl":"Solo atlas – no implementado."},"russian":{"name":"Solitario ruso","origin":"Una variante del Yukon en la que se construye en el mismo palo.","desc":"Como el Yukon (cualquier carta visible se mueve con las que tiene encima), pero las columnas se construyen en orden descendente en el mismo palo.","rules":["Una columna vacía solo acepta un Rey."],"scoring":"","impl":"Solo atlas – no implementado (el Yukon se puede jugar)."}},"pt":{"klondike":{"name":"Klondike","origin":"A paciência mais conhecida. O nome refere-se à corrida ao ouro do Klondike; as regras modernas difundiram-se amplamente através do Windows (1990). A origem exata é incerta.","desc":"Sete colunas com cartas viradas para baixo, um baralho do qual se compram 1 ou 3 cartas e quatro fundações. Uma mistura de sorte (o que está escondido) e planeamento.","rules":["As colunas têm 1, 2, … 7 cartas; só a de cima está virada para cima.","As colunas constroem-se em ordem decrescente, alternando as cores (vermelho sobre preto). Qualquer sequência válida de cartas visíveis pode ser movida.","Uma coluna vazia só aceita um Rei (com a sua sequência).","As fundações constroem-se em ordem crescente por naipe, do Ás ao Rei. As cartas podem ser retiradas de uma fundação.","Baralho: compram-se 1 ou 3 cartas para o descarte; a de cima é jogável. Quando o baralho acaba, o descarte é virado de novo (número de passagens à escolha: ilimitado / 1 / 3).","Ganha-se quando as 52 cartas estão nas fundações."],"scoring":"Padrão (estilo Windows): descarte → coluna +5, descarte → fundação +10, coluna → fundação +10, carta virada +5, fundação → coluna −15. Reciclagem do descarte: comprando 1, −100 de cada vez; comprando 3, −20 a partir da 4.ª passagem (o valor −20 é confirmado por duas fontes secundárias — rarepike.com e solitairecat.com — mas não pela Wikipédia, que só indica −100 para comprar 1; as regras originais do Windows não foram consultadas diretamente). A pontuação nunca desce abaixo de 0; sem bónus de tempo. Vegas: −52 no início, +5 por cada carta numa fundação (um valor em «dólares»); normalmente 1 passagem comprando 1 e 3 passagens comprando 3 (o número de passagens é definido por si). Desfazer repõe também exatamente a pontuação.","impl":"Completo: comprar 1/3, passagens ilimitadas/1/3, pontuação Padrão/Vegas/nenhuma. Sem bónus de tempo. A dica e «Resolver auto» também veem as cartas viradas para baixo."},"freecell":{"name":"FreeCell","origin":"Criado em 1978 no sistema educativo PLATO e popularizado pelo Windows nos anos 1990. Os números de jogo #1–#32000 desta aplicação coincidem com os da versão da Microsoft (algoritmo LCG documentado publicamente).","desc":"Todas as cartas são visíveis desde o início; quatro células livres ajudam nas manobras. Quase todos os jogos têm solução.","rules":["Oito colunas (4×7 + 4×6 cartas), todas viradas para cima; quatro células, cada uma com uma carta; quatro fundações.","As colunas constroem-se em ordem decrescente
