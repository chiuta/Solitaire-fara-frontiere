<title>Solitaire fără frontiere</title>
<meta name="description" content="Atlas de solitaire (pasiență) cu cărți: 13 jocuri jucabile de un singur jucător – Klondike, FreeCell, Spider, Yukon, Pyramid, TriPeaks, Golf, Scorpion, Canfield, Forty Thieves, Clock, Baker's Dozen, Eight Off. Offline, fără telemetrie.">
<meta property="og:title" content="Solitaire fără frontiere">
<meta property="og:description" content="13 jocuri de solitaire jucabile, într-un singur fișier HTML, offline.">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-SFOcQB/ZagLKSfek+qPDQaNjyWpJ8buynS65uhluOyE='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<style>
:root{--bg:#120d09;--bg2:#1d1610;--panel:#271c13;--panel2:#31241a;--line:#5a4426;--ink:#f1e6cc;--muted:#c4b393;--gold:#c8832a;--gold2:#e8c87a;--felt:#16271d;--felt2:#0e1a13;
--cardbg:#f6efdc;--cardline:#3b2f1c;--black:#1a1710;--red:#b3261e;--blue:#1c5aa6;--green:#1c7a3d;--sel:#ffd36b;--cur:#8ad1ff;--hintc:#7bf0a0;
--serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a2010 0%,#120d09 60%) fixed;color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.45;min-height:100vh}
a{color:var(--gold2)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:10px 10px 90px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 2px}
h1{font-size:clamp(1.35rem,4.6vw,2.1rem);margin:0;color:var(--gold2);letter-spacing:.01em;line-height:1.1}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.langbox{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
select,input[type=number],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;color:var(--ink)}
:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 12px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:10px 16px;min-height:44px;cursor:pointer;color:var(--muted);font-weight:700}
.tab[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--gold2)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;min-width:44px;cursor:pointer;color:var(--ink);font-weight:600}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1208}
.btn.pri:hover:not(:disabled){background:var(--gold2)}
[hidden]{display:none!important}
/* atlas */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;min-height:44px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--gold);color:#1a1208;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.gcard h2{margin:0;font-size:1.25rem;color:var(--gold2)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.badge.ok{color:#9fe3b0;border-color:#3d7a52}
.badge.warn{color:#ffd68a;border-color:#8a6420}
.badge.tag{color:var(--muted)}
.gcard p{margin:0;color:var(--ink)}
.gcard details{border-top:1px dashed var(--line);padding-top:8px}
.gcard summary{cursor:pointer;color:var(--gold2);min-height:30px}
.gcard h3{font-size:.95rem;margin:10px 0 2px;color:var(--gold2)}
.gcard ul{margin:4px 0 4px 18px;padding:0}
.gcard li{margin:3px 0}
.note{font-size:.85rem;color:var(--muted);font-style:italic}
.gcard .row{margin-top:auto;display:flex;gap:8px}
/* play */
.controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:8px}
.controls>summary{cursor:pointer;color:var(--gold2);min-height:34px;display:flex;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;padding:6px 0 4px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.fld select,.fld input{font-size:1rem}
.fld input[type=number]{width:11ch}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-family:var(--mono);font-size:.95rem;margin:6px 2px}
.status b{color:var(--gold2)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.toggles{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 2px;font-size:.88rem;color:var(--muted)}
.toggles label{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.toggles input{width:20px;height:20px}
#msg{min-height:1.6em;margin:4px 2px;color:var(--ink)}
#msg.good{color:#9fe3b0}
#msg.bad{color:#ffb4a8}
#board{position:relative;background:radial-gradient(900px 500px at 50% 0%,var(--felt) 0%,var(--felt2) 100%);border:1px solid #2b4332;border-radius:14px;overflow:hidden;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none;min-height:300px}
#board:focus-visible{outline:3px solid var(--cur);outline-offset:3px}
.slot{position:absolute;border:2px dashed rgba(241,230,204,.28);border-radius:8px;display:flex;align-items:center;justify-content:center;color:rgba(241,230,204,.35)}
.slot svg{width:55%;height:55%;fill:currentColor}
.slot.tgt{border-color:var(--sel);box-shadow:0 0 0 2px rgba(255,211,107,.35)}
.slot.drop{border-color:var(--hintc)}
.slot.cur,.card.cur{outline:3px solid var(--cur);outline-offset:1px;z-index:900}
.slot.hint{border-color:var(--hintc);box-shadow:0 0 0 3px rgba(123,240,160,.5)}
.slot .badge2{position:absolute;bottom:3px;right:4px;font:700 .8rem var(--mono);color:#fff;background:rgba(0,0,0,.55);padding:0 5px;border-radius:6px}
.card{position:absolute;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.6);cursor:default}
.card.up{background:var(--cardbg);border:1px solid var(--cardline)}
.card.down{background:#5b1f24;border:1px solid #2a0c0f;background-image:repeating-linear-gradient(45deg,rgba(232,200,122,.35) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(232,200,122,.35) 0 2px,transparent 2px 9px);background-clip:padding-box}
.card.down::after{content:"";position:absolute;inset:12%;border:1px solid rgba(232,200,122,.55);border-radius:5px}
.card svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.card.mv{touch-action:none;cursor:grab}
.card.sel{outline:3px solid var(--sel);outline-offset:0;box-shadow:0 0 12px 2px rgba(255,211,107,.7);z-index:800}
.card.tgt{outline:3px solid var(--sel);outline-offset:0}
.card.hint{outline:3px solid var(--hintc);outline-offset:0;box-shadow:0 0 12px 3px rgba(123,240,160,.7);animation:pulse 1s ease-in-out infinite}
.card.dragging{opacity:.25}
.card.drop{outline:3px solid var(--hintc)}
.card.stack{box-shadow:0 1px 0 rgba(0,0,0,.7),0 2px 0 #3a2a1c,0 3px 0 rgba(0,0,0,.7)}
@keyframes pulse{50%{box-shadow:0 0 4px 1px rgba(123,240,160,.4)}}
.ghost{position:fixed;z-index:3000;pointer-events:none;left:0;top:0}
.ghost .card{box-shadow:0 8px 18px rgba(0,0,0,.6)}
.su0 .ink,.su0 use,.su0 text{fill:var(--black)}
.su1 use,.su1 text{fill:var(--red)}
.su2 use,.su2 text{fill:var(--red)}
.su3 use,.su3 text{fill:var(--black)}
.four .su2 use,.four .su2 text{fill:var(--blue)}
.four .su3 use,.four .su3 text{fill:var(--green)}
.card text{font-family:var(--serif);font-weight:700}
.clocklbl{position:absolute;font:700 .78rem var(--mono);color:#fff;background:rgba(0,0,0,.6);padding:0 4px;border-radius:5px;pointer-events:none;z-index:950}
.banner{background:linear-gradient(180deg,#2d3a22,#1d2917);border:1px solid #5a8a4a;border-radius:12px;padding:12px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner.lost{background:linear-gradient(180deg,#3a2622,#2a1a17);border-color:#8a4a3a}
.help{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.help summary{cursor:pointer;color:var(--gold2);min-height:34px}
.help ul{margin:4px 0 4px 18px;padding:0}
.kb{font-size:.82rem;color:var(--muted);margin:6px 2px}
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--gold);border-radius:14px;max-width:min(94vw,720px);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.65)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
th{color:var(--gold2)}
.about{max-width:800px}
.about h2{color:var(--gold2);font-size:1.15rem;margin:18px 0 4px}
.about p{margin:4px 0}
footer.f{margin-top:24px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){body{font-size:16px}.wrap{padding:6px 6px 80px}.tab{padding:8px 12px}.controls{padding:8px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card.hint{animation:none}}

#board.hscroll{overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y pinch-zoom;scrollbar-width:thin}
#scrollBar{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
#scrollBar[hidden]{display:none}

</style>
</head>

<div class="wrap">

  <section id="panePlay" role="tabpanel" aria-labelledby="tabPlay" hidden>

    <div class="status" aria-label="status">

<script>
/*ENGINE-BEGIN*/
/* Motor Solitaire: funcții pure (stare -> mutări legale -> stare nouă). Fără DOM. */
var SOL = (function () {
  'use strict';

  /* ---------- cărți: id = copie*52 + culoare*13 + (rang-1); culori 0 ♠, 1 ♥, 2 ♦, 3 ♣ ---------- */
  function RK(id) { return id % 13 + 1; }
  function ST(id) { return ((id / 13) | 0) % 4; }
  function RED(id) { var s = ST(id); return s === 1 || s === 2; }

  /* ---------- PRNG reproductibil (mulberry32) + întreg fără bias (rejection sampling) ---------- */
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  function rngFor(seed, salt) {
    var h = (2166136261 ^ (salt | 0)) >>> 0;
    h = Math.imul(h ^ (seed >>> 0), 16777619) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0;
    return mulberry32((h ^ (h >>> 16)) >>> 0);
  }
  function rngInt(u32, n) { // uniform în [0,n) fără bias modulo
    var lim = Math.floor(4294967296 / n) * n, r;
    do { r = u32(); } while (r >= lim);
    return r % n;
  }
  function shuffle(arr, u32) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = rngInt(u32, i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  /* Înțelegere aleatorie: întreg în [1,n] cu crypto.getRandomValues + rejection sampling. */
  function secureSeed(n) {
    n = n || 1000000;
    var c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
    var u32 = function () {
      if (c) { var b = new Uint32Array(1); c.getRandomValues(b); return b[0]; }
      return (Math.random() * 4294967296) >>> 0; // doar fallback (teste vechi)
    };
    return 1 + rngInt(u32, n);
  }

  /* ---------- generator Microsoft FreeCell (LCG), compatibil #1..#32000(+extins) ---------- */
  function msDeal(seed) {
    var s = seed >>> 0, deck = [], i;
    for (i = 0; i < 52; i++) deck.push(i);
    var out = [];
    for (i = 0; i < 52; i++) {
      s = (Math.imul(s, 214013) + 2531011) >>> 0; s = s & 0x7fffffff;
      var r = s >>> 16, j = r % (52 - i);
      out.push(deck[j]); deck[j] = deck[51 - i];
    }
    // MS: rang = v>>2 (0=A), culoare = v&3 (0 C,1 D,2 H,3 S) -> propriile culori (♠0 ♥1 ♦2 ♣3)
    var map = [3, 2, 1, 0];
    return out.map(function (v) { return map[v & 3] * 13 + (v >> 2); });
  }

  /* ---------- layout ---------- */
  function mkLayout(defs) {
    var L = [], G = { S: -1, W: -1, R: -1, D: -1, F: [], T: [], C: [], Y: [], K: [] };
    defs.forEach(function (d) {
      for (var i = 0; i < d[1]; i++) {
        var idx = L.length, m = { t: d[0], i: i };
        if (d[2]) d[2](m, i);
        L.push(m);
        if (d[0] === 'S' || d[0] === 'W' || d[0] === 'R' || d[0] === 'D') G[d[0]] = idx; else G[d[0]].push(idx);
      }
    });
    return { L: L, G: G };
  }
  var LAYOUT_CACHE = {};
  function fsuit(m, i) { m.suit = i % 4; }
  function layoutFor(g) {
    if (LAYOUT_CACHE[g]) return LAYOUT_CACHE[g];
    var d;
    switch (g) {
      case 'klondike': d = [['S', 1], ['W', 1], ['F', 4, fsuit], ['T', 7]]; break;
      case 'freecell': d = [['C', 4], ['F', 4, fsuit], ['T', 8]]; break;
      case 'freecell3': d = [['C', 3], ['F', 4, fsuit], ['T', 8]]; break;
      case 'freecell5': d = [['C', 5], ['F', 4, fsuit], ['T', 8]]; break;
      case 'spider': d = [['S', 1], ['F', 8], ['T', 10]]; break;
      case 'yukon': d = [['F', 4, fsuit], ['T', 7]]; break;
      case 'scorpion': d = [['S', 1], ['T', 7]]; break;
      case 'canfield': d = [['R', 1], ['S', 1], ['W', 1], ['F', 4, fsuit], ['T', 4]]; break;
      case 'forty': d = [['S', 1], ['W', 1], ['F', 8, fsuit], ['T', 10]]; break;
      case 'bakers': d = [['F', 4, fsuit], ['T', 13]]; break;
      case 'eightoff': d = [['C', 8], ['F', 4, fsuit], ['T', 8]]; break;
      case 'pyramid':
        d = [['S', 1], ['W', 1], ['D', 1], ['Y', 28, function (m, i) {
          var r = 0; while ((r + 1) * (r + 2) / 2 <= i) r++;
          var j = i - r * (r + 1) / 2; m.row = r; m.col = j; m.px = (6 - r) / 2 + j; m.py = r * 0.4;
        }]]; break;
      case 'tripeaks':
        d = [['S', 1], ['W', 1], ['Y', 28, function (m, i) {
          var r, j;
          if (i < 3) { r = 0; j = i; m.px = 3 * j + 1.5; }
          else if (i < 9) { r = 1; j = i - 3; m.px = 3 * (j >> 1) + 1 + (j & 1); }
          else if (i < 18) { r = 2; j = i - 9; m.px = j + 0.5; }
          else { r = 3; j = i - 18; m.px = j; }
          m.row = r; m.col = j; m.py = r * 0.5;
        }]]; break;
      case 'golf': d = [['S', 1], ['W', 1], ['T', 7]]; break;
      case 'clock': d = [['K', 13]]; break;
      default: throw new Error('joc necunoscut ' + g);
    }
    var lay = mkLayout(d);
    // acoperire TriPeaks (copii care trebuie scoși)
    if (g === 'tripeaks') {
      lay.cov = [];
      for (var i = 0; i < 28; i++) {
        var ch;
        if (i < 3) ch = [3 + 2 * i, 4 + 2 * i];
        else if (i < 9) { var j = i - 3, p = j >> 1, jj = j & 1; ch = [9 + 3 * p + jj, 10 + 3 * p + jj]; }
        else if (i < 18) { var k = i - 9; ch = [18 + k, 19 + k]; }
        else ch = [];
        lay.cov.push(ch);
      }
    }
    if (g === 'pyramid') {
      lay.cov = [];
      for (var q = 0; q < 28; q++) {
        var r = lay.L[lay.G.Y[q]].row, c = lay.L[lay.G.Y[q]].col;
        lay.cov.push(r === 6 ? [] : [(r + 1) * (r + 2) / 2 + c, (r + 1) * (r + 2) / 2 + c + 1]);
      }
    }
    LAYOUT_CACHE[g] = lay;
    return lay;
  }

  /* ---------- stare ---------- */
  function newState(g, o, lay, N) {
    var P = [];
    for (var i = 0; i < lay.L.length; i++) P.push({ c: [], f: 0 });
    return { g: g, o: o, L: lay.L, G: lay.G, cov: lay.cov || null, P: P, N: N, score: 0, moves: 0, x: {} };
  }
  function clone(st) {
    var P = new Array(st.P.length);
    for (var i = 0; i < P.length; i++) P[i] = { c: st.P[i].c.slice(), f: st.P[i].f };
    var x = {}; for (var k in st.x) x[k] = st.x[k];
    return { g: st.g, o: st.o, L: st.L, G: st.G, cov: st.cov, P: P, N: st.N, score: st.score, moves: st.moves, x: x };
  }
  function hash(st) {
    var s = '';
    for (var i = 0; i < st.P.length; i++) s += st.P[i].f + ':' + st.P[i].c.join(',') + '|';
    return s + '#' + JSON.stringify(st.x) + '#' + st.score + '#' + st.moves;
  }
  function top(p) { return p.c[p.c.length - 1]; }
  function flipTop(p) { if (p.c.length && p.c.length === p.f) { p.f--; return true; } return false; }
  function countF(st) {
    var n = 0, F = st.G.F; for (var i = 0; i < F.length; i++) n += st.P[F[i]].c.length;
    if (st.G.D >= 0) n += st.P[st.G.D].c.length;
    return n;
  }
  function allCards(st) { // listă sortată a tuturor cărților din stare (pentru invariantul de pachet)
    var a = []; st.P.forEach(function (p) { for (var i = 0; i < p.c.length; i++) a.push(p.c[i]); });
    return a.sort(function (x, y) { return x - y; });
  }

  /* ---------- reguli de construire ---------- */
  var altDown = function (a, b) { return RK(b) === RK(a) - 1 && RED(a) !== RED(b); };
  var altDownW = function (a, b) { return RK(b) === (RK(a) === 1 ? 13 : RK(a) - 1) && RED(a) !== RED(b); };
  var suitDown = function (a, b) { return RK(b) === RK(a) - 1 && ST(a) === ST(b); };
  var anyDown = function (a, b) { return RK(b) === RK(a) - 1; };
  var isKing = function (st, c) { return RK(c) === 13; };

  function fAccept(st, fi, c) {
    var p = st.P[fi], m = st.L[fi];
    if (m.suit !== undefined && ST(c) !== m.suit) return false;
    if (!p.c.length) return RK(c) === (st.x.base || 1);
    if (p.c.length >= 13) return false;
    return RK(c) === RK(top(p)) % 13 + 1;
  }
  function fFirst(st, c) {
    var F = st.G.F;
    if (SPEC[st.g].noF) return -1;
    for (var i = 0; i < F.length; i++) if (fAccept(st, F[i], c)) return F[i];
    return -1;
  }

  /* ---------- specificații pe joc ---------- */
  var SPEC = {};

  /* generator standard pentru jocuri cu coloane */
  function genStd(st, out) {
    var sp = SPEC[st.g], P = st.P, G = st.G, i, s, d, c, f;
    var Ti = G.T, Ci = G.C, single = [];
    // sursele cu o singură carte spre fundație
    if (G.W >= 0 && P[G.W].c.length) single.push(G.W);
    if (G.R >= 0 && P[G.R].c.length) single.push(G.R);
    for (i = 0; i < Ci.length; i++) if (P[Ci[i]].c.length) single.push(Ci[i]);
    for (i = 0; i < Ti.length; i++) if (P[Ti[i]].c.length) single.push(Ti[i]);
    for (i = 0; i < single.length; i++) {
      s = single[i]; f = fFirst(st, top(P[s]));
      if (f >= 0) out.push({ k: 'm', a: s, n: 1, b: f });
    }
    // prima celulă liberă / prima coloană goală (echivalente)
    var freeCell = -1, freeCount = 0;
    for (i = 0; i < Ci.length; i++) if (!P[Ci[i]].c.length) { if (freeCell < 0) freeCell = Ci[i]; freeCount++; }
    var emptyT = -1, emptyCount = 0;
    for (i = 0; i < Ti.length; i++) if (!P[Ti[i]].c.length) { if (emptyT < 0) emptyT = Ti[i]; emptyCount++; }
    // celule/rezervă/talon -> coloane
    var srcs = [];
    if (G.W >= 0 && P[G.W].c.length) srcs.push(G.W);
    if (G.R >= 0 && P[G.R].c.length) srcs.push(G.R);
    for (i = 0; i < Ci.length; i++) if (P[Ci[i]].c.length) srcs.push(Ci[i]);
    for (i = 0; i < srcs.length; i++) {
      s = srcs[i]; c = top(P[s]);
      for (d = 0; d < Ti.length; d++) {
        var tp = P[Ti[d]];
        if (tp.c.length) { if (sp.fit(top(tp), c)) out.push({ k: 'm', a: s, n: 1, b: Ti[d] }); }
      }
      if (emptyT >= 0 && sp.empty(st, c, s)) out.push({ k: 'm', a: s, n: 1, b: emptyT });
    }
    // coloană -> coloană (secvențe)
    for (s = 0; s < Ti.length; s++) {
      var p = P[Ti[s]], len = p.c.length; if (!len) continue;
      var lo = len - 1;
      if (sp.single) lo = len - 1;
      else if (sp.runReq) { while (lo > p.f && sp.run(p.c[lo - 1], p.c[lo])) lo--; }
      else lo = p.f;
      for (i = len - 1; i >= lo; i--) {
        var n = len - i;
        if (sp.whole && st.o.whole && n !== 1 && i !== 0) continue; // Canfield strict: o carte sau coloana întreagă
        c = p.c[i];
        for (d = 0; d < Ti.length; d++) {
          if (d === s) continue;
          var q = P[Ti[d]];
          if (q.c.length) {
            if (!sp.fit(top(q), c)) continue;
            if (sp.cap && n > sp.cap(st, false, freeCount, emptyCount)) continue;
            out.push({ k: 'm', a: Ti[s], n: n, b: Ti[d] });
          }
        }
        if (emptyT >= 0 && sp.empty(st, c, Ti[s]) && !(sp.cap && n > sp.cap(st, true, freeCount, emptyCount))) {
          var mv = { k: 'm', a: Ti[s], n: n, b: emptyT };
          if (i === 0) mv.z = 1;
          out.push(mv);
        }
      }
      if (freeCell >= 0 && sp.toCell) out.push({ k: 'm', a: Ti[s], n: 1, b: freeCell });
    }
    // fundație -> coloană
    if (sp.fromF) {
      for (i = 0; i < G.F.length; i++) {
        var fp = P[G.F[i]]; if (!fp.c.length) continue;
        c = top(fp);
        for (d = 0; d < Ti.length; d++) {
          var q2 = P[Ti[d]];
          if (q2.c.length ? sp.fit(top(q2), c) : false) { var m2 = { k: 'm', a: G.F[i], n: 1, b: Ti[d] }; m2.z = 1; out.push(m2); }
        }
        if (emptyT >= 0 && sp.empty(st, c, G.F[i])) { var m3 = { k: 'm', a: G.F[i], n: 1, b: emptyT }; m3.z = 1; out.push(m3); }
      }
    }
  }

  function freeCap(st, destEmpty, freeCount, emptyCount) {
    if (!st.o.sup) return 1;
    var e = emptyCount - (destEmpty ? 1 : 0);
    return (freeCount + 1) * Math.pow(2, e);
  }

  function dealCols(st, deck, counts, downFn) { // counts[i] cărți pe coloană; downFn(i,count) -> nr. cărți cu fața în jos
    var T = st.G.T, k = 0, i, j;
    for (i = 0; i < T.length; i++) {
      for (j = 0; j < counts[i]; j++) st.P[T[i]].c.push(deck[k++]);
      st.P[T[i]].f = downFn ? downFn(i, counts[i]) : 0;
    }
    return k;
  }
  function restToStock(st, deck, k) {
    var S = st.P[st.G.S];
    for (var i = deck.length - 1; i >= k; i--) S.c.push(deck[i]); // vârful = ultimul
    // (ordinea: deck[k] la vârf)
  }

  /* --- Klondike --- */
  function drawKl(n) {
    var S = n.P[n.G.S], W = n.P[n.G.W], k = Math.min(n.o.draw, S.c.length);
    for (var i = 0; i < k; i++) W.c.push(S.c.pop());
  }
  function recycleKl(n) {
    var S = n.P[n.G.S], W = n.P[n.G.W];
    S.c = W.c.slice().reverse(); W.c = [];
    n.x.pass++;
  }
  function genStock(st, out) { // 'd' / 'r' pentru Klondike/Canfield
    var S = st.P[st.G.S], W = st.P[st.G.W];
    if (S.c.length) out.push({ k: 'd' });
    else if (W.c.length && (st.o.passes === 0 || st.x.pass < st.o.passes)) out.push({ k: 'r' });
  }

  SPEC.klondike = {
    T: 7, fit: altDown, run: altDown, runReq: true, empty: isKing, fromF: true,
    deck: function (o) { return seq52(1); },
    deal: function (st, deck) {
      var counts = [1, 2, 3, 4, 5, 6, 7], T = st.G.T, k = 0, r, c;
      for (r = 0; r < 7; r++) for (c = r; c < 7; c++) st.P[T[c]].c.push(deck[k++]);
      for (c = 0; c < 7; c++) st.P[T[c]].f = c;
      restToStock(st, deck, k);
      st.x.pass = 1;
      if (st.o.scoring === 'vegas') st.score = -52;
    },
    gen: function (st, out) { genStd(st, out); genStock(st, out); },
    exec: function (n, mv) {
      if (mv.k === 'd') drawKl(n);
      else if (mv.k === 'r') {
        recycleKl(n);
        if (n.o.scoring === 'std') {
          if (n.o.draw === 1) n.score -= 100; else if (n.x.pass > 3) n.score -= 20;
          if (n.score < 0) n.score = 0;
        }
      }
    },
    afterM: function (n, mv, flipped) {
      if (n.o.scoring !== 'std') return;
      var ta = n.L[mv.a].t, tb = n.L[mv.b].t;
      if (ta === 'W' && tb === 'T') n.score += 5;
      else if (ta === 'W' && tb === 'F') n.score += 10;
      else if (ta === 'T' && tb === 'F') n.score += 10;
      else if (ta === 'F' && tb === 'T') n.score -= 15;
      if (flipped) n.score += 5;
      if (n.score < 0) n.score = 0;
    },
    settle: function (n) {
      if (n.o.scoring === 'vegas') n.score = -52 + 5 * countF(n);
      else if (n.o.scoring === 'none') n.score = countF(n);
    },
    won: function (st) { return countF(st) === 52; }
  };

  function seq52(copies) {
    var a = []; for (var k = 0; k < copies; k++) for (var i = 0; i < 52; i++) a.push(k * 52 + i); return a;
  }

  /* --- FreeCell (și variantele cu 3/5 celule) --- */
  SPEC.freecell = {
    fit: altDown, run: altDown, runReq: true, empty: function () { return true; }, toCell: true,
    cap: freeCap, safeAuto: true,
    deck: function (o, seed) { return msDeal(seed); },
    msDeck: true,
    deal: function (st, deck) {
      var T = st.G.T;
      for (var i = 0; i < 52; i++) st.P[T[i % 8]].c.push(deck[i]);
    },
    gen: function (st, out) { genStd(st, out); },
    exec: function () { },
    safe: function (st, c) { // sigură: nicio carte nu mai are nevoie de c în coloane
      var r = RK(c); if (r <= 2) return true;
      var F = st.G.F, red = RED(c), need = r - 1, ok = true;
      for (var i = 0; i < F.length; i++) {
        var m = st.L[F[i]], len = st.P[F[i]].c.length;
        if (RED(m.suit * 13) !== red && len < need) ok = false;
      }
      return ok;
    },
    won: function (st) { return countF(st) === 52; }
  };
  SPEC.freecell3 = SPEC.freecell; SPEC.freecell5 = SPEC.freecell;

  /* --- Spider --- */
  SPEC.spider = {
    noF: true,
    fit: anyDown, run: suitDown, runReq: true, empty: function () { return true; },
    deck: function (o) {
      var out = [], k, s, r;
      if (o.suits === 1) { for (k = 0; k < 8; k++) for (r = 0; r < 13; r++) out.push(k * 52 + r); }
      else if (o.suits === 2) { for (k = 0; k < 4; k++) for (s = 0; s < 2; s++) for (r = 0; r < 13; r++) out.push(k * 52 + s * 13 + r); }
      else { for (k = 0; k < 2; k++) for (s = 0; s < 4; s++) for (r = 0; r < 13; r++) out.push(k * 52 + s * 13 + r); }
      return out;
    },
    deal: function (st, deck) {
      var counts = [6, 6, 6, 6, 5, 5, 5, 5, 5, 5];
      var k = dealCols(st, deck, counts, function (i, n) { return n - 1; });
      restToStock(st, deck, k);
      st.score = 500;
    },
    gen: function (st, out) {
      genStd(st, out);
      var S = st.P[st.G.S];
      if (S.c.length) {
        var ok = true; st.G.T.forEach(function (t) { if (!st.P[t].c.length) ok = false; });
        if (ok) out.push({ k: 'd' });
      }
    },
    exec: function (n, mv) {
      if (mv.k === 'd') {
        var S = n.P[n.G.S];
        n.G.T.forEach(function (t) { n.P[t].c.push(S.c.pop()); });
        n.score--;
      }
    },
    afterM: function (n) { n.score--; },
    settle: function (n) {
      var removed = 0;
      n.G.T.forEach(function (ti) {
        var p = n.P[ti], len = p.c.length;
        if (len < 13 || len - 13 < p.f) return;
        var t = p.c[len - 1], ok = true;
        for (var k = 0; k < 13; k++) { var c = p.c[len - 1 - k]; if (RK(c) !== k + 1 || ST(c) !== ST(t)) { ok = false; break; } }
        if (!ok) return;
        var cs = p.c.splice(len - 13, 13), F = n.G.F, fi = -1;
        for (var j = 0; j < F.length; j++) if (!n.P[F[j]].c.length) { fi = F[j]; break; }
        n.P[fi].c = cs; removed++; flipTop(p);
      });
      n.score += 100 * removed;
    },
    won: function (st) { return countF(st) === 104; }
  };

  /* --- Yukon --- */
  SPEC.yukon = {
    fit: altDown, runReq: false, empty: isKing, fromF: true,
    deck: function () { return seq52(1); },
    deal: function (st, deck) {
      var counts = [1, 6, 7, 8, 9, 10, 11];
      dealCols(st, deck, counts, function (i) { return i; });
    },
    gen: function (st, out) { genStd(st, out); },
    exec: function () { },
    won: function (st) { return countF(st) === 52; }
  };

  /* --- Scorpion --- */

    if (k === 'u') undo(); else if (k === 'y') redo(); else if (k === 'h') { if (!$('hintBtn').hidden) doHint(); }
    else if (k === 'n') {
      // o apăsare accidentală nu pierde jocul: dacă s-au făcut mutări și jocul nu e terminat, cere a doua apăsare în 3 s
      var now = Date.now();
      if (G.ses.past.length && !G.over && now - nPressed > 3000) { nPressed = now; setMsg(t('n_again')); say(t('n_again')); }
      else { nPressed = 0; startGame(G.game, G.opts, randomDeal()); }
    }
    else if (k === 'a') { if (G.finPlan) runPlan(G.finPlan, 'fin'); }
  });

  /* ---------- ajutor / atlas / despre ---------- */
  function langEntry(a) { return (lang === 'ro' ? a.ro : a.en); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function buildHelp() {
    var body = $('helpBody'); body.textContent = '';
    var a = ATLAS.filter(function (x) { return x.id === G.game; })[0]; if (!a) return;
    var e = langEntry(a);
    if (lang !== 'ro' && lang !== 'en') body.appendChild(el('p', 'note', t('note_en')));
    body.appendChild(el('h3', '', t('lbl_rules')));
    var ul = el('ul'); e.rules.forEach(function (r) { ul.appendChild(el('li', '', r)); }); body.appendChild(ul);
    body.appendChild(el('h3', '', t('lbl_scoring'))); body.appendChild(el('p', '', e.scoring));
    body.appendChild(el('h3', '', t('lbl_impl'))); body.appendChild(el('p', '', e.impl));
  }
  var atlasFilter = 'all';
  function buildAtlas() {
    var grid = $('atlasGrid'); grid.textContent = '';
    var q = $('q').value.trim().toLowerCase();
    ATLAS.forEach(function (a) {
      if (atlasFilter === 'play' && !a.play) return;
      if (atlasFilter === 'only' && a.play) return;
      var e = langEntry(a);
      var hay = (e.name + ' ' + e.desc + ' ' + e.origin + ' ' + a.ro.name + ' ' + a.en.name + ' ' + e.rules.join(' ')).toLowerCase();
      if (q && hay.indexOf(q) < 0) return;
      var c = el('article', 'gcard');
      c.appendChild(el('h2', '', e.name));
      var bd = el('div', 'badges');
      bd.appendChild(el('span', 'badge ' + (a.play ? 'ok' : ''), a.play ? t('badge_play') : t('badge_atlas')));
      if (a.warn) bd.appendChild(el('span', 'badge warn', t('badge_warn')));
      a.tags.forEach(function (tg) { bd.appendChild(el('span', 'badge tag', t(tg))); });
      c.appendChild(bd);
      c.appendChild(el('p', '', e.desc));
      var dt = el('details'); dt.appendChild(el('summary', '', t('b_rules')));
      if (lang !== 'ro' && lang !== 'en') dt.appendChild(el('p', 'note', t('note_en')));
      dt.appendChild(el('h3', '', t('lbl_origin'))); dt.appendChild(el('p', '', e.origin));
      dt.appendChild(el('h3', '', t('lbl_rules')));
      var ul = el('ul'); e.rules.forEach(function (r) { ul.appendChild(el('li', '', r)); }); dt.appendChild(ul);
      if (e.scoring) { dt.appendChild(el('h3', '', t('lbl_scoring'))); dt.appendChild(el('p', '', e.scoring)); }
      dt.appendChild(el('h3', '', t('lbl_impl'))); dt.appendChild(el('p', '', e.impl));
      c.appendChild(dt);
      if (a.play) {
        var row = el('div', 'row'); var b = el('button', 'btn pri', t('b_play'));
        b.addEventListener('click', function () { showTab('play'); var o = (prefs.opts && prefs.opts[a.id]) || null; startGame(a.id, o, randomDeal()); saveGamePrefs(); });
        row.appendChild(b); c.appendChild(row);
      }
      grid.appendChild(c);
    });
  }
  var ABOUT = {
    ro: [
      ['Ce este', 'Un atlas de solitaire (pasiență) cu cărți, într-un singur fișier HTML, fără rețea, fără cont și fără telemetrie. Toate jocurile sunt pentru un singur jucător: nu există adversar AI. În locul lui: „Sugestie” (solver), „Rezolvă automat” (opțional) și, pentru FreeCell, „Se poate rezolva?”.'],
      ['Sugestii și solver – limite', 'Solverul este o căutare „best-first” cu euristică, cu limită de noduri și de timp. Folosește și cărțile întoarse (informație completă), deci este un ajutor, nu o simulare corectă. Dacă găsește un plan până la victorie, acesta este verificat prin reluare pe motorul de joc; dacă nu găsește, NU înseamnă că înțelegerea e nerezolvabilă. Pentru FreeCell, rezultatul este tri-stare: rezolvabil (plan verificat) / nerezolvat în limită / nu știu.'],
      ['Numere de înțelegere', 'Fiecare înțelegere are un număr reproductibil (generator PRNG determinist). „Înțelegere nouă” alege numărul cu crypto.getRandomValues (rejection sampling, fără bias). La FreeCell, numerotarea coincide cu înțelegerile Microsoft #1–#32000 (algoritm LCG public); compatibilitatea este doar algoritmică, fără legătură cu Microsoft.'],
      ['Confidențialitate', 'Nicio cerere de rețea, fără cookie-uri. Opțional se salvează în localStorage doar preferințele (limbă, opțiuni) și statisticile locale; dacă stocarea nu e disponibilă, aplicația funcționează la fel.'],
      ['Accesibilitate', 'Tastatură completă (săgeți + Enter/Spațiu), mesaje anunțate prin aria-live, contrast ridicat, ținte tactile mari, opțiune de 4 culori pentru daltonism, respectarea preferinței „mișcare redusă”.'],
      ['Mărci', 'Numele jocurilor sunt generice. „Microsoft”, „Windows” și „FreeCell” aparțin proprietarilor lor; aplicația nu este afiliată și nu folosește materiale ale acestora (cărțile sunt desenate aici).']
    ],
    en: [
      ['What it is', 'An atlas of solitaire (patience) card games in a single HTML file, with no network, no account and no telemetry. Every game is single-player: there is no AI opponent. Instead you get “Hint” (a solver), an optional “Auto-solve” and, for FreeCell, “Can it be solved?”.'],
      ['Hints and solver – limits', 'The solver is a heuristic best-first search with node and time limits. It also sees the face-down cards (perfect information), so it is a helper, not a fair simulation. When it finds a plan to victory the plan is verified by replaying it on the game engine; when it does not, that does NOT mean the deal is unsolvable. For FreeCell the answer is tri-state: solvable (verified plan) / not solved within the limit / unknown.'],
      ['Deal numbers', 'Every deal has a reproducible number (deterministic PRNG). “New deal” picks the number with crypto.getRandomValues (rejection sampling, no bias). For FreeCell the numbering matches the Microsoft deals #1–#32000 (public LCG algorithm); the compatibility is algorithmic only, with no link to Microsoft.'],
      ['Privacy', 'No network requests, no cookies. Optionally only preferences (language, options) and local statistics are saved in localStorage; if storage is unavailable the app works the same.'],
      ['Accessibility', 'Full keyboard play (arrows + Enter/Space), aria-live announcements, high contrast, large touch targets, a 4-colour option for colour blindness, reduced-motion support.'],
      ['Trademarks', 'Game names are generic. “Microsoft”, “Windows” and “FreeCell” belong to their owners; this app is not affiliated and uses none of their material (the cards are drawn here).']
    ]
  };
  function buildAbout() {
    var p = $('paneAbout'); p.textContent = '';
    if (lang !== 'ro' && lang !== 'en') p.appendChild(el('p', 'note', t('note_en')));
    (lang === 'ro' ? ABOUT.ro : ABOUT.en).forEach(function (x) { p.appendChild(el('h2', '', x[0])); p.appendChild(el('p', '', x[1])); });
    p.appendChild(el('h2', '', t('lbl_scoring') + ' – Klondike'));
    var a = ATLAS[0]; p.appendChild(el('p', '', langEntry(a).scoring));
  }

  /* ---------- taburi ---------- */
  function showTab(name) {
    ['Atlas', 'Play', 'About'].forEach(function (n) {
      var on = n.toLowerCase() === name;
      $('tab' + n).setAttribute('aria-selected', on ? 'true' : 'false');
      $('pane' + n).hidden = !on;
    });
    if (name === 'play') { render(false); }
  }

  /* ---------- inițializare ---------- */
  function init() {
    lang = detectLang();
    prefs.four = !!prefs.four;
    var ls = $('langSel');
    LANGS.forEach(function (l) { var o = document.createElement('option'); o.value = l; o.textContent = LANG_NAMES[l]; ls.appendChild(o); });
    ls.value = lang;
    var gs = $('gameSel');
    SOL.GAMES.forEach(function (g) {
      var a = ATLAS.filter(function (x) { return x.id === g; })[0];
      var o = document.createElement('option'); o.value = g; o.textContent = a ? a.en.name.replace(/ \(.*/, '') : g; gs.appendChild(o);
    });
    $('fourChk').checked = !!prefs.four;
    prefs.fit = !!prefs.fit; $('fitChk').checked = prefs.fit;
    $('safeChk').checked = prefs.safe !== false;
    $('autoFinChk').checked = prefs.autofin !== false;
    $('ctlBox').open = window.innerWidth >= 700;
    applyI18n(); buildAtlas(); buildAbout();
    ls.addEventListener('change', function () {
      lang = ls.value; prefs.lang = lang; savePrefs(); applyI18n(); updateCtlSummary(); buildAtlas(); buildAbout(); buildOptions(); buildHelp(); render(false); updateStatus();
    });
    $('tabAtlas').addEventListener('click', function () { showTab('atlas'); });
    $('tabPlay').addEventListener('click', function () { showTab('play'); });
    $('tabAbout').addEventListener('click', function () { showTab('about'); });
    $('q').addEventListener('input', buildAtlas);
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
      b.addEventListener('click', function () {
        atlasFilter = b.getAttribute('data-f');
        Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
        buildAtlas();
      });
    });
    gs.addEventListener('change', function () {
      var o = (prefs.opts && prefs.opts[gs.value]) || null; startGame(gs.value, o, randomDeal()); saveGamePrefs();
    });
    $('newBtn').addEventListener('click', function () { startGame(G.game, G.opts, randomDeal()); });
    $('sameBtn').addEventListener('click', function () { startGame(G.game, G.opts, G.seed); });
    $('goBtn').addEventListener('click', goSeed);
    $('seedIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') goSeed(); });
    function goSeed() {
      var raw = $('seedIn').value.trim(), v = /^\d{1,10}$/.test(raw) ? parseInt(raw, 10) : NaN;
      if (!(v >= 1 && v <= 2147483647)) { setMsg(t('bad_seed'), 'bad'); return; }
      startGame(G.game, G.opts, v);
    }
    $('undoBtn').addEventListener('click', undo);
    $('redoBtn').addEventListener('click', redo);
    $('hintBtn').addEventListener('click', doHint);
    $('finBtn').addEventListener('click', function () { if (G.finPlan) runPlan(G.finPlan, 'fin'); });
    $('solveBtn').addEventListener('click', doSolve);
    $('canBtn').addEventListener('click', doCanSolve);
    $('stopBtn').addEventListener('click', doStop);
    $('statsBtn').addEventListener('click', showStats);
    $('statsClose').addEventListener('click', function () { var d = $('statsDlg'); if (d.close) d.close(); else d.removeAttribute('open'); });
    $('statsReset').addEventListener('click', function () { store.del('sol.stats.v1'); showStats(); });
    $('clockBtn').addEventListener('click', function () { var m = SOL.moves(G.ses.st)[0]; if (m) doMove(m); });
    $('clockRunBtn').addEventListener('click', function () {
      var plan = [], cur = G.ses.st, m;
      while ((m = SOL.moves(cur)[0]) && plan.length < 80) { plan.push(m); cur = SOL.apply(cur, m); }
      runPlan(plan, 'clock');
    });
    $('fitChk').addEventListener('change', function () { prefs.fit = $('fitChk').checked; savePrefs(); render(false); });
    $('scrL').addEventListener('click', function () { board.scrollBy ? board.scrollBy({ left: -Math.round(board.clientWidth * 0.8), behavior: prefersReduced() ? 'auto' : 'smooth' }) : (board.scrollLeft -= board.clientWidth * 0.8); });
    $('scrR').addEventListener('click', function () { board.scrollBy ? board.scrollBy({ left: Math.round(board.clientWidth * 0.8), behavior: prefersReduced() ? 'auto' : 'smooth' }) : (board.scrollLeft += board.clientWidth * 0.8); });
    $('fourChk').addEventListener('change', function () { prefs.four = $('fourChk').checked; savePrefs(); render(false); });
    $('safeChk').addEventListener('change', function () { prefs.safe = $('safeChk').checked; savePrefs(); });
    $('autoFinChk').addEventListener('change', function () { prefs.autofin = $('autoFinChk').checked; savePrefs(); maybeAutoFinish(); });
    var rt = 0;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (!$('panePlay').hidden) render(false); }, 120); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { stopTimer(); } else if (G.started && !G.over) startTimer(); });
    var g0 = (prefs.game && SOL.GAMES.indexOf(prefs.game) >= 0) ? prefs.game : 'klondike';
    G.game = g0;
    G.opts = SOL.defaultOpts(g0); // inițial, pentru buildOptions
    startGame(g0, (prefs.opts && prefs.opts[g0]) || null, randomDeal());
    if (window.location.hash === '#play') showTab('play');
    window.__sol = { G: G, SOL: SOL, showTab: showTab, startGame: startGame, onTap: onTap };
  }
  init();
})();
/*APP-END*/

</script>
</body>
</html>
